:root:not([data-bs-theme="light"]) .money-in{background-color:var(--sunken)}

/* ===================== Tasks & notes refresh ===================== */
/* sidebar: bigger, clearer main areas */
.nav-item.nav-main{font-size:15px;font-weight:600;padding:9px 10px;gap:11px;letter-spacing:-.005em}
.nav-item.nav-main svg.i{width:19px;height:19px}
.nav-top .nav-item.nav-main{color:var(--ink-2)}
.nav-top.here>.nav-item.nav-main{color:var(--ink)}
.nav-item.nav-main .count{font-size:12.5px}
.nav-kids .nav-item.sub{font-size:13.5px}
.nav-label{font-size:11px}
#tags-sec{display:none!important}
.pop-tags{max-width:300px;padding:4px 4px 6px}
.pop-tags .tag span{opacity:.6;margin-left:4px}

/* task cards: same look as the task page */
.task-list{gap:8px;padding:8px 0 2px}
.task.tcard{align-items:flex-start;gap:12px;padding:13px 10px 13px 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);transition:border-color .12s,box-shadow .12s,transform .12s}
.task.tcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c,transparent)}
.task.tcard.has-color{background:color-mix(in srgb,var(--c) 7%,var(--surface-2))}
.task.tcard:hover{border-color:var(--accent-line);background:color-mix(in srgb,var(--accent) 4%,var(--surface-2));box-shadow:var(--shadow-1)}
.task.tcard.selected{box-shadow:0 0 0 2px var(--accent)}
.task.tcard .check{width:22px;height:22px;margin-top:1px}
.task.tcard .task-title{font:600 15.5px/1.35 var(--f-display);letter-spacing:-.005em}
.task.tcard.done{opacity:.72}
.tc-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tc-top .task-title{flex:1;min-width:160px}
.tc-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tc-fields{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px}
.tf{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.tf-ic{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.tf-ic svg.i{width:14px;height:14px}
.tf-ic.av-ic{background:none}
.tf-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.tf-l{font:600 9.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tf-v{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;display:flex;align-items:center;gap:6px}
.tf-v small{font-weight:500;color:var(--muted);font-size:12px}
.tf-v .dot{width:8px;height:8px}
.tf.link{cursor:pointer;border-radius:8px}
.tf.link:hover .tf-v{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.tf.late .tf-ic{background:var(--danger-soft);color:var(--danger)}.tf.late .tf-v{color:var(--danger)}
.tc-extra{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}
.tc-extra .tx{display:inline-flex;align-items:center;gap:5px}
.tc-extra svg.i{width:13px;height:13px}
.task.tcard .task-actions{margin-top:-3px}
.av.xs{width:22px;height:22px;font-size:9.5px}
@container (max-width:520px){.tc-fields{gap:8px 14px}.tf-ic{width:22px;height:22px}.tf-v{max-width:170px;font-size:13px}}
.group-head{border-bottom:0;padding:4px 0 0}
.group-head .group-title{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.group-head.alert .group-title{color:var(--danger)}
.group{margin-top:22px}

/* note cards */
.note-card.ncard{border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);padding:14px 16px 12px}
.note-card.ncard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,transparent)}
.note-card.ncard.has-color{background:color-mix(in srgb,var(--c) 8%,var(--surface-2));border-color:color-mix(in srgb,var(--c) 30%,var(--line-2))}
.note-card.ncard:hover{border-color:var(--accent-line);box-shadow:var(--shadow-2)}
.nc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nc-ic{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:var(--accent-soft);color:var(--accent);flex:none}
.nc-ic svg.i{width:13px;height:13px}
.nc-kicker{font:600 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nc-top .pin{position:static;margin-left:auto}
.note-card.ncard h3{font:650 16.5px/1.3 var(--f-display);margin:0 0 6px;padding:0}
.note-card.ncard .note-foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.nm{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.nm svg.i{width:13px;height:13px;color:var(--accent)}
.nm.today{color:var(--signal-ink)}
.nm .dot{width:8px;height:8px}

/* search-as-you-type boxes */
.cbx{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.cbx-ic{position:absolute;left:9px;color:var(--faint);pointer-events:none;display:flex}
.cbx-ic svg.i{width:14px;height:14px}
.cbx .cbx-in{width:100%;padding-left:30px!important;padding-right:30px!important}
.cbx-x{position:absolute;right:5px;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.cbx-x:hover{background:var(--hover);color:var(--ink)}
.cbx-x svg.i{width:12px;height:12px}
.cbx-x[hidden]{display:none}
.cbx-drop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:45;max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-2);padding:5px}
.cbx-drop[hidden]{display:none}
.cbx-g{padding:7px 9px 3px;font:700 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cbx-o{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:8px;text-align:left}
.cbx-o.on,.cbx-o:hover{background:var(--accent-soft)}
.cbx-av{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--accent)}
.cbx-av svg.i{width:14px;height:14px}
.cbx-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.cbx-t b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbx-t small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbx-badge{font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:1px 7px}
.cbx-none{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;font-size:13px;color:var(--ink-2)}
.cbx-none svg.i{width:14px;height:14px;color:var(--faint)}
.cbx-new .cbx-plus{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--accent-strong);color:#fff}
.cbx-new .cbx-plus svg.i{width:15px;height:15px;stroke-width:2.4}
.cbx-new b{color:var(--accent)}

/* contact: opens up */
.d-cx{grid-column:1/-1;margin:6px 0 2px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);overflow:visible}
.cx-head{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;text-align:left;border-radius:12px}
.cx-head:hover{background:var(--hover)}
.cx-ic{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none}
.cx-ic svg.i{width:15px;height:15px}
.cx-l{font-weight:650;font-size:14px}
.cx-chev{display:flex;color:var(--muted);transition:transform .16s}
.cx-chev svg.i{width:15px;height:15px}
.d-cx.open .cx-chev{transform:rotate(90deg)}
.cx-sum{margin-left:auto;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.cx-sum i{color:var(--faint)}
.cx-body{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:4px 12px 12px;border-top:1px solid var(--line)}
.cx-body[hidden]{display:none}
.cx-f{display:flex;flex-direction:column;gap:4px;min-width:0;margin-top:6px}
.cx-f.wide,.cx-save.wide,.cx-foot.wide{grid-column:1/-1}
.cx-f>span:first-child{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.cx-f>span:first-child svg.i{width:13px;height:13px}
.cx-in{display:flex;align-items:center;gap:6px}
.cx-in input{flex:1;min-width:0;height:34px}
.cx-f textarea{width:100%;resize:vertical;min-height:52px;line-height:1.45}
.cx-a{font-size:12px;font-weight:600;color:var(--accent);padding:4px 6px;border-radius:6px;white-space:nowrap}
.cx-a:hover{background:var(--accent-soft)}
.cx-save{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:9px;background:var(--signal-soft);color:var(--signal-ink);font-size:12.5px}
.cx-save .btn{margin-left:auto}
.cx-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:2px}
.cx-foot .btn{margin-left:auto}
.d-val .cbx{max-width:100%}
.ip-cx{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.ip-kick-link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit}
.ip-kick-link svg.i{width:12px;height:12px}
.ip-kick-link:hover{text-decoration:underline}

/* slide-out panel beside the editor */
.subpanel{position:fixed;z-index:29;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);box-shadow:-18px 0 40px rgba(0,0,0,.22);transform:translateX(100%);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
.subpanel.in{transform:none;opacity:1}
.subpanel.solo{z-index:61}
body.sub-open .detail{position:relative;z-index:31}
@media (max-width:1180px){body.sub-open .detail{position:fixed;z-index:31}}
.sp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sp-ic{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.sp-head h2{margin:0;font:700 17px var(--f-display)}
.sp-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.sp-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.sp-f.wide,.sp-sub.wide{grid-column:1/-1}
.sp-f>span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.sp-f>span svg.i{width:13px;height:13px;color:var(--muted)}
.sp-f input,.sp-f select,.sp-f textarea{width:100%;height:36px}
.sp-f textarea{height:auto;resize:vertical;line-height:1.45}
.sp-sub{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sp-sub svg.i{width:13px;height:13px}
.sp-hint{font-size:12px;color:var(--muted);margin:14px 0 0}
.sp-foot{display:flex;align-items:center;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.danger-t{color:var(--danger)!important}
@media (max-width:600px){.subpanel{border:0;box-shadow:none;transform:translateX(-100%)}.subpanel.in{transform:none}.subpanel{z-index:61}.sp-grid{grid-template-columns:1fr}}

/* contacts page */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.ccard{border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);overflow:hidden}
.cc-main{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 10px;text-align:left}
.cc-main:hover b{color:var(--accent)}
.cc-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.cc-t{display:flex;flex-direction:column;min-width:0}
.cc-t b{font:650 15px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-t small{font-size:12.5px;color:var(--muted)}
.cc-rows{display:flex;flex-direction:column;gap:5px;padding:0 14px 14px 66px;font-size:13px}
.cc-rows a,.cc-rows span{display:flex;align-items:center;gap:7px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-rows a:hover{color:var(--accent)}
.cc-rows svg.i{width:13px;height:13px;color:var(--muted);flex:none}
@media (max-width:700px){
  .task.tcard{padding:12px 8px 12px 14px}

  .tf-v{max-width:200px}
  .cx-body{grid-template-columns:1fr}
}

/* phones: the Edit button sits above the bottom bar */
@media (max-width:700px){body:not(.tool-mode):not(.screen-open) .ip-fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
:root .note-card.ncard.has-color{background:color-mix(in srgb,var(--c) 6%,var(--surface-2));border-color:color-mix(in srgb,var(--c) 28%,var(--line-2))}

/* ---------- invoices & payments ---------- */
.pos{color:var(--ok-ink)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.qtiles .bad b,.qmini .bad b{color:var(--danger)}
.qmini .bad{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.qr-date.late{color:var(--danger);font-weight:600}
.qr-amt small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.xw-bar.pay i{background:var(--c-prof)}
.jmoney.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.ni-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
.ni-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ni-m{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-width:0}
.ni-m:has(input[type=radio]:checked){border-color:var(--accent);background:var(--accent-soft)}

.ni-m>input{margin-top:3px}
.ni-m span{display:flex;flex-direction:column;gap:3px;min-width:0}
.ni-m small{color:var(--muted);font-size:12px;line-height:1.6}
.ni-m small input{width:58px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:500 12.5px var(--f-mono);text-align:right}
.ni-m small input#ni-amt{width:80px}
.ni-m i{font-style:normal;font-weight:600;color:var(--ink)}
.qpay h2{display:flex;align-items:center;gap:8px}
.qp-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;border-radius:6px}
.qp-row:hover{background:var(--surface-2)}
.qp-row span{display:flex;flex-direction:column;flex:1;min-width:0}
.qp-row b{font:600 14px var(--f-mono);color:var(--ok-ink)}
.qp-row small{font-size:12px;color:var(--muted)}
.qp-row svg{width:15px;height:15px;color:var(--faint)}
.qp-none{margin:4px 0 0;font-size:13px;color:var(--muted)}
.qt-row.qt-bal{border-bottom:0;font-weight:700}
.qt-row.qt-bal b{font-size:16px;color:var(--accent-strong)}
.xcat.pm[aria-checked=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
@media (max-width:900px){ .jmoney.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .ni-modes{grid-template-columns:minmax(0,1fr)} }

/* ---------- visits ---------- */
.av.xs{width:16px;height:16px;font-size:7.5px;margin-left:-3px;box-shadow:0 0 0 1.5px var(--surface)}
.se-vis{display:flex;gap:5px;margin:1px 0}
.se-live,.se-prog{display:inline-flex;align-items:center;gap:2px;font:600 10.5px/1.2 var(--f-body);color:var(--ink-2)}
.se-live svg,.se-prog svg{width:11px;height:11px}
.se-live{color:var(--ok)}
.se-prog.done{color:var(--ok)}
/* job calendar */
.jcal{margin-top:14px}
.jc-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.jc-bar .cal-nav{display:flex;align-items:center;gap:6px}
.jc-bar .cal-month{font:700 16px var(--f-display);margin-left:6px}
.jc-tg .tg-ad{cursor:pointer;min-height:30px}
.jc-tg .tg-ad:hover,.jc-tg .tg-slot:hover{background:var(--hover)}
.jc-dayv .tg{--n:1}
.jc-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.jc-month .cal-dow{padding:7px 8px;font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.jc-cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.jc-cell:nth-child(7n){border-right:0}
.jc-cell:hover{background:var(--hover)}
.jc-cell.out{background:var(--sunken)}.jc-cell.out .jc-num{color:var(--faint)}
.jc-num{font:600 12.5px var(--f-body);color:var(--ink-2)}
.jc-cell.today .jc-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff}
.jc-chip{display:flex;flex-direction:column;gap:2px;text-align:left;padding:4px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:3px solid var(--c);min-width:0;width:100%}
.jc-chip b{font:600 12px/1.25 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-chip span{display:flex;align-items:center;gap:0;padding-left:3px}
.jc-chip i{font:600 10.5px var(--f-body);font-style:normal;color:var(--muted);margin-left:6px}
.jc-more{font-size:11.5px;color:var(--muted);padding-left:4px}
.vrows{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:11px;background:var(--surface);text-align:left}
.vrow:hover{border-color:var(--accent-line);border-left-color:var(--c)}
.vr-date,.vr-main{display:flex;flex-direction:column;min-width:0}
.vr-date small,.vr-main small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr-stats{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.vr-stats span{display:inline-flex;align-items:center;gap:4px}.vr-stats svg{width:13px;height:13px}
.vr-live{color:var(--ok);font-weight:600}
.vr-prog{display:block!important;width:70px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.vr-prog i{display:block;height:100%;background:var(--ok)}
.sd-days{display:flex;gap:5px;flex-wrap:wrap;width:100%;margin-top:6px}
.chip-btn{padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);font-size:12px;color:var(--ink-2)}
.chip-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.sd-visit{display:flex;align-items:center;gap:12px;margin:14px 0;padding:12px 14px;border:1px solid var(--accent-line);border-radius:12px;background:var(--accent-soft)}
.sd-visit>div{display:flex;flex-direction:column;flex:1;min-width:0}
.sd-visit small{font-size:12px;color:var(--muted)}
/* visit page */
.vh-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.vh-acts .btn{min-height:40px}
.vh-me{margin-left:auto}
.chip.okchip{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.chip.livechip{color:var(--ok);font-weight:600}
.vc-card{padding:6px 14px}
.vc-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.vc-row:last-of-type{border-bottom:0}
.vc-who{display:flex;flex-direction:column;flex:1;min-width:0}
.vc-who small{font-size:12.5px;color:var(--muted)}
.vc-row.on .vc-who small{color:var(--ok);font-weight:600}
.vc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:vcpulse 1.6s infinite}
@keyframes vcpulse{0%,100%{opacity:1}50%{opacity:.3}}
.vc-btn{min-width:118px;justify-content:center}
.vc-log{margin:6px 0 4px;border-top:1px solid var(--line);padding-top:8px}
.vc-log summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);padding:4px 0}
.vc-sess{display:flex;flex-direction:column;margin-top:4px}
.vc-s{display:grid;grid-template-columns:minmax(0,1.2fr) 1fr 1.3fr auto 16px;gap:10px;align-items:center;padding:7px 4px;border-radius:7px;font-size:13px;text-align:left}
.vc-s:hover{background:var(--hover)}.vc-s svg{width:14px;height:14px;color:var(--faint)}
.vc-s b{font:600 13px var(--f-mono)}
.vc-note{margin:6px 2px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl-list{display:flex;flex-direction:column;gap:10px}
.cl-box{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.cl-box.complete{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.cl-head{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;text-align:left}
.cl-head:hover{background:var(--hover)}
.cl-head b{font:700 15px var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-caret{display:inline-flex;transition:transform .15s;color:var(--muted)}.cl-caret svg{width:16px;height:16px}
.cl-box:not(.open) .cl-caret{transform:rotate(-90deg)}
.cl-n{font:600 13px var(--f-mono);color:var(--ink-2)}
.cl-box.complete .cl-n{color:var(--ok)}
.cl-bar{width:90px;height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
.cl-bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.cl-body{padding:2px 14px 12px;border-top:1px solid var(--line)}
.cl-item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.cl-check{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:2px solid var(--line-2);color:transparent;background:var(--surface)}
.cl-check svg{width:18px;height:18px}
.cl-check:hover{border-color:var(--ok)}
.cl-item.done .cl-check{background:var(--ok);border-color:var(--ok);color:#fff}
.cl-t{display:flex;flex-direction:column;flex:1;min-width:0;padding-top:3px;font-size:14.5px}
.cl-item.done .cl-t>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.cl-t small{font-size:12px;color:var(--ok)}
.cl-empty{color:var(--muted);font-size:13px;margin:10px 0}
.cl-add{display:flex;align-items:center;gap:8px;margin-top:10px;padding:4px 4px 4px 10px;border:1px dashed var(--line-2);border-radius:9px}
.cl-add>span{display:inline-flex;color:var(--muted)}.cl-add>span svg{width:16px;height:16px}
.cl-add input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 0;outline:none}
.cl-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn.danger{color:var(--danger)}
.vp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vp-sec{padding:12px 14px}
.vp-h{display:flex;flex-direction:column;margin-bottom:10px}.vp-h small{font-size:12px;color:var(--muted)}
.vp-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.vp-tiles:empty{display:none}
.vp-tile{display:flex;flex-direction:column;gap:3px;min-width:0}
.vp-img{aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center}
.vp-img img{width:100%;height:100%;object-fit:cover}
.vp-img span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;font-size:11px;color:var(--muted);text-align:center;word-break:break-word}
.vp-cap{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vp-cap small{display:block;color:var(--faint)}
.vp-adds{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vp-add{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface-2)}
.vp-add:hover{border-color:var(--accent-line)}.vp-add svg{width:17px;height:17px}
.vlb{position:fixed;inset:0;z-index:4000;background:rgba(8,10,14,.92);display:flex;flex-direction:column}
.vlb-top{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff}
.vlb-top>span:first-child{display:flex;flex-direction:column;font-weight:600}.vlb-top small{font-weight:400;opacity:.7;font-size:12px}
.vlb-top .icon-btn{color:#fff}
.vlb-img{flex:1;display:grid;place-items:center;padding:10px;min-height:0;position:relative}
.vlb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.vlb-img .spin{position:absolute}
/* maps on visits */
.vm-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.vm-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vm-chip svg{width:15px;height:15px}.vm-chip small{color:var(--muted);font-size:12px}
.vm-quick{margin-top:10px}
.fv{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.fv-top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fv-title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.fv-title b{font:700 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.fv-title small{font-size:12px;color:var(--muted)}
.fv-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.fv-legend:empty{display:none}
.fl-i{display:inline-flex;align-items:center;gap:6px}.fl-i i{width:11px;height:11px;border-radius:50%;background:#8a8f98}
.fl-i.st-installed i{background:#16a34a}.fl-i.st-issue i{background:#e5484d}.fl-i.st-other i{background:transparent;border:2px solid #94a3b8}
.fl-bar{margin-left:auto;width:110px;height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}.fl-bar i{display:block;height:100%;background:#16a34a}
.fv-vp{position:relative;height:min(62vh,640px);min-height:320px;overflow:hidden;background:#e9ecf1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.fv.zoomed .fv-vp:active{cursor:grabbing}
.fv-stage{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
.fv-img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;box-shadow:0 1px 6px rgba(0,0,0,.15);background:#fff}
.fv-img:not([src]){visibility:hidden}
.fv-wash{position:absolute;inset:0;background:rgba(255,255,255,.28);pointer-events:none}
.fv-devs{position:absolute;inset:0}
.fv-dev{position:absolute;transform:translate(-50%,-50%) scale(var(--inv));display:flex;flex-direction:column;align-items:center;gap:1px;padding:0;background:none;border:0;cursor:pointer;z-index:1}
.fv-dev:hover,.fv-dev:focus-visible{z-index:3}
.fv-ic{display:grid;place-items:center;width:var(--ms,30px);height:var(--ms,30px);border-radius:50%;background:#7b8291;color:#fff;border:2.5px solid #fff;box-shadow:0 0 0 2px rgba(15,23,42,.55),0 2px 6px rgba(0,0,0,.35)}
.fv-ic svg{width:57%;height:57%}
.fv-ic img{width:18px;height:18px;object-fit:contain;filter:grayscale(1) brightness(1.6)}
.fv-dev:hover .fv-ic{transform:scale(1.15)}
.fv-lb{font:700 10px/1 var(--f-body);color:#1f2937;background:rgba(255,255,255,.92);padding:2px 4px;border-radius:4px;white-space:nowrap;box-shadow:0 0 0 1px rgba(15,23,42,.15)}
.fv-dev.st-installed .fv-ic{background:#16a34a;box-shadow:0 0 0 2px #0b5d2c,0 2px 6px rgba(0,0,0,.3)}
.fv-dev.st-issue .fv-ic{background:#e5484d;box-shadow:0 0 0 2px #8f1d21,0 2px 6px rgba(0,0,0,.3)}
.fv-dev.st-other .fv-ic{background:#cbd2dc;color:#475569;width:calc(var(--ms,30px)*.8);height:calc(var(--ms,30px)*.8);border-style:dashed}
.fv-dev.st-other .fv-ic svg{width:13px;height:13px}
.fv-b{position:absolute;top:-6px;right:-7px;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;font:800 11px/1 var(--f-body);font-style:normal;color:#fff;border:1.5px solid #fff}
.fv-b svg{width:11px;height:11px}.fv-b.ok{background:#0b7a3b}.fv-b.bad{background:#b42318}
.fv-ph{position:absolute;top:-6px;left:-7px;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1d4ed8;color:#fff;border:1.5px solid #fff}.fv-ph svg{width:9px;height:9px}
.fv-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px;color:#334155;font-size:14px;text-align:center}
.fv-msg[hidden]{display:none}
.fv-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.2);background:#fff}
.fv-zoom button{display:grid;place-items:center;width:40px;height:40px;color:#1f2937;border-bottom:1px solid #e5e7eb}.fv-zoom button:last-child{border-bottom:0}
.fv-zoom button:hover{background:#f1f5f9}.fv-zoom svg{width:19px;height:19px}
.fv-dots{display:flex;justify-content:center;gap:7px;padding:9px}
.fv-dots:empty{display:none}
.fv-dots button{width:9px;height:9px;border-radius:50%;background:var(--line-2);padding:0}
.fv-dots button.on{background:var(--accent);width:22px;border-radius:5px}
.fv.full{position:fixed;inset:0;z-index:3000;border-radius:0;border:0}
.fv.full .fv-vp{height:auto;flex:1}
body.fv-full{overflow:hidden}
/* device side tab */
.dp{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:3500;background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
.dp.open{transform:none;visibility:visible}
.dp-head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.dp-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#7b8291;color:#fff;flex:none}
.dp-ic svg{width:22px;height:22px}.dp-ic img{width:24px;height:24px;object-fit:contain}
.dp-ic.st-installed{background:#16a34a}.dp-ic.st-issue{background:#e5484d}
.dp-t{display:flex;flex-direction:column;flex:1;min-width:0}.dp-t b{font:700 18px var(--f-display)}.dp-t small{color:var(--muted);font-size:12.5px}
.dp-body{flex:1;overflow:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:14px}
.dp-orig{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.dp-orig div{display:flex;flex-direction:column;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.dp-orig span,.dp-l,.dp-f>span,.dp-note>span{font:600 11.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dp-orig b{font-size:13.5px}
.dp-note{padding:9px 11px;border-radius:9px;background:var(--signal-soft)}.dp-note p{margin:3px 0 0;white-space:pre-wrap;font-size:13.5px;color:var(--ink)}
.dp-sec{display:flex;flex-direction:column;gap:8px}
.dp-sec.hl{padding:10px;margin:0 -10px;border-radius:12px;background:var(--ok-soft)}
.dp-l em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ok);font-weight:600}
.dp-st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dp-st button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px;border-radius:11px;border:1.5px solid var(--line-2);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.dp-st button svg{width:20px;height:20px}
.dp-st button[aria-pressed=true]{border-color:var(--ink-2);background:var(--surface-2);color:var(--ink)}
.dp-st button.ok[aria-pressed=true]{border-color:#16a34a;background:#16a34a;color:#fff}
.dp-st button.bad[aria-pressed=true]{border-color:#e5484d;background:#e5484d;color:#fff}
.dp-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.dp-f input,.dp-f textarea{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:inherit;font-size:14.5px}
.dp-f textarea{resize:vertical}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dp-chk{display:flex;align-items:center;gap:8px;font-size:14px;padding-top:16px}
.dp-chk input{width:20px;height:20px}
.dp-ph{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dp-ph:empty{display:none}
.dp-ph button,.dp-up{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunken);display:grid;place-items:center;border:1px solid var(--line)}
.dp-ph img{width:100%;height:100%;object-fit:cover}
.dp-adds{display:flex;gap:8px}.dp-adds .btn{flex:1;justify-content:center;min-height:42px;cursor:pointer}
.dp-sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:8px 10px;border-radius:9px;background:var(--surface-2)}.dp-sync svg{width:15px;height:15px;flex:none}
.dp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
@media (max-width:900px){
  .vp-grid2{grid-template-columns:1fr}
  .vrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d s" "m m";row-gap:4px}
  .vr-date{grid-area:d}.vr-main{grid-area:m}.vr-stats{grid-area:s}
}
@media (max-width:640px){
  .jc-bar{gap:8px}.jc-bar .cal-month{font-size:14px;width:100%;order:3;margin:0}
  .jc-cell{min-height:64px;padding:3px}
  .jc-chip{padding:2px 3px}.jc-chip b{font-size:10.5px}.jc-chip span{display:none}
  .vh-acts .btn{flex:1 1 auto;justify-content:center}
  .vh-me{margin-left:0}
  .vc-btn{min-width:0}
  .vc-s{grid-template-columns:1fr 1fr auto;row-gap:2px}.vc-s>span:nth-child(2){display:none}.vc-s svg{display:none}
  .cl-bar{width:54px}
  .fv-vp{height:62vh;min-height:280px}
  .fl-bar{display:none}
  .dp{width:100vw;top:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
  .dp.open{transform:none}
}

.fv.tight .fv-lb{display:none}
.fv.tight .fv-ic{border-width:2px}
@media (max-width:640px){
  .fv-zoom{flex-direction:row;top:8px;right:8px}
  .fv-zoom button{width:36px;height:36px;border-bottom:0;border-right:1px solid #e5e7eb}.fv-zoom button:last-child{border-right:0}
}

/* ---------- install times & costs, estimates, progress report ---------- */
.eg{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--c)}
.eg svg{width:60%;height:60%}.eg img{width:62%;height:62%;object-fit:contain}
.est-chips{flex-wrap:wrap}
.est-tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:12px}
.et-row{display:grid;grid-template-columns:minmax(180px,2.2fr) repeat(6,minmax(70px,1fr));gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.et-row:last-child{border-bottom:0}
.et-row.head{background:var(--surface-2);font:700 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.et-row.head small{display:block;text-transform:none;letter-spacing:0;font-weight:500}
.et-row.zero .et-name b{color:var(--muted)}
.et-row.warnrow{background:color-mix(in srgb,var(--signal) 6%,transparent)}
.et-name{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.et-name b{font-weight:600}.et-name small{color:var(--muted);font-size:12px;width:100%;padding-left:31px;margin-top:-4px}
.et-name .av+b{margin-left:0}
.et-in,.et-sel{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);color:var(--ink);font:500 13px var(--f-mono)}
.et-sel{font-family:var(--f-body)}
.et-in::placeholder{color:var(--faint)}
.money-in.sm{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);padding-left:7px}
.money-in.sm span{color:var(--muted);font-size:12px}.money-in.sm .et-in{border:0;background:transparent;padding-left:3px}
.et-calc{font:500 13px var(--f-mono);color:var(--ink-2)}
.et-learn{color:var(--ok)!important}
.est-cab .et-row{grid-template-columns:minmax(160px,1.6fr) repeat(4,minmax(80px,1fr))}
.est-pay .et-row{grid-template-columns:minmax(180px,2fr) 1fr 1fr}
.est-h{font:700 14px var(--f-display);margin:22px 0 8px}.est-h small{font:500 12px var(--f-body);color:var(--muted);margin-left:6px}
.est-gen{margin-bottom:8px}
.est-card .btn{margin-top:4px}
.pr-in{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:8px;padding:2px 8px;background:var(--surface-2)}.pr-in input{width:80px;border:0;background:transparent;color:var(--ink);font:inherit}
.est-dlg-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.est-dlg-top>div{display:flex;flex-direction:column;flex:1}.est-dlg-top small{color:var(--muted)}
.est-crew{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}.est-crew input{width:64px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.est-tiles{margin-top:0}
.est-warn{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--signal-soft);color:var(--signal-ink);font-size:13px}
.est-warn div{display:flex;gap:8px;align-items:flex-start}.est-warn svg{width:16px;height:16px;flex:none;margin-top:2px}
.est-sum .et-row{grid-template-columns:minmax(170px,2.2fr) .6fr .9fr .7fr .9fr 1fr 1fr}
.est-sum.prog .et-row{grid-template-columns:minmax(170px,2.2fr) .6fr .9fr .9fr .7fr .9fr 1fr 1fr}
.est-sum-cab .et-row{grid-template-columns:minmax(170px,2.2fr) .8fr .6fr .8fr .9fr 1fr 1fr}
.sd-cost{display:flex;align-items:center;gap:12px;margin:-4px 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sd-cost>div{display:flex;flex-direction:column;flex:1;min-width:0}.sd-cost span{font-size:12px;color:var(--muted)}.sd-cost small{font-size:11.5px;color:var(--muted)}
/* progress report screen */
.fm-screen.rp{display:flex;flex-direction:column;background:var(--bg)}
.rp-top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.rp-title{display:flex;flex-direction:column;flex:1;min-width:0}.rp-title b{font:700 16px var(--f-display)}.rp-title span{font-size:12px;color:var(--muted)}
.rp-acts{display:flex;gap:8px;flex-wrap:wrap}
.rp-scroll{flex:1;overflow:auto}
.rp-body{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.rp-loading{display:flex;align-items:center;gap:10px;justify-content:center;padding:60px;color:var(--muted)}
.rp-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.rp-tile{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rp-tile span{display:block;font-size:12px;color:var(--muted)}.rp-tile b{display:block;font:700 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums}.rp-tile small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rp-tile.big b{font-size:30px}
.rp-bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;margin:6px 0 4px}.rp-bar i{display:block;height:100%;background:var(--ok)}
.rp-var{font-style:normal;font-weight:600;margin-left:4px}.rp-var.bad{color:var(--danger)}.rp-var.good{color:var(--ok-ink)}.rp-var.ok{color:var(--muted)}
.rp-sec{margin-bottom:18px}.rp-sec h2{display:flex;align-items:center;gap:8px;font:700 15px var(--f-display);margin:0 0 8px}.rp-sec h2 svg{width:17px;height:17px;color:var(--muted)}.rp-sec h2 small{font:500 12px var(--f-body);color:var(--muted)}
.rp-kv{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rp-kv>div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}.rp-kv>div:last-child{border-bottom:0}.rp-kv span{color:var(--ink-2)}.rp-kv b{text-align:right;font-weight:600}
.rp-dev .et-row{grid-template-columns:minmax(170px,2.2fr) .8fr .8fr 1fr .8fr .8fr .8fr}
.rp-dev .et-row span small{display:block;font-size:11px;color:var(--muted)}
.rp-dev .pos{color:var(--ok-ink);font-weight:600}.rp-dev .neg,.rp-dev em.neg{color:var(--danger);font-style:normal}
.rp-cab .et-row{grid-template-columns:minmax(160px,2fr) 1fr 1fr 1fr}
.rp-ppl .et-row{grid-template-columns:minmax(160px,2fr) .8fr 1fr .9fr .8fr .8fr}
.rp-vis .et-row{grid-template-columns:minmax(160px,2fr) 2fr .8fr .8fr}
.rp-trend .et-row{grid-template-columns:minmax(160px,2fr) .8fr 1fr 1fr 1fr}
.rp-trend span small,.rp-vis span small{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:900px){
  .rp-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .est-tbl{overflow-x:auto}.est-tbl .et-row{min-width:640px}
  .rp-acts .btn span{display:none}
}
@media (max-width:640px){ .rp-tile b{font-size:20px}.rp-tile.big b{font-size:24px}.rp-top{padding:8px 10px}.rp-body{padding:12px 12px 60px} }

/* ---------- team ---------- */
.team-mode .vh-me{display:none}
.tm-card .count.alert,.tm-pend .count.alert{background:var(--danger);color:#fff;padding:1px 8px;border-radius:99px;font-size:12px;margin-left:6px}
.tm-link{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tm-link input{flex:1;min-width:220px;padding:9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:500 13px var(--f-mono)}
.tm-auto{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0}.tm-auto input{width:18px;height:18px}
.tm-small{font-size:12.5px;color:var(--muted);margin-top:4px}
.tm-row{display:grid;grid-template-columns:minmax(200px,1.6fr) minmax(140px,.8fr) minmax(170px,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tm-row:last-child{border-bottom:0}
.tm-row.pend{grid-template-columns:minmax(200px,1.4fr) minmax(140px,.8fr) minmax(170px,1fr) auto}
.tm-who{display:flex;align-items:center;gap:10px;min-width:0}.tm-who>span,.tm-row.pend .tm-who{display:flex;flex-direction:column;min-width:0}
.tm-who b{font-weight:600}.tm-who small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tm-who em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px}.tm-who em.tm-own{color:var(--accent);margin-left:4px}
.tm-f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tm-f select{padding:7px 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:500 13.5px var(--f-body);text-transform:none;letter-spacing:0}
.tm-acts{display:flex;gap:6px;justify-content:flex-end}
.tm-gone{margin-top:10px}.tm-gone summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.tm-ri{display:flex;gap:10px;padding:6px 0;font-size:13.5px}.tm-ri b{min-width:96px}.tm-ri span{color:var(--ink-2)}
.tm-banner{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:11px 14px;border-radius:12px;border:1px solid var(--accent-line);background:var(--accent-soft)}
.tm-banner span{flex:1}.tm-banner svg{width:18px;height:18px;color:var(--accent)}
.acct{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}.acct svg{width:15px;height:15px}
@media (max-width:760px){ .tm-row,.tm-row.pend{grid-template-columns:1fr 1fr;row-gap:8px}.tm-who{grid-column:1/-1}.tm-acts{grid-column:1/-1;justify-content:flex-start} }
.tm-row.pend .tm-who{align-items:flex-start}

  const joinCode = () => lsG('bs-hub.join') || '';
  const cleanUrl = () => { if (/[?&]join=/.test(location.search)) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} } };
  try { sb = window.supabase.createClient(URL_, KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bs-hub-auth' } }); }
  catch (e) { console.error('Supabase client failed to load', e); }

  const netErr = e => {
    const m = String((e && (e.message || e.error_description || e)) || '');
    return !navigator.onLine || /Failed to fetch|NetworkError|network|Load failed|timeout|fetch/i.test(m);
  };
  const codeOf = e => netErr(e) ? 'unavailable' : (e && (e.code === '42501' || e.status === 401 || e.status === 403)) ? 'not_granted' : 'unknown';
  const fail = e => { const err = new Error((e && e.message) || 'Request failed'); err.code = codeOf(e); throw err; };

  /* ---------- the database the app talks to (same shape as the Claude version's) ---------- */
  function makeDb() {
    const snapDocs = rows => ({
      docs: rows.map(r => ({ id: r.id, exists: true, data: () => r.data })),
      empty: !rows.length, metadata: { fromCache: false },
    });
    return {
      collection(kind) {
        return {
          onSnapshot(cb, onErr) {
            const rows = new Map();
            let alive = true, chan = null;
            const emit = () => alive && cb(snapDocs([...rows.values()]));
            const load = async () => {
              const { data, error } = await sb.from(kind).select('id,data').eq('user_id', ORG());
              if (!alive) return;
              if (error) { onErr && onErr({ code: codeOf(error), message: error.message }); return; }
              rows.clear();
              for (const r of data || []) rows.set(r.id, r);
              emit();
            };
            chan = sb.channel('hub-' + kind + '-' + Math.random().toString(36).slice(2, 7))
              .on('postgres_changes', { event: '*', schema: 'public', table: kind, filter: 'user_id=eq.' + ORG() }, p => {
                if (p.eventType === 'DELETE') { if (p.old && p.old.id) rows.delete(p.old.id); }
                else if (p.new && p.new.id) rows.set(p.new.id, { id: p.new.id, data: p.new.data });
                emit();
              })
              .subscribe(status => { if (status === 'SUBSCRIBED') load(); });
            load().catch(e => onErr && onErr({ code: codeOf(e) }));
            // a full refresh now and then: phones drop the live connection while asleep
            const reload = () => load().catch(() => {});
            const onVis = () => { if (document.visibilityState === 'visible') reload(); };
            const tick = setInterval(reload, 5 * 60 * 1000);
            window.addEventListener('online', reload);
            document.addEventListener('visibilitychange', onVis);
            return () => { alive = false; clearInterval(tick); window.removeEventListener('online', reload); document.removeEventListener('visibilitychange', onVis); try { sb.removeChannel(chan); } catch (e) {} };
          },
        };
      },
      doc(path) {
        const i = path.indexOf('/'); const kind = path.slice(0, i), id = path.slice(i + 1);
        return {
          async set(obj) {
            let r;
            try { r = await sb.from(kind).upsert({ user_id: ORG(), id, data: obj }, { onConflict: 'user_id,id' }); } catch (e) { fail(e); }
            if (r.error) fail(r.error);
          },
          async delete() {
            let r;
            try { r = await sb.from(kind).delete().eq('user_id', ORG()).eq('id', id); } catch (e) { fail(e); }
            if (r.error) fail(r.error);
          },
        };
      },
    };
  }

  /* ---------- sign-in / create account ---------- */
  function authScreen(msg) {
    let el = $('#auth');
    if (el) el.remove();
    el = document.createElement('div');
    el.id = 'auth';
    const code = joinCode();
    let mode = code ? 'up' : 'in';
    const mark = document.querySelector('.brand-mark') ? document.querySelector('.brand-mark').outerHTML : '';
    const draw = () => {
      el.innerHTML = `<form class="auth-card" autocomplete="on" novalidate>
          <div class="auth-logo">${mark}</div>
          <h1 id="auth-h">${mode === 'up' ? 'Create your account' : 'B&amp;S Office Hub'}</h1>
          <p class="auth-sub" id="auth-sub">${mode === 'up' ? (code ? 'You’ve been invited to join the team.' : 'Use the invite link your admin sent you.') : 'Sign in to your jobs, schedule, tasks and maps.'}</p>
          <div class="auth-tabs" role="tablist"><button type="button" role="tab" data-m="in" aria-selected="${mode === 'in'}">Sign in</button><button type="button" role="tab" data-m="up" aria-selected="${mode === 'up'}">Create account</button></div>
          ${mode === 'up' ? `<label>Your name<input id="auth-name" autocomplete="name" maxlength="120" required placeholder="First and last name"></label>` : ''}
          <label>Email<input type="email" id="auth-email" autocomplete="username" required></label>
          <label>Password<input type="password" id="auth-pass" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}" required ${mode === 'up' ? 'minlength="8" placeholder="At least 8 characters"' : ''}></label>
          ${mode === 'up' && !code ? `<label>Invite link or code<input id="auth-code" autocomplete="off" placeholder="Paste the link from your admin"></label>` : ''}
          <div class="auth-err" id="auth-err" role="alert"></div>
          <button class="btn primary auth-go" type="submit" id="auth-go">${mode === 'up' ? 'Create account' : 'Sign in'}</button>
          <p class="auth-foot">${mode === 'up' ? 'New accounts start as a technician. An admin approves you and sets what you can see.' : 'Forgot your password? Ask your admin.'}</p>
        </form>`;
      el.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; draw(); }));
      el.querySelector('form').addEventListener('submit', submit);
      setTimeout(() => { const f = $('#auth-name') || $('#auth-email'); f && f.focus(); }, 50);
      if (code && mode === 'up') sb.rpc('org_by_code', { p_code: code }).then(r => { if (r && r.data && r.data.name && $('#auth-sub')) $('#auth-sub').innerHTML = `You’ve been invited to join <b>${escH(r.data.name)}</b>.`; }).catch(() => {});
    };
    const submit = async e => {
      e.preventDefault();
      const btn = $('#auth-go'), err = $('#auth-err');
      const email = $('#auth-email').value.trim(), pass = $('#auth-pass').value;
      err.textContent = '';
      if (mode === 'up') {
        const name = $('#auth-name').value.trim();
        let c = joinCode();
        if (!c && $('#auth-code')) { const v = $('#auth-code').value.trim(); const m = v.match(/[?&]join=([\w-]+)/); c = m ? m[1] : (/^[\w-]{6,64}$/.test(v) ? v : ''); if (c) lsS('bs-hub.join', c); }
        if (!name) { err.textContent = 'Type your name.'; return; }
        if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Type your email address.'; return; }
        if (pass.length < 8) { err.textContent = 'Use at least 8 characters for the password.'; return; }
        if (!c) { err.textContent = 'You need the invite link from your admin to create an account.'; return; }
        btn.disabled = true; btn.textContent = 'Creating your account…';
        try {
          const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { join_code: c, name }, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          lsS('bs-hub.myname', name);
          if (data.session && data.user) { user = data.user; el.remove(); afterSignIn(); return; }
          el.querySelector('.auth-card').innerHTML = `<div class="auth-logo">${mark}</div><h1>Check your email</h1><p class="auth-sub">We sent a confirmation link to <b>${escH(email)}</b>. Tap it, then come back here and sign in.</p><button class="btn primary auth-go" type="button" id="auth-back">Sign in</button>`;
          $('#auth-back').addEventListener('click', () => { mode = 'in'; draw(); $('#auth-email').value = email; });
        } catch (ex) {
          err.textContent = netErr(ex) ? 'Can’t reach the server. Check your connection and try again.' : /registered|exists/i.test(ex.message || '') ? 'There’s already an account with that email — sign in instead.' : /database error|sign-ups are closed/i.test(ex.message || '') ? 'This invite link doesn’t work any more. Ask your admin for a new one.' : (ex.message || 'Couldn’t create the account.');
          if (/registered|exists/i.test(ex.message || '')) { mode = 'in'; draw(); $('#auth-email').value = email; $('#auth-err').textContent = 'You already have an account — sign in and you’ll join the team.'; }
        } finally { const b2 = $('#auth-go'); if (b2) { b2.disabled = false; b2.textContent = mode === 'up' ? 'Create account' : 'Sign in'; } }
        return;
      }
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        user = data.user;
        el.remove();
        afterSignIn();
      } catch (ex) {
        err.textContent = netErr(ex) ? 'Can’t reach the server. Check your connection and try again.' : /confirm/i.test(ex.message || '') ? 'Confirm your email first — open the link we sent you.' : 'That email and password don’t match. Try again.';
      } finally { const b2 = $('#auth-go'); if (b2) { b2.disabled = false; b2.textContent = 'Sign in'; } }
    };
    document.body.appendChild(el);
    draw();
    if (msg) $('#auth-err').textContent = msg;
  }

  /* ---------- which company, which role ---------- */
  async function loadOrgs() {
    let r;
    try { r = await sb.rpc('my_orgs'); } catch (e) { return 'offline'; }
    if (r.error) {
      if (netErr(r.error)) return 'offline';
      if (/my_orgs|function|PGRST202|42883/i.test((r.error.message || '') + (r.error.code || ''))) return 'legacy';
      return 'offline';
    }
    orgs = Array.isArray(r.data) ? r.data : [];
    return orgs;
  }
  const cacheOrg = () => lsS('bs-hub.orgcache', org ? JSON.stringify({ ...org, uid: user.id }) : null);
  async function afterSignIn() {
    const code = joinCode();
    if (code) {
      try {
        const r = await sb.rpc('join_org', { p_code: code, p_name: lsG('bs-hub.myname') || '' });
        if (r && r.data && (r.data.ok || r.data.error)) { lsS('bs-hub.join', null); cleanUrl(); }
        if (r && r.data && r.data.error === 'code') lsS('bs-hub.badcode', '1');
      } catch (e) {}
    }
    const res = await loadOrgs();
    if (res === 'offline') {
      let cached = null; try { cached = JSON.parse(lsG('bs-hub.orgcache') || 'null'); } catch (e) {}
      if (cached && cached.uid === user.id) { org = cached; connect(); return; }
      gate('offline'); return;
    }
    if (res === 'legacy') { org = { org_id: user.id, role: 'admin', status: 'active', owner: true, legacy: true, name: '' }; connect(); return; }
    const active = orgs.filter(o => o.status === 'active');
    const saved = lsG('bs-hub.org');
    org = active.find(o => o.org_id === saved) || active[0] || null;
    if (!org) { gate(orgs.some(o => o.status === 'pending') ? 'pending' : 'none'); return; }
    cacheOrg(); cleanUrl();
    connect();
    watchMe();
  }
  function gate(kind) {
    let el = $('#auth'); if (el) el.remove();
    el = document.createElement('div'); el.id = 'auth';
    const p = orgs.find(o => o.status === 'pending');
    const mark = document.querySelector('.brand-mark') ? document.querySelector('.brand-mark').outerHTML : '';
    const body = kind === 'pending' ? `<h1>Waiting for approval</h1><p class="auth-sub">You’ve asked to join <b>${escH(p ? p.name : 'the team')}</b> as <b>${escH(p && p.member_name || (user && user.email) || '')}</b>. An admin needs to approve you — this page opens by itself as soon as they do.</p>`
      : kind === 'offline' ? `<h1>You’re offline</h1><p class="auth-sub">Connect to the internet once so the app can check your account.</p>`
      : `<h1>Not part of a team yet</h1><p class="auth-sub">${lsG('bs-hub.badcode') ? 'That invite link isn’t valid any more. ' : ''}Open the invite link your admin sent you${user ? ` while signed in as <b>${escH(user.email)}</b>` : ''}, or paste it here.</p><label class="auth-paste">Invite link<input id="gate-code" autocomplete="off" placeholder="https://…?join=…"></label><button class="btn primary auth-go" type="button" data-g="join">Join</button>`;
    el.innerHTML = `<div class="auth-card gate"><div class="auth-logo">${mark}</div>${body}<div class="gate-acts"><button class="btn" type="button" data-g="check">Check again</button><button class="btn ghost" type="button" data-g="out">Sign out</button></div></div>`;
    document.body.appendChild(el);
    const check = async () => { const res = await loadOrgs(); if (Array.isArray(res) && res.some(o => o.status === 'active')) { el.remove(); afterSignIn(); } else if (res === 'legacy') { el.remove(); afterSignIn(); } else if (Array.isArray(res) && kind !== 'none' && !res.some(o => o.status === 'pending')) { gate('none'); } else if (kind === 'offline' && Array.isArray(res)) { el.remove(); afterSignIn(); } };
    el.addEventListener('click', async e => { const b = e.target.closest('[data-g]'); if (!b) return;
      if (b.dataset.g === 'out') signOut();
      else if (b.dataset.g === 'check') { b.disabled = true; await check(); b.disabled = false; }
      else if (b.dataset.g === 'join') { const v = $('#gate-code').value.trim(); const m = v.match(/[?&]join=([\w-]+)/); const c = m ? m[1] : v; if (c) { lsS('bs-hub.join', c); lsS('bs-hub.badcode', null); el.remove(); afterSignIn(); } }
    });
    const t = setInterval(() => { if (!document.body.contains(el)) { clearInterval(t); return; } check(); }, 8000);
  }
  /* role changes reach this device right away */
  function watchMe() {
    if (!org || org.legacy) return;
    try {
      sb.channel('hub-me-' + Math.random().toString(36).slice(2, 7))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'members', filter: 'user_id=eq.' + user.id }, p => {
          const m = p.new; if (!m || m.org_id !== org.org_id) return;
          if (m.status !== 'active' || m.role !== org.role) { hooks.toast(m.status !== 'active' ? 'Your access was changed — reloading' : `You’re now ${m.role === 'admin' ? 'an admin' : m.role === 'manager' ? 'a manager' : 'a technician'} — reloading`); lsS('bs-hub.orgcache', null); setTimeout(() => location.reload(), 1500); }
          else if (m.person_id !== org.person_id) { org.person_id = m.person_id; cacheOrg(); hooks.render && hooks.render(); }
        }).subscribe();
    } catch (e) {}
  }

  function connect() {
    if (started) return;
    started = true;
    document.documentElement.classList.add('signed-in');
    hooks.connect(makeDb());
    if (window.HubCloudReady) window.HubCloudReady();
  }

  /* ---------- account ---------- */
  function openAccount() {
    const n = hooks.unsynced ? hooks.unsynced() : 0;
    hooks.openModal({
      title: 'Your account',
      body: `<p>Signed in as <b>${escH(user ? user.email : '')}</b>${org && !org.legacy ? ` · ${escH(org.name || '')} · <b>${org.role === 'admin' ? 'Admin' : org.role === 'manager' ? 'Manager' : 'Technician'}</b>` : ''}.</p>
        ${org && !org.legacy ? `<div class="field"><label for="acc-name">Your name</label><input id="acc-name" value="${escH(org.member_name || '')}" maxlength="120"></div><div class="field"><label for="acc-phone">Phone</label><input id="acc-phone" type="tel" value="${escH(org.phone || '')}" maxlength="60"></div>` : ''}
        <div class="field"><label for="acc-pass">New password</label><input id="acc-pass" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
        ${n ? `<p style="color:var(--danger)">${n} change${n === 1 ? '' : 's'} haven’t reached the server yet. Signing out now would lose them.</p>` : ''}
        <p style="color:var(--muted);font-size:13px">Install the app: on a computer use the install icon in the address bar; on iPhone/iPad tap Share → Add to Home Screen; on Android tap ⋮ → Install app.</p>`,
      actions: [
        { label: 'Sign out', kind: 'danger', act: () => { signOut(); } },
        { label: 'Close' },
        { label: 'Save', kind: 'primary', act: w => {
          const n = w.querySelector('#acc-name'), ph = w.querySelector('#acc-phone');
          if (n && (n.value.trim() !== (org.member_name || '') || ph.value.trim() !== (org.phone || ''))) {
            sb.rpc('update_my_profile', { p_org: ORG(), p_name: n.value.trim(), p_phone: ph.value.trim() }).then(({ error }) => { if (error) hooks.toast('Couldn’t save your profile'); else { org.member_name = n.value.trim(); org.phone = ph.value.trim(); cacheOrg(); hooks.toast('Profile saved'); } });
          }
          const v = w.querySelector('#acc-pass').value;
          if (!v) return;
          if (v.length < 8) { hooks.toast('Use at least 8 characters.'); return false; }
          sb.auth.updateUser({ password: v }).then(({ error }) => hooks.toast(error ? 'Couldn’t change it: ' + error.message : 'Password changed'));
        } },
      ],
    });
  }
  async function signOut() {
    try { await sb.auth.signOut(); } catch (e) {}
    hooks.clearLocal && hooks.clearLocal();
    try { for (const k of Object.keys(localStorage)) if (/^bs-hub|^punchlist\.cache/.test(k)) localStorage.removeItem(k); } catch (e) {}
    location.reload();
  }

  /* ---------- files: maps & drawings ('maps'), attachments & receipts ('files'), quote PDFs customers open ('quote-pdfs') ---------- */
  const files = {
    path: name => ORG() + '/' + name,
    async upload(name, blob, bucket = 'maps') {
      let r;
      try { r = await sb.storage.from(bucket).upload(ORG() + '/' + name, blob, { upsert: true, contentType: blob.type || 'application/octet-stream', cacheControl: bucket === 'quote-pdfs' ? '60' : '0' }); } catch (e) { fail(e); }
      if (r.error) fail(r.error);
      return ORG() + '/' + name;
    },
    async download(path, bucket = 'maps') {
      let r;
      try { r = await sb.storage.from(bucket).download(path); } catch (e) { fail(e); }
      if (r.error) fail(r.error);
      return r.data;
    },
    async remove(path, bucket = 'maps') {
      try { await sb.storage.from(bucket).remove([path]); } catch (e) {}
    },
    publicUrl(path) { return URL_ + '/storage/v1/object/public/quote-pdfs/' + path.split('/').map(encodeURIComponent).join('/'); },
  };

  /* ---------- customer quote links ---------- */
  const shares = {
    async put(row) {
      let r;
      try { r = await sb.from('quote_shares').upsert({ ...row, user_id: ORG() }, { onConflict: 'token' }); } catch (e) { fail(e); }
      if (r.error) fail(r.error);
    },
    async list() {
      let r;
      try { r = await sb.from('quote_shares').select('token,quote_id,status,viewed_at,responded_at,signer_name,signature,response_note,updated_at').eq('user_id', ORG()); } catch (e) { fail(e); }
      if (r.error) fail(r.error);
      return r.data || [];
    },
    watch(cb) {
      const ch = sb.channel('hub-shares-' + Math.random().toString(36).slice(2, 7))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'quote_shares', filter: 'user_id=eq.' + ORG() }, p => { if (p.new && p.new.token) cb(p.new); })
        .subscribe();
      return () => { try { sb.removeChannel(ch); } catch (e) {} };
    },
  };

  window.BSCloud = {
    get client() { return sb; },
    get user() { return user; },
    files,
    shares,
    url: URL_,
    key: KEY,
    openAccount,
    signOut,
    get org() { return org; },
    get role() { return org ? org.role : null; },
    inviteLink() { return org && org.join_code ? location.origin + location.pathname + '?join=' + encodeURIComponent(org.join_code) : ''; },
    team: {
      async list() { let r; try { r = await sb.from('members').select('*').eq('org_id', ORG()); } catch (e) { fail(e); } if (r.error) fail(r.error); return r.data || []; },
      async set(uid, { role = null, status = null, person = null } = {}) { const r = await sb.rpc('set_member', { p_org: ORG(), p_user: uid, p_role: role, p_status: status, p_person: person }); if (r.error) fail(r.error); return r.data; },
      async setOrg({ name = null, auto = null, newCode = false } = {}) { const r = await sb.rpc('set_org', { p_org: ORG(), p_name: name, p_auto: auto, p_new_code: !!newCode }); if (r.error) fail(r.error); Object.assign(org, { name: r.data.name, auto_approve: r.data.auto_approve, join_code: r.data.join_code }); cacheOrg(); return r.data; },
      watch(cb) { const ch = sb.channel('hub-team-' + Math.random().toString(36).slice(2, 7)).on('postgres_changes', { event: '*', schema: 'public', table: 'members', filter: 'org_id=eq.' + ORG() }, p => cb(p.new)).subscribe(); return () => { try { sb.removeChannel(ch); } catch (e) {} }; },
    },
    async start(h) {
      hooks = h;
      addEventListener('online', () => hooks.online && hooks.online());
      addEventListener('offline', () => hooks.offline && hooks.offline());
      if (!sb) { authScreen('The sign-in service didn’t load. Check your connection and reload.'); return; }
      let session = null;
      try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
      if (session && session.user) { user = session.user; afterSignIn(); }
      else authScreen();
      sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT' && started) location.reload(); if (s && s.user) user = s.user; });
    },
  };
})();

</script>
<script>
(function(){
'use strict';

/* =========================================================
   Helpers
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function debounce(fn,ms){let t=0,args=null;const f=(...a)=>{args=a;clearTimeout(t);t=setTimeout(()=>{t=0;fn(...args)},ms)};f.flush=()=>{if(t){clearTimeout(t);t=0;fn(...(args||[]))}};f.cancel=()=>{clearTimeout(t);t=0};return f;}
const validId=id=>typeof id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(id)&&id!=='.'&&id!=='..';

const IC={
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 star:'<path d="M12 3.6l2.55 5.2 5.75.83-4.16 4.05.98 5.72L12 16.7l-5.12 2.7.98-5.72L3.7 9.63l5.75-.83z"/>',
 more:'<circle cx="5.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d);};

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDay(s){
  if(!s) return '';
  const d=diffDays(s,today());
  if(d===0) return 'Today'; if(d===1) return 'Tomorrow'; if(d===-1) return 'Yesterday';
  const dt=toDate(s);
  if(d>1&&d<7) return DOW_LONG[dt.getDay()];
  const sameYear=dt.getFullYear()===new Date().getFullYear();
  return `${DOW[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()}${sameYear?'':', '+dt.getFullYear()}`;
}
const fmtLong=s=>{const dt=toDate(s);return `${DOW_LONG[dt.getDay()]}, ${MONTHS_LONG[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;};
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; const hh=h%12||12; return m?`${hh}:${pad(m)}${ap}`:`${hh}${ap}`; }
function fmtStamp(ms){ if(!ms) return '—'; const d=new Date(ms); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} · ${fmtTime(pad(d.getHours())+':'+pad(d.getMinutes()))}`; }
/* ---------- added-on + time-left ---------- */
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function spanText(ms){
  const min=Math.round(ms/60000);
  if(min<60) return `${Math.max(1,min)} min`;
  const hrs=Math.floor(min/60);
  if(hrs<24) return plural(hrs,'hr');
  return plural(Math.floor(hrs/24),'day');
}
function dueMoment(t){ const d=toDate(t.due); if(t.time){ const [h,m]=t.time.split(':').map(Number); d.setHours(h,m,0,0); } else d.setHours(23,59,59,999); return d.getTime(); }
function dueInfo(t,now=Date.now()){
  if(!t||!t.due) return null;
  const when=`Due ${fmtLong(t.due)}${t.time?' at '+fmtTime(t.time):''}`;
  if(t.done){
    if(!t.doneAt) return null;
    const late=t.doneAt-dueMoment(t);
    return late>0?{done:true,late:true,text:`Finished ${spanText(late)} late`,title:when}:{done:true,ok:true,text:'Finished on time',title:when};
  }
  const td=today(), d=diffDays(t.due,td);
  if(t.time){
    const ms=dueMoment(t)-now;
    if(ms<=0) return {late:true,text:`Late by ${spanText(-ms)}`,title:when};
    if(ms<24*3600000) return {soon:true,text:`${spanText(ms)} left`,title:when};
    return {soon:d<=2,text:`${plural(Math.max(1,d),'day')} left`,title:when};
  }
  if(d<0) return {late:true,text:`Late by ${plural(-d,'day')}`,title:when};
  if(d===0) return {soon:true,text:'Due today',title:when};
  return {soon:d<=2,text:`${plural(d,'day')} left`,title:when};
}
function cdClass(i){ return 'chip cd'+(i.late?' late':i.soon?' soon':i.ok?' ok':''); }
function cdHTML(t,extra=''){ const i=dueInfo(t); if(!i) return ''; return `<span class="${cdClass(i)}${extra?' '+extra:''}" data-cd="${t.id}" title="${esc(i.title)}">${icon('clock')}<span class="cd-t">${esc(i.text)}</span></span>`; }
function addedText(ms,now=Date.now()){
  if(!ms) return '';
  const d=new Date(ms), day=ymd(d), td=today();
  const tm=fmtTime(pad(d.getHours())+':'+pad(d.getMinutes()));
  if(day===td){ const min=Math.round((now-ms)/60000); return min<1?'Added just now':min<60?`Added ${min} min ago`:`Added today ${tm}`; }
  const dd=diffDays(td,day);
  if(dd===1) return `Added yesterday ${tm}`;
  if(dd<7) return `Added ${dd} days ago`;
  return `Added ${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear()===new Date().getFullYear()?'':', '+d.getFullYear()}`;
}

function advance(s,r){
  const d=toDate(s);
  switch(r){
    case 'daily': d.setDate(d.getDate()+1); break;
    case 'weekdays': do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6); break;
    case 'weekly': d.setDate(d.getDate()+7); break;
    case 'biweekly': d.setDate(d.getDate()+14); break;
    case 'monthly': { const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+1); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); break; }

  }
  return ymd(d);
}
