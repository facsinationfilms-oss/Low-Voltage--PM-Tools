const saveCache=debounce(()=>{ if(cacheOff) return; lsSet(CACHE_KEY,JSON.stringify({source:cacheSource,savedAt:Date.now(),pending:pendingList(),...snapshotAll()})); },400);

/* =========================================================
   Store: syncs to the artifact database when available,
   otherwise keeps everything in this browser.
   ========================================================= */
const SYNC_TEXT={connecting:'Connecting…',saving:'Saving…',synced:'All changes saved',retrying:'Reconnecting…',local:'Saved in this browser',error:'Some changes weren’t saved',offline:'Offline — changes saved on this device'};
function setSync(state,text){ const el=$('#sync'); if(!el) return; el.dataset.state=state; $('#sync-text').textContent=text||SYNC_TEXT[state]||''; el.title=state==='synced'?'Synced to your account — available on all your devices':state==='local'?'Stored in this browser only':state==='offline'?'No connection. Your changes are kept on this device and sync automatically when you’re back online.':''; }
const Store={
  mode:'connecting',db:null,pending:new Map(),inflight:new Set(),timer:0,backoff:0,tries:{},ready:false,unsubs:[],readonly:false,
  put(kind,obj){ S[kind][obj.id]=obj; this.queue(kind,obj.id,'set'); },
  del(kind,id){ delete S[kind][id]; this.queue(kind,id,'del'); },
  queue(kind,id,op){
    saveCache();
    if(this.mode==='local') return;
    this.pending.set(kind+'/'+id,{kind,id,op});
    if(this.mode==='db'&&this.ready){ setSync('saving'); this.schedule(350); }
  },
  schedule(ms){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),ms); },
  dirty(kind,id){ const k=kind+'/'+id; return this.pending.has(k)||this.inflight.has(k); },
  async flush(){
    if(this.mode!=='db'||!this.db||!this.ready) return;
    const keys=[...this.pending.keys()].filter(k=>!this.inflight.has(k));
    if(!keys.length){ if(!this.inflight.size&&!this.pending.size) setSync('synced'); return; }
    let i=0;
    const run=async key=>{
      const w=this.pending.get(key); if(!w) return;
      this.pending.delete(key); this.inflight.add(key);
      try{
        const ref=this.db.doc(key);
        if(w.op==='del') await ref.delete();
        else{ const obj=S[w.kind][w.id]; if(obj) await ref.set(clone(obj)); }
        delete this.tries[key]; this.backoff=0;
      }catch(e){ this.onError(e,key,w); }
      finally{ this.inflight.delete(key); }
    };
    const workers=Array.from({length:Math.min(4,keys.length)},async()=>{ while(i<keys.length){ await run(keys[i++]); } });
    await Promise.all(workers);
    if(this.pending.size){ this.schedule(this.backoff||60); }
    else if(!this.inflight.size){ setSync(this.hadError?'error':'synced'); this.hadError=false; }
  },
  onError(e,key,w){
    const code=e&&e.code;
    if(this.cloud&&code==='unavailable'){
      // no connection: keep the change and keep trying — nothing is lost
      if(!this.pending.has(key)) this.pending.set(key,w);
      this.backoff=Math.min((this.backoff||1500)*2,30000); setSync('offline'); saveCache(); return;
    }
    this.tries[key]=(this.tries[key]||0)+1;
    if((code==='unavailable'||code==='resource_exhausted'||!code)&&this.tries[key]<6){
      if(!this.pending.has(key)) this.pending.set(key,w);
      this.backoff=Math.min((this.backoff||400)*2,8000)+Math.random()*300; setSync('retrying'); return;
    }
    this.hadError=true;
    if(code==='quota_exceeded') toast('Storage is full. Delete some old tasks or notes to save new ones.',{ms:8000});
    else if(code==='invalid_argument'){
      const obj=S[w.kind]&&S[w.kind][w.id];
      if(obj&&JSON.stringify(obj).length>250000) toast('That note is too large to save. Split it into two notes.',{ms:8000});
      else{ this.readonly=true; toast('You can view this task manager but not change it.',{ms:8000}); }
    }
    else if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){ goLocal(true); }
    else toast('A change couldn’t be saved. It’s kept in this browser; reload to retry.',{ms:8000});
  },
};
let localSeed=null;
function goLocal(fromError){
  Store.unsubs.forEach(u=>{try{u()}catch(e){}}); Store.unsubs=[];
  Store.mode='local'; Store.db=null; Store.pending.clear(); cacheSource='local';
  setSync('local'); saveCache();
  if(fromError) toast('Sync is unavailable right now — changes are being saved in this browser.',{ms:7000});
  scheduleRender();
}
function connectDb(db){
  Store.db=db; Store.mode='db'; setSync('connecting');
  localSeed=cacheSource==='local'?clone(snapshotAll()):null;
  for(const w of savedPending){ if(w.op==='del'||S[w.kind][w.id]) Store.pending.set(w.kind+'/'+w.id,{kind:w.kind,id:w.id,op:w.op}); }
  savedPending=[];
  const got={}, definitive={};
  let finished=false;
  const finish=()=>{
    if(finished) return; finished=true;
    // bring over anything created in this browser before sync existed
    if(localSeed){
      let n=0;
      for(const k of KINDS) for(const o of localSeed[k]||[]){ if(!S[k][o.id]){ Store.put(k,NORM[k](o)); n++; } }
      localSeed=null;
    }
    cacheSource='db'; Store.ready=true; saveCache(); setTimeout(hubReady,0);
    if(Store.pending.size){ setSync('saving'); Store.schedule(50); } else setSync(Store.cloud&&navigator.onLine===false?'offline':'synced');
    scheduleRender();
  };
  KINDS.forEach(kind=>{
    const sub=()=>{
      const u=db.collection(kind).onSnapshot(snap=>{
        applySnapshot(kind,snap,!!got[kind]); got[kind]=true;
        if(!snap.metadata.fromCache) definitive[kind]=true;
        if(KINDS.every(k=>definitive[k])) finish();
      },err=>{
        const code=err&&err.code;
        if(code==='unavailable'){ setSync('retrying'); setTimeout(sub,3000+Math.random()*2000); }
        else if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed') goLocal(true);
        else{ setSync('error'); }
      });
      Store.unsubs.push(u);
    };
    sub();
  });
  setTimeout(()=>{ if(!finished&&KINDS.every(k=>got[k])) finish(); },9000);
  setTimeout(()=>{ if(!finished&&!KINDS.some(k=>got[k])&&Store.mode==='db'&&!Store.cloud) goLocal(true); },15000);
}
function applySnapshot(kind,snap,seenBefore){
  if(!seenBefore&&snap.metadata.fromCache&&snap.empty&&Object.keys(S[kind]).length) return;
  const next={};
  for(const d of snap.docs){ if(!d.exists) continue; const o=d.data(); if(o&&validId(d.id)) next[d.id]=NORM[kind]({...o,id:d.id}); }
  for(const key of [...Store.pending.keys(),...Store.inflight]){
    const i=key.indexOf('/'); if(key.slice(0,i)!==kind) continue;
    const id=key.slice(i+1);
    if(S[kind][id]) next[id]=S[kind][id]; else delete next[id];
  }
  const prev=S[kind]; const pk=Object.keys(prev);
  const same=pk.length===Object.keys(next).length&&pk.every(k=>next[k]&&JSON.stringify(prev[k])===JSON.stringify(next[k]));
  S[kind]=next;
  saveCache();
  if(same) return;
  if(UI.detail&&UI.detail.kind===kind&&!S[kind][UI.detail.id]) closeDetail(true);
  scheduleRender();
}

/* =========================================================
   Mutations
   ========================================================= */
function patch(kind,id,p){ const o=S[kind][id]; if(!o) return null; const n={...o,...p,updatedAt:Date.now()}; Store.put(kind,n); scheduleRender(); return n; }
function putNew(kind,o){ Store.put(kind,o); scheduleRender(); return o; }
function minOrder(kind){ let m=Infinity; for(const o of Object.values(S[kind])) if(o.order<m) m=o.order; return m===Infinity?0:m; }
function maxOrder(kind,filter){ let m=-Infinity; for(const o of Object.values(S[kind])) if((!filter||filter(o))&&o.order>m) m=o.order; return m===-Infinity?0:m; }
function createTask(p={},opts={}){
  const now=Date.now();
  const t=NORM.tasks({id:uid('t'),order:minOrder('tasks')-1,createdAt:now,updatedAt:now,...p});
  putNew('tasks',t);
  if(opts.open) openDetail('tasks',t.id,{focusTitle:true,isNew:true});
  return t;
}
function createNote(p={},opts={}){
  const now=Date.now();
  const n=NORM.notes({id:uid('n'),order:minOrder('notes')-1,createdAt:now,updatedAt:now,size:'m',...p});
  putNew('notes',n);
  if(opts.open) openDetail('notes',n.id,{focusTitle:true,isNew:true});
  return n;
}
function createFolder(p={}){
  const now=Date.now();
  const used=Object.values(S.folders).length;
  const f=NORM.folders({id:uid('f'),name:'New list',color:PALETTE[(used*5+8)%PALETTE.length][1],order:maxOrder('folders',x=>(x.parentId||null)===(p.parentId||null))+1,createdAt:now,updatedAt:now,...p});
  putNew('folders',f); return f;
}
function toggleDone(id){
  const t=S.tasks[id]; if(!t) return;
  if(t.done){ patch('tasks',id,{done:false,doneAt:0}); return; }
  const before=clone(t);
  if(t.repeat){
    const base=t.due||today();
    let nd=advance(base,t.repeat); let guard=0;
    while(nd<=today()&&guard++<2000) nd=advance(nd,t.repeat);
    const next=createTask({...clone(t),id:uid('t'),due:nd,done:false,doneAt:0,subtasks:t.subtasks.map(s=>({...s,id:uid('s'),done:false})),createdAt:Date.now(),order:t.order-0.001});
    patch('tasks',id,{done:true,doneAt:Date.now(),repeat:''});
    toast(`Done — next one is ${fmtDay(nd).toLowerCase().startsWith('to')?fmtDay(nd).toLowerCase():'on '+fmtDay(nd)}`,{action:()=>{ Store.del('tasks',next.id); Store.put('tasks',before); scheduleRender(); refreshDetail(); }});
  }else{
    patch('tasks',id,{done:true,doneAt:Date.now()});
    toast('Task completed',{action:()=>{ Store.put('tasks',{...before,updatedAt:Date.now()}); scheduleRender(); refreshDetail(); }});
  }
  refreshDetail();
}
function deleteTask(id){
  const t=S.tasks[id]; if(!t) return;
  if(UI.detail&&UI.detail.id===id) closeDetail(true);
  Store.del('tasks',id); scheduleRender();
  toast(`Deleted “${trunc(t.title||'Untitled task',40)}”`,{action:()=>{ Store.put('tasks',t); scheduleRender(); }});
}
function deleteNote(id){
  const n=S.notes[id]; if(!n) return;
  if(UI.detail&&UI.detail.id===id) closeDetail(true);
  Store.del('notes',id); scheduleRender();
  toast(`Deleted note “${trunc(n.title||'Untitled note',40)}”`,{action:()=>{ Store.put('notes',n); scheduleRender(); }});
}
function duplicateTask(id){ const t=S.tasks[id]; if(!t) return; const c=createTask({...clone(t),id:uid('t'),title:(t.title||'Untitled task')+' (copy)',subtasks:t.subtasks.map(s=>({...s,id:uid('s')})),order:t.order+0.0005,createdAt:Date.now(),done:false,doneAt:0}); toast('Task duplicated',{label:'Open',action:()=>openDetail('tasks',c.id)}); }
function duplicateNote(id){ const n=S.notes[id]; if(!n) return; const c=createNote({...clone(n),id:uid('n'),title:(n.title||'Untitled note')+' (copy)',order:n.order+0.0005,createdAt:Date.now()}); toast('Note duplicated',{label:'Open',action:()=>openDetail('notes',c.id)}); }
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

/* ---------- folders ---------- */
const byOrder=(a,b)=>a.order-b.order||a.createdAt-b.createdAt;
const folderParent=f=>f.parentId&&S.folders[f.parentId]&&f.parentId!==f.id?f.parentId:null;
function childrenOf(pid){ return Object.values(S.folders).filter(f=>folderParent(f)===(pid||null)).sort(byOrder); }
function flatTree(){ const out=[],seen=new Set(); const walk=(p,d)=>{ for(const f of childrenOf(p)){ if(seen.has(f.id)) continue; seen.add(f.id); out.push({f,d}); walk(f.id,d+1);} }; walk(null,0); return out; }
function descendants(id){ const out=[],seen=new Set([id]); const walk=p=>{ for(const c of childrenOf(p)){ if(seen.has(c.id)) continue; seen.add(c.id); out.push(c.id); walk(c.id);} }; walk(id); return out; }
function folderPath(id){ const out=[]; let f=S.folders[id],g=0; while(f&&g++<40){ out.unshift(f); const p=folderParent(f); f=p?S.folders[p]:null; } return out; }
const pathName=id=>folderPath(id).map(f=>f.name).join(' / ');
function findFolderByName(tok){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const q=norm(tok); if(!q) return null;
  const all=Object.values(S.folders);
  return all.find(f=>norm(f.name)===q)||all.find(f=>norm(f.name).startsWith(q))||null;
}
function allTags(){ const m=new Map(); for(const o of [...Object.values(S.tasks),...Object.values(S.notes)]) for(const t of o.tags) m.set(t,(m.get(t)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }

/* =========================================================
   Rich text sanitizing
   ========================================================= */
const ALLOW=new Set('A B STRONG I EM U S STRIKE DEL BR P DIV UL OL LI H1 H2 H3 BLOCKQUOTE CODE PRE HR SPAN SUB SUP'.split(' '));
const KILL=new Set('SCRIPT STYLE IFRAME OBJECT EMBED SVG MATH TEMPLATE NOSCRIPT TEXTAREA INPUT SELECT BUTTON FORM LINK META IMG PICTURE VIDEO AUDIO CANVAS HEAD TITLE BASE FRAME FRAMESET'.split(' '));
const sanCache=new Map();
function sanitize(html){
  if(!html) return '';
  const hit=sanCache.get(html); if(hit!==undefined) return hit;
  const doc=new DOMParser().parseFromString('<!doctype html><body>'+html,'text/html');
  cleanNode(doc.body);
  const out=doc.body.innerHTML;
  if(sanCache.size>600) sanCache.clear();
  sanCache.set(html,out); return out;
}
function cleanNode(node){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3) continue;
    if(ch.nodeType!==1){ ch.remove(); continue; }
    const tag=ch.tagName;
    if(KILL.has(tag)){ ch.remove(); continue; }
    cleanNode(ch);
    if(!ALLOW.has(tag)){ ch.replaceWith(...Array.from(ch.childNodes)); continue; }
    for(const a of Array.from(ch.attributes)){
      const n=a.name.toLowerCase(); let keep=false;
      if(tag==='A'&&n==='href'&&/^(https?:|mailto:)/i.test(a.value.trim())) keep=true;
      if(tag==='UL'&&n==='class'&&a.value.split(/\s+/).includes('checklist')) keep=true;
      if(tag==='LI'&&n==='data-checked'&&a.value==='true') keep=true;
      if(!keep) ch.removeAttribute(a.name);
    }
    if(tag==='UL'&&ch.hasAttribute('class')) ch.setAttribute('class','checklist');
    if(tag==='A'){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener noreferrer'); }
  }
}
function htmlText(html){
  if(!html) return '';
  return html.replace(/<(br|\/p|\/div|\/li|\/h\d|\/blockquote|\/pre)[^>]*>/gi,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
}
const hasText=html=>!!htmlText(html);
function textToHtml(t){ return esc(t).split(/\n/).map(l=>`<div>${l||'<br>'}</div>`).join(''); }

/* =========================================================
   Quick-add parser
   ========================================================= */
const WD={sunday:0,monday:1,mon:1,tuesday:2,tue:2,tues:2,wednesday:3,thursday:4,thu:4,thur:4,thurs:4,friday:5,fri:5,saturday:6};
const MON={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
function futureDate(m,d,y){ const now=new Date(); let yr=y||now.getFullYear(); let dt=new Date(yr,m,d); if(dt.getMonth()!==m) return ''; if(!y&&ymd(dt)<today()) dt=new Date(yr+1,m,d); return ymd(dt); }
function parseQuick(text){
  const out={title:'',tags:[],priority:0,due:'',time:'',repeat:'',folderId:undefined,tokens:[]};
  let s=' '+text+' ';
  const take=(re,fn)=>{ s=s.replace(re,(...m)=>{ const r=fn(...m); return r===false?m[0]:' '; }); };
  take(/\s#(\p{L}[\p{L}\p{N}_\-\/]*)(?=[\s,.;:!?)])/gu,(m,t)=>{ out.tags.push(t.toLowerCase()); out.tokens.push(['tag','#'+t.toLowerCase()]); });
  take(/\s@([\p{L}\p{N}_\-]+)(?=[\s,.;:!?)])/gu,(m,n)=>{ const f=findFolderByName(n); if(!f) return false; out.folderId=f.id; out.tokens.push(['list',f.name,f.color]); });
  take(/\s!(high|hi|h|3|medium|med|m|2|low|lo|l|1)(?=[\s,.;:!?)])/i,(m,p)=>{ p=p.toLowerCase(); out.priority=/^(high|hi|h|3)$/.test(p)?3:/^(medium|med|m|2)$/.test(p)?2:1; out.tokens.push(['pri',PRI_NAMES[out.priority]+' priority']); });
  take(/\s(every\s+(day|weekday|week|2\s*weeks|other\s+week|month|year)|daily|weekly|monthly|yearly|every\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday))(?=[\s,.;:!?)])/i,(m,all,unit,wd)=>{
    const a=all.toLowerCase().replace(/\s+/g,' ');
    if(wd){ out.repeat='weekly'; if(!out.due) out.due=nextWeekday(WD[wd.toLowerCase()]??0,true); }
    else out.repeat=/day$|daily/.test(a)&&!/weekday/.test(a)?'daily':/weekday/.test(a)?'weekdays':/2\s*weeks|other week/.test(a)?'biweekly':/week|weekly/.test(a)?'weekly':/month/.test(a)?'monthly':'yearly';
    out.tokens.push(['repeat',REPEATS.find(r=>r[0]===out.repeat)[1]]);
  });
  // time
  const setTime=(h,mi,ap)=>{ h=+h; mi=+(mi||0); if(ap){ ap=ap.toLowerCase(); if(h<1||h>12) return false; if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0; } if(h>23||mi>59) return false; out.time=pad(h)+':'+pad(mi); out.tokens.push(['time',fmtTime(out.time)]); };
  if(!out.time) take(/\s(?:at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)(?=[\s,.;:!?)])/i,(m,h,mi,ap)=>setTime(h,mi,ap.replace(/\./g,'')));
  if(!out.time) take(/\sat\s+(\d{1,2}):(\d{2})(?=[\s,.;:!?)])/i,(m,h,mi)=>setTime(h,mi));
  if(!out.time) take(/\s(\d{1,2}):(\d{2})(?=[\s,.;:!?)])/,(m,h,mi)=>setTime(h,mi));
  if(!out.time) take(/\s(?:at\s+)?(noon|midday)(?=[\s,.;:!?)])/i,()=>setTime(12,0));
  // date
  const setDue=d=>{ if(!d) return false; if(out.due&&out.repeat) { out.due=d; } else out.due=d; out.tokens.push(['date',fmtDay(d)]); };
  const tries=[
    [/\s(?:due\s+|on\s+)?(today|tonight|tod)(?=[\s,.;:!?)])/i,()=>setDue(today())],
    [/\s(?:due\s+|on\s+)?(tomorrow|tmrw|tmr)(?=[\s,.;:!?)])/i,()=>setDue(addDays(today(),1))],
    [/\s(?:due\s+)?in\s+(\d{1,3})\s+(day|days|week|weeks|month|months)(?=[\s,.;:!?)])/i,(m,n,u)=>{ n=+n; u=u.toLowerCase(); if(u.startsWith('day')) return setDue(addDays(today(),n)); if(u.startsWith('week')) return setDue(addDays(today(),n*7)); const d=new Date(); d.setMonth(d.getMonth()+n); return setDue(ymd(d)); }],
    [/\snext\s+week(?=[\s,.;:!?)])/i,()=>setDue(nextWeekday(1))],
    [/\s(?:this\s+)?weekend(?=[\s,.;:!?)])/i,()=>setDue(nextWeekday(6,true))],
    [/\s(?:due\s+|on\s+)?(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|mon|tue|tues|thu|thur|thurs|fri)(?=[\s,.;:!?)])/i,(m,nx,w)=>{ const wd=WD[w.toLowerCase()]; let d=nextWeekday(wd,!nx); if(nx&&d<nextWeekday(1)) d=addDays(d,7); return setDue(d); }],
    [/\s(\d{4})-(\d{2})-(\d{2})(?=[\s,.;:!?)])/,(m,y,mo,d)=>setDue(futureDate(+mo-1,+d,+y))],
    // m/d/yyyy anywhere; plain m/d only after "on" or "due" so sizes like 3/4 or 1/2 stay in the title
    [/\s(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})(?=[\s,.;:!?)])/,(m,mo,d,y)=>{ if(+mo<1||+mo>12) return false; y=+y<100?2000+ +y:+y; return setDue(futureDate(+mo-1,+d,y)); }],
    [/\s(?:on|due)\s+(\d{1,2})\/(\d{1,2})(?=[\s,.;:!?)])/i,(m,mo,d)=>{ if(+mo<1||+mo>12) return false; return setDue(futureDate(+mo-1,+d,0)); }],
    [/\s(?:on\s+)?(jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?(?=[\s,.;:!?)])/i,(m,mo,d,y)=>setDue(futureDate(MON[mo.toLowerCase()],+d,y?+y:0))],
    [/\s(?:on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|sept|september|oct|october|nov|november|dec|december)(?:\s+(\d{4}))?(?=[\s,.;:!?)])/i,(m,d,mo,y)=>setDue(futureDate(MON[mo.toLowerCase()],+d,y?+y:0))],
  ];
  if(!out.due||out.repeat){
    const hadRepeatDue=!!out.due;
    for(const [re,fn] of tries){ const before=s; take(re,fn); if(s!==before) break; }
    if(hadRepeatDue&&out.tokens.filter(t=>t[0]==='date').length===0){ out.tokens.push(['date',fmtDay(out.due)]); }
  }
  if(out.time&&!out.due){ out.due=today(); out.tokens.push(['date','Today']); }
  if(out.repeat&&!out.due){ out.due=today(); out.tokens.push(['date','Starts today']); }
  out.title=s.replace(/\s+([,.;:!?])/g,'$1').replace(/([,;:])(?=[,;:.!?])/g,'').replace(/\s+/g,' ').trim().replace(/^[,.;:\s]+|[,;:\s]+$/g,'');
  return out;
}

let renderQueued=false;
function scheduleRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; renderAll(); }); }
function renderAll(){ renderNav(); renderTree(); renderViewsNav(); renderTags(); renderContent(); }

function counts(){
  const t=today(); const c={inbox:0,today:0,overdue:0,upcoming:0,all:0,starred:0,notes:Object.keys(S.notes).length,done:0,byFolder:{}};
  const in7=addDays(t,7);
  for(const x of Object.values(S.tasks)){
    if(x.done){ c.done++; continue; }
    c.all++;
    if(!x.folderId||!S.folders[x.folderId]) c.inbox++; else c.byFolder[x.folderId]=(c.byFolder[x.folderId]||0)+1;
    if(x.due&&x.due<=t){ c.today++; if(x.due<t) c.overdue++; }
    if(x.due&&x.due>t&&x.due<=in7) c.upcoming++;
    if(x.starred) c.starred++;
  }
  return c;
}
const NAV=[['inbox','Inbox','inbox'],['today','Today','sun'],['upcoming','Upcoming','upcoming'],['calendar','Calendar','cal'],['schedule','Schedule','sched'],['all','All tasks','all'],['starred','Starred','star'],['notes','Notes','note'],['done','Completed','done']];

let RENAMING=null;
function renderTree(){
  const c=counts(); const tree=$('#tree');
  const openIn=id=>{ let n=c.byFolder[id]||0; for(const d of descendants(id)) n+=c.byFolder[d]||0; return n; };
  const rows=[];
  const walk=(pid,depth,seen)=>{
    for(const f of childrenOf(pid)){
      if(seen.has(f.id)) continue; seen.add(f.id);
      const kids=childrenOf(f.id).length>0;
      const open=!UI.collapsed['tree-'+f.id];
      const active=UI.view==='folder'&&UI.folderId===f.id;
      rows.push(`<div class="tree-row ${active?'active':''}" style="--depth:${depth}" data-id="${f.id}" draggable="${RENAMING===f.id?'false':'true'}" data-drag="folder:${f.id}" data-drop="folder">
        <button class="caret ${kids?'':'leaf'}" data-act="toggle-folder" data-id="${f.id}" aria-expanded="${open}" aria-label="${open?'Collapse':'Expand'} ${esc(f.name)}" ${kids?'':'tabindex="-1"'}>${icon('caret')}</button>
        ${RENAMING===f.id?`<span class="dot" style="--c:${f.color}"></span><input class="tree-rename" id="tree-rename" value="${esc(f.name)}" aria-label="List name" data-id="${f.id}">`:
        `<button class="tree-link" data-act="open-folder" data-id="${f.id}" title="${esc(pathName(f.id))}"><span class="dot" style="--c:${f.color}"></span><span class="tree-name">${esc(f.name)}</span><span class="count">${openIn(f.id)||''}</span></button>

      </div>`);
      if(kids&&open) walk(f.id,depth+1,seen);
    }
  };
  walk(null,0,new Set());
  const old=$('#tree-rename'); const keep=old&&old.dataset.id===RENAMING?{v:old.value,s:old.selectionStart,e:old.selectionEnd}:null;
  tree.innerHTML=(rows.length?rows.join(''):`<div class="tree-empty">No lists yet.</div>`)+`<button class="tree-add" data-act="add-folder">${icon('plus')}<span>New list</span></button>`;
  const ri=$('#tree-rename');

  else if(ri&&keep){ ri.value=keep.v; ri.focus({preventScroll:true}); try{ ri.setSelectionRange(keep.s,keep.e); }catch(e){} }
}

/* masonry packing for the notes board: each card spans as many 1px rows as it is tall */
const BOARD_GAP=14;
function layoutBoards(){
  const boards=$$('#content .board'); if(!boards.length) return;
  const cards=[];
  for(const b of boards){ b.classList.add('masonry'); for(const c of b.children){ c.style.gridRowEnd=''; cards.push(c); } }
  for(const c of cards){ const nb=c.querySelector('.note-body'); if(nb) nb.classList.toggle('clipped',nb.scrollHeight>nb.clientHeight+2); }
  const hs=cards.map(c=>c.getBoundingClientRect().height);
  cards.forEach((c,i)=>{ c.style.gridRowEnd='span '+Math.max(1,Math.ceil(hs[i]+BOARD_GAP)); });
}
let boardW=0;
if(window.ResizeObserver){ new ResizeObserver(ents=>{ const w=Math.round(ents[0].contentRect.width); if(w!==boardW){ boardW=w; layoutBoards(); } }).observe(document.getElementById('content')); }

function sortTasks(arr,mode){
  mode=mode||UI.sort;
  const a=arr.slice();
  const dueKey=t=>(t.due||'9999-99-99')+(t.time||'99:99');
  switch(mode){
    case 'due': return a.sort((x,y)=>dueKey(x).localeCompare(dueKey(y))||y.priority-x.priority||byOrder(x,y));
    case 'priority': return a.sort((x,y)=>y.priority-x.priority||dueKey(x).localeCompare(dueKey(y))||byOrder(x,y));
    case 'title': return a.sort((x,y)=>(x.title||'').localeCompare(y.title||'',undefined,{sensitivity:'base',numeric:true}));
    case 'created': return a.sort((x,y)=>y.createdAt-x.createdAt);
    case 'color': return a.sort((x,y)=>(x.color||'~').localeCompare(y.color||'~')||byOrder(x,y));
    default: return a.sort(byOrder);
  }
}

    case 'date': return a.sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999')||(x.time||'99').localeCompare(y.time||'99'));

function itemsByDate(from,to){
  const map={};
  const add=(d,x)=>{ (map[d]||(map[d]=[])).push(x); };
  if(UI.calTasks) for(const t of Object.values(S.tasks)){ if(t.due&&t.due>=from&&t.due<=to&&(UI.calDone||!t.done)) add(t.due,{k:'t',o:t}); }
  if(UI.calNotes) for(const n of Object.values(S.notes)){ if(n.date&&n.date>=from&&n.date<=to) add(n.date,{k:'n',o:n}); }
  for(const oc of calSchedItems(from,to)){ const e=oc.e; for(let d=oc.date; d<=oc.endDate; d=addDays(d,1)) if(d>=from&&d<=to) add(d,{k:'s',o:{id:oc.oid,e,title:entryLabel(e),time:e.allDay?'':e.start,color:entryColor(e),done:false,order:-1,createdAt:0}}); }
  for(const d in map) map[d].sort((a,b)=>(a.o.done?1:0)-(b.o.done?1:0)||(a.o.time||'99').localeCompare(b.o.time||'99')||byOrder(a.o,b.o));
  return map;
}

VIEWS.calendar=()=>{
  if(UI.calMode==='week'||UI.calMode==='day') return calTimeView();
  const t=today();
  if(!isDate(UI.calSel)) UI.calSel=t;
  if(!/^\d{4}-\d{2}$/.test(UI.calMonth||'')) UI.calMonth=t.slice(0,7);
  const [y,m]=UI.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1); const ws=+UI.weekStart||0;
  const offset=(first.getDay()-ws+7)%7; const dim=new Date(y,m,0).getDate();
  const weeks=Math.ceil((offset+dim)/7);
  const start=addDays(ymd(first),-offset); const end=addDays(start,weeks*7-1);
  const map=itemsByDate(start,end);
  let grid='';
  for(let i=0;i<7;i++) grid+=`<div class="cal-dow">${DOW[(i+ws)%7]}</div>`;
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i); const items=map[d]||[]; const dt=toDate(d);
    const out=dt.getMonth()!==m-1;
    const lim=items.length===4?4:3;
    const chips=items.slice(0,lim).map(({k,o})=>calChip(k,o)).join('');
    const more=items.length>lim?`<div class="cal-more">+${items.length-lim} more</div>`:'';
    const dots=items.slice(0,6).map(({o})=>`<i style="--c:${itemColor(o)||'var(--muted)'}"></i>`).join('');
    grid+=`<div class="cal-cell ${out?'out':''} ${d===t?'today':''} ${d===UI.calSel?'sel':''}" data-act="cal-select" data-date="${d}" data-drop="day" aria-label="${esc(fmtLong(d))}, ${items.length} item${items.length===1?'':'s'}"><div class="cal-top"><span class="cal-num">${dt.getDate()}</span></div>${chips}${more}<div class="cal-dots">${dots}</div></div>`;
  }
  const sel=UI.calSel;
  const selItems=(itemsByDate(sel,sel)[sel]||[]);
  const selTasks=selItems.filter(x=>x.k==='t').map(x=>x.o), selNotes=selItems.filter(x=>x.k==='n').map(x=>x.o), selSched=selItems.filter(x=>x.k==='s').map(x=>x.o);
  const agenda=`<aside class="agenda" aria-label="Selected day"><h2>${esc(fmtDay(sel))}</h2><div class="sub">${esc(fmtLong(sel))}</div>
    ${quickAdd({due:sel,id:'calqa',ph:'Add a task on this day'})}

/* ---------- search ---------- */
function parseQuery(q){ const terms=[],tags=[],is=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(q))){ const w=(m[1]||m[2]).toLowerCase(); if(!m[1]&&w.startsWith('#')&&w.length>1) tags.push(w.slice(1)); else if(!m[1]&&/^is:\w+$/.test(w)) is.push(w.slice(3)); else terms.push(w); } return {terms,tags,is}; }
function hl(text,terms){
  text=String(text||'');
  if(!terms||!terms.length) return esc(text);
  const lower=text.toLowerCase(); const r=[];
  for(const t of terms){ if(!t) continue; let i=0; while((i=lower.indexOf(t,i))!==-1){ r.push([i,i+t.length]); i+=t.length; } }
  if(!r.length) return esc(text);
  r.sort((a,b)=>a[0]-b[0]); const merged=[];
  for(const x of r){ const l=merged[merged.length-1]; if(l&&x[0]<=l[1]) l[1]=Math.max(l[1],x[1]); else merged.push(x.slice()); }
  let out='',p=0; for(const [a,b] of merged){ out+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'; p=b; } return out+esc(text.slice(p));
}
function snippet(text,terms){
  if(!text) return '';
  const lower=text.toLowerCase(); let at=-1;
  for(const t of terms){ const i=lower.indexOf(t); if(i!==-1&&(at===-1||i<at)) at=i; }
  if(at===-1) return '';
  const s=Math.max(0,at-50), e=Math.min(text.length,at+90);
  return (s?'…':'')+hl(text.slice(s,e),terms)+(e<text.length?'…':'');
}
function scoreFields(fields,terms){ let score=0; for(const term of terms){ let best=0; for(const [txt,w] of fields){ if(txt&&w>best&&txt.toLowerCase().includes(term)) best=w; } if(!best) return 0; score+=best; } return score||1; }
function runSearch(q){
  const {terms,tags,is}=parseQuery(q);
  const t=today();
  const tasks=[],notes=[],lists=[];
  if(!terms.length&&!tags.length&&!is.length) return {tasks,notes,lists,terms};
  for(const x of Object.values(S.tasks)){
    if(tags.length&&!tags.every(g=>x.tags.includes(g))) continue;
    if(is.includes('done')&&!x.done) continue;
    if(is.includes('open')&&x.done) continue;
    if(is.includes('starred')&&!x.starred) continue;
    if(is.includes('overdue')&&!(x.due&&x.due<t&&!x.done)) continue;
    if(is.includes('high')&&x.priority!==3) continue;
    if(is.includes('note')||is.includes('notes')) continue;
    if(UI.searchStatus==='open'&&x.done) continue;
    if(UI.searchStatus==='done'&&!x.done) continue;
    const f=x.folderId&&S.folders[x.folderId];
    const desc=htmlText(x.desc); const subs=x.subtasks.map(s=>s.text).join(' · ');
    const sc=terms.length?scoreFields([[x.title,6],[x.tags.join(' '),4],[x.job,4],[x.contact,4],[x.location,3],[f?pathName(f.id):'',2],[subs,3],[desc,1]],terms):1;
    if(!sc) continue;
    const snip=terms.length&&!terms.every(w=>x.title.toLowerCase().includes(w))?(snippet(subs,terms)||snippet(desc,terms)):'';
    tasks.push({o:x,sc,snip});
  }
  for(const n of Object.values(S.notes)){
    if(tags.length&&!tags.every(g=>n.tags.includes(g))) continue;
    if(is.length&&!(is.includes('note')||is.includes('notes'))) continue;
    const f=n.folderId&&S.folders[n.folderId];
    const body=htmlText(n.body);
    const sc=terms.length?scoreFields([[n.title,6],[n.tags.join(' '),4],[f?pathName(f.id):'',2],[body,2]],terms):1;
    if(!sc) continue;
    notes.push({o:n,sc,snip:terms.length?snippet(body,terms):''});
  }
  if(terms.length&&!tags.length&&!is.length) for(const f of Object.values(S.folders)){ const sc=scoreFields([[f.name,6]],terms); if(sc) lists.push({o:f,sc}); }
  const s=(a,b)=>b.sc-a.sc||(a.o.done?1:0)-(b.o.done?1:0)||b.o.updatedAt-a.o.updatedAt;
  tasks.sort(s); notes.sort(s); lists.sort(s);
  return {tasks,notes,lists,terms};
}
VIEWS.search=()=>{
  const q=UI.query.trim();
  const r=runSearch(q);
  const type=UI.searchType;
  const tools=`<div class="seg" role="group" aria-label="Type">${[['all','Everything'],['tasks','Tasks'],['notes','Notes'],['lists','Lists']].map(([v,l])=>`<button data-act="set-ui" data-key="searchType" data-val="${v}" aria-pressed="${type===v}">${l}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Status">${[['any','Any status'],['open','Open'],['done','Completed']].map(([v,l])=>`<button data-act="set-ui" data-key="searchStatus" data-val="${v}" aria-pressed="${UI.searchStatus===v}">${l}</button>`).join('')}</div>`;
  let body='';
  const showT=type==='all'||type==='tasks', showN=type==='all'||type==='notes', showL=type==='all'||type==='lists';
  const jobsR=type==='all'&&r.terms.length?Object.values(S.jobs).map(j=>({o:j,sc:scoreFields([[j.name,6],[j.client,4],[j.address,3],[j.contact,3],[j.po,3],[htmlText(j.notes),1]],r.terms)})).filter(x=>x.sc).sort((a,b)=>b.sc-a.sc):[];
  if(jobsR.length) body+=`<section class="result-sec"><h2>Jobs & projects · ${jobsR.length}</h2>${jobsR.map(({o})=>`<div class="list-row" data-act="open-job" data-id="${o.id}">${icon(o.type==='project'?'project':'job')}<span>${hl(o.name,r.terms)}</span><span class="path">${esc([o.client,o.address].filter(Boolean).join(' · '))}</span></div>`).join('')}</section>`;
  if(showL&&r.lists.length) body+=`<section class="result-sec"><h2>Lists · ${r.lists.length}</h2>${r.lists.map(({o})=>`<div class="list-row" data-act="open-folder" data-id="${o.id}"><span class="dot" style="--c:${o.color}"></span><span>${hl(o.name,r.terms)}</span><span class="path">${folderPath(o.id).length>1?esc(pathName(o.id)):''}</span></div>`).join('')}</section>`;
  if(showT&&r.tasks.length) body+=`<section class="result-sec"><h2>Tasks · ${r.tasks.length}</h2><div class="task-list">${r.tasks.slice(0,200).map(({o,snip})=>taskRow(o,{hl:r.terms,snip})).join('')}</div></section>`;
  if(showN&&r.notes.length) body+=`<section class="result-sec"><h2>Notes · ${r.notes.length}</h2><div class="board">${r.notes.slice(0,100).map(x=>noteCard(x.o,{hl:r.terms,snip:x.snip})).join('')}</div></section>`;
  const total=(showT?r.tasks.length:0)+(showN?r.notes.length:0)+(showL?r.lists.length:0)+jobsR.length;
  if(!total) body=emptyState(`No matches for “${esc(q)}”.`,'Try fewer words, check spelling, or search a tag with <b>#tag</b>. You can also use <b>is:done</b>, <b>is:open</b>, <b>is:starred</b>, <b>is:overdue</b>, <b>is:high</b>.');
  return `<div class="content-inner">${viewHead('Search',{sub:`${total} result${total===1?'':'s'} for “${esc(q)}”`,tools})}${body}</div>`;
};

function setupRte(ed,bar,onChange){
  const emit=()=>onChange(sanitize(ed.innerHTML));
  ed.addEventListener('input',emit);
  ed.addEventListener('paste',e=>{
    const cd=e.clipboardData; if(!cd) return;
    e.preventDefault();
    const html=cd.getData('text/html'); const txt=cd.getData('text/plain');
    const ins=html?sanitize(html.replace(/<!--[\s\S]*?-->/g,'')):textToHtml(txt);
    document.execCommand('insertHTML',false,ins);
  });
  ed.addEventListener('click',e=>{
    const li=e.target.closest('ul.checklist > li');
    if(li&&e.target===li&&e.offsetX<24){ if(li.getAttribute('data-checked')==='true') li.removeAttribute('data-checked'); else li.setAttribute('data-checked','true'); emit(); }
  });
  ed.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ const li=closestIn(getSelection().anchorNode,'li',ed); if(li){ e.preventDefault(); document.execCommand(e.shiftKey?'outdent':'indent'); emit(); } }
  });
  if(bar){
    bar.addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
    bar.addEventListener('click',e=>{
      const b=e.target.closest('[data-cmd]'); if(!b) return;
      if(document.activeElement!==ed&&!ed.contains(document.activeElement)){ ed.focus(); placeCaretEnd(ed); }
      const cmd=b.dataset.cmd;
      if(cmd==='h2'){ const cur=(document.queryCommandValue('formatBlock')||'').toLowerCase(); document.execCommand('formatBlock',false,cur==='h2'?'div':'h2'); }
      else if(cmd==='blockquote'){ const cur=(document.queryCommandValue('formatBlock')||'').toLowerCase(); document.execCommand('formatBlock',false,cur==='blockquote'?'div':'blockquote'); }
      else if(cmd==='checklist') toggleChecklist(ed);
      else document.execCommand(cmd,false,null);
      emit();
    });
  }
}
function closestIn(node,sel,root){ let n=node&&(node.nodeType===1?node:node.parentElement); while(n&&n!==root){ if(n.matches&&n.matches(sel)) return n; n=n.parentElement; } return null; }
function placeCaretEnd(el){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function toggleChecklist(ed){
  let li=closestIn(getSelection().anchorNode,'li',ed);
  if(li&&li.parentElement.tagName==='UL'){ const ul=li.parentElement; if(ul.classList.contains('checklist')){ ul.classList.remove('checklist'); ul.removeAttribute('class'); Array.from(ul.children).forEach(x=>x.removeAttribute('data-checked')); } else ul.classList.add('checklist'); return; }
  document.execCommand('insertUnorderedList');
  li=closestIn(getSelection().anchorNode,'li',ed);
  if(li&&li.parentElement.tagName==='UL') li.parentElement.classList.add('checklist');
}
function toggleCardChecklist(li){
  const card=li.closest('.note-card'); if(!card) return;
  const n=S.notes[card.dataset.id]; if(!n) return;
  const all=$$('.note-body ul.checklist > li',card); const idx=all.indexOf(li); if(idx<0) return;
  const doc=new DOMParser().parseFromString('<!doctype html><body>'+sanitize(n.body),'text/html');
  const lis=Array.from(doc.body.querySelectorAll('ul.checklist > li')); const t=lis[idx]; if(!t) return;
  if(t.getAttribute('data-checked')==='true') t.removeAttribute('data-checked'); else t.setAttribute('data-checked','true');

   Popovers, menus, pickers, modals, toasts

let POP=null;
function closePop(){ if(POP){ POP.el.remove(); if(POP.scrim) POP.scrim.remove(); if(POP.anchor&&POP.anchor.setAttribute) POP.anchor.setAttribute('aria-expanded','false'); POP=null; } }
function rectOf(a){ if(a&&a.getBoundingClientRect){ const r=a.getBoundingClientRect(); if(r.width||r.height) return r; } return a&&a.left!=null?a:{left:innerWidth/2,right:innerWidth/2,top:innerHeight/3,bottom:innerHeight/3}; }
function openPop(anchor,html,bind,opts={}){
  closePop();
  const r=rectOf(anchor);
  const el=document.createElement('div'); el.className='pop'+(opts.cls?' '+opts.cls:'')+(opts.sheet?' sheet':''); el.setAttribute('role',opts.role||'menu'); el.innerHTML=html;
  let scrim=null;
  if(opts.sheet){ scrim=document.createElement('div'); scrim.className='pop-scrim'; $('#pop-layer').appendChild(scrim); }
  $('#pop-layer').appendChild(el);
  if(!opts.sheet){
    const w=el.offsetWidth,h=el.offsetHeight;
    let left=r.right-w; if(left<8) left=Math.min(r.left,innerWidth-w-8); left=Math.max(8,Math.min(left,innerWidth-w-8));
    if(opts.alignLeft) left=Math.max(8,Math.min(r.left,innerWidth-w-8));
    let top=r.bottom+4; if(top+h>innerHeight-8) top=Math.max(8,r.top-h-4);
    el.style.left=left+'px'; el.style.top=top+'px';
  }
  const anchorEl=anchor&&anchor.setAttribute?anchor:null;
  if(anchorEl) anchorEl.setAttribute('aria-expanded','true');
  POP={el,scrim,anchor:anchorEl,rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom},t:performance.now()};
  bind&&bind(el);
  const first=el.querySelector('input:not([type=color]),.pop-item'); if(first&&!opts.noFocus) first.focus({preventScroll:true});
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ const items=$$('.pop-item',el); const i=items.indexOf(document.activeElement); const n=items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]; if(n){ e.preventDefault(); n.focus(); } }
  });
  return el;
}
function menu(anchor,items){
  const html=items.map((it,i)=>{
    if(it.sep) return '<div class="pop-sep"></div>';
    if(it.label&&it.row) return `<div class="pop-label">${esc(it.label)}</div><div class="pop-row">${it.row.map((b,j)=>`<button type="button" data-row="${i}:${j}" aria-pressed="${!!b.on}">${esc(b.label)}</button>`).join('')}</div>`;
    if(it.heading) return `<div class="pop-label">${esc(it.heading)}</div>`;
    return `<button type="button" class="pop-item ${it.danger?'danger':''}" role="menuitem" data-i="${i}">${it.icon?icon(it.icon):''}<span>${esc(it.label)}</span>${it.hint?`<span class="chk" style="color:var(--muted);font-size:12px">${esc(it.hint)}</span>`:''}</button>`;
  }).join('');
  openPop(anchor,html,el=>{
    el.addEventListener('click',e=>{
      const b=e.target.closest('[data-i],[data-row]'); if(!b) return;
      const rect=POP&&POP.rect;
      if(b.dataset.row){ const [i,j]=b.dataset.row.split(':').map(Number); closePop(); items[i].row[j].act(rect); return; }
      const it=items[+b.dataset.i]; closePop(); it.act&&it.act(rect);
    });
  });
}
function pickColor(anchor,cur,onPick){

function pickFolder(anchor,cur,onPick,{exclude=new Set(),noneLabel='Inbox (no list)',title='Choose a list'}={}){

  };

  const html=`<div class="lp-head"><h3>${esc(title)}</h3><p>Tap a list to open it · tap the circle to choose it</p></div>${many?`<input class="pop-filter" id="pop-filter" placeholder="Find a list…" aria-label="Find a list" autocomplete="off">`:''}<div class="lp-list" role="radiogroup" aria-label="${esc(title)}" id="pop-folders">${tree()}</div>`;
  openPop(anchor,html,el=>{

    if(inp){

    }

/* ---------- backup / restore ---------- */
async function exportData(){
  const data={app:'B&S Office Hub',version:1,exportedAt:new Date().toISOString(),...snapshotAll()};
  const json=JSON.stringify(data,null,2);
  const filename=`bs-office-hub-backup-${today()}.json`;
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename,data:json}); toast('Backup saved'); return; }
    catch(e){ if(e&&e.code==='declined') return; if(e&&e.code==='rate_limited'){ toast('A save prompt is already open.'); return; } }
  }
  if(!(window.claude&&typeof window.claude.use==='function')){
    // opened as a downloaded file: a normal browser download works here
    try{ const url=URL.createObjectURL(new Blob([json],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Backup saved to your Downloads folder'); return; }catch(e){}
  }
  openModal({title:'Back up your data',body:`<p>Copy this and keep it somewhere safe (a note, an email to yourself, a file). To restore, open <b>Restore</b> and paste it in.</p><div class="field"><textarea id="export-text" readonly aria-label="Backup data">${esc(json)}</textarea></div>`,
    actions:[{label:'Close'},{label:'Copy to clipboard',kind:'primary',act:w=>{ const ta=w.querySelector('#export-text'); const done=()=>toast('Backup copied'); try{ navigator.clipboard.writeText(json).then(done,()=>{ ta.select(); document.execCommand('copy'); done(); }); }catch(e){ ta.select(); try{document.execCommand('copy'); done();}catch(_){} } return false; }}]});
}
function openRestore(){
  openModal({title:'Restore from a backup',body:`<p>Pick a B&amp;S Task Manager backup file (.json), or paste the backup text below.</p><div class="field"><button type="button" class="btn" id="restore-pick">${icon('upload')}Choose a file…</button></div><div class="field"><label for="restore-text">Or paste backup text</label><textarea id="restore-text" placeholder='{"app":"B&amp;S Task Manager", …}'></textarea></div>`,
    actions:[{label:'Cancel'},{label:'Continue',kind:'primary',act:w=>{ const txt=w.querySelector('#restore-text').value.trim(); if(!txt){ toast('Paste backup text or choose a file first.'); return false; } setTimeout(()=>previewImport(txt),0); }}],
    onOpen:w=>{ w.querySelector('#restore-pick').addEventListener('click',()=>{ const fi=$('#import-file'); fi.value=''; fi.click(); }); }});
}
function previewImport(text){
  let data; try{ data=JSON.parse(text); }catch(e){ openModal({title:'That backup couldn’t be read',body:`<p>The text isn’t valid backup data. Make sure you copied the whole thing, from the first <code>{</code> to the last <code>}</code>.</p>`}); return; }
  if(!data||typeof data!=='object'){ openModal({title:'That backup couldn’t be read',body:'<p>No lists, tasks or notes were found in it.</p>'}); return; }
  const tmp=Object.fromEntries(KINDS.map(k=>[k,{}])); const n=ingest(data,tmp);
  if(!n){ openModal({title:'Nothing to restore',body:'<p>No lists, tasks or notes were found in that backup.</p>'}); return; }
  const c=k=>Object.keys(tmp[k]).length;
  const overlap=KINDS.reduce((a,k)=>a+Object.keys(tmp[k]).filter(id=>S[k][id]).length,0);
  openModal({title:'Restore this backup?',body:`<p>Found <b>${c('folders')}</b> lists, <b>${c('tasks')}</b> tasks and <b>${c('notes')}</b> notes${c('people')||c('sched')?`, plus <b>${c('people')}</b> people and <b>${c('sched')}</b> schedule entries`:''}.</p><div class="radio-list"><label><input type="radio" name="imode" value="merge" checked><span><b>Add to what’s here</b><br><span style="color:var(--muted)">${overlap?`${overlap} item${overlap===1?'':'s'} already here will be replaced by the backup’s version.`:'Nothing here gets removed.'}</span></span></label><label><input type="radio" name="imode" value="replace"><span><b>Replace everything</b><br><span style="color:var(--muted)">Deletes what’s here now, then restores the backup.</span></span></label></div>`,
    actions:[{label:'Cancel'},{label:'Restore',kind:'primary',act:w=>{
      const mode=w.querySelector('input[name=imode]:checked').value;
      if(mode==='replace') for(const k of KINDS) for(const id of Object.keys(S[k])) if(!tmp[k][id]) Store.del(k,id);
      for(const k of KINDS) for(const o of Object.values(tmp[k])) Store.put(k,o);
      if(D&&!S[D.kind][D.id]) closeDetail(true);
      scheduleRender(); toast(`Restored ${n} items`);
    }}]});
}

function showShortcuts(){
  const row=(keys,desc)=>`<div>${keys.map(k=>`<kbd>${k}</kbd>`).join('')}</div><div>${desc}</div>`;
  openModal({title:'Keyboard shortcuts',body:`<div class="keys">${row(['N'],'New task')}${row(['Shift','N'],'New note')}${row(['/'],'Search')}${row(['1'],'Today')}${row(['2'],'Upcoming')}${row(['3'],'Calendar')}${row(['4'],'All tasks')}${row(['5'],'Notes')}${row(['6'],'Schedule')}${row(['E'],'Edit the open item')}${row(['Esc'],'Close panel / go back')}${row(['?'],'This list')}</div><p style="margin-top:14px;color:var(--muted);font-size:13px">In the quick-add box you can type things like <b>“Order breakers fri 10am !high #supply @work”</b> — the date, time, priority, tag and list are picked up automatically.</p>`,actions:[{label:'Got it',kind:'primary'}]});
}

    case 'add-folder': addFolder(); break;
    case 'add-subfolder': addSubfolder(id); break;
    case 'add-in-folder': createTask({folderId:id},{open:true}); break;
    case 'folder-color': { const f=S.folders[id]; pickColor(a,f.color,c=>patch('folders',id,{color:c||'#6F7C85'})); break; }
    case 'toggle-done': toggleDone(id); break;
    case 'open-task': openDetail('tasks',id); break;
    case 'open-note': if(e.detail>1) break; openDetail('notes',a.dataset.id); break;
    case 'star': patch('tasks',id,{starred:!S.tasks[id].starred}); refreshDetail(); break;
    case 'task-menu': e.stopPropagation(); if(POP&&POP.anchor===a){ closePop(); break; } taskMenu(a,id); break;
    case 'collapse': { const k=a.dataset.key; const def=a.getAttribute('aria-expanded')==='false'; UI.collapsed[k]=!def; savePrefs(); const g=a.closest('.group'); const body=g&&g.querySelector(':scope > .group-body'); if(body){ body.hidden=!def; a.setAttribute('aria-expanded',String(def)); } break; }
    case 'new-task': newTaskFromContext(); break;
    case 'new-note': newNoteFromContext(a.dataset.folder?{folderId:a.dataset.folder}:{}); break;
    case 'new-note-on': createNote({date:a.dataset.date},{open:true}); break;
    case 'open-nav': document.body.classList.add('nav-open'); break;
    case 'close-nav': document.body.classList.remove('nav-open'); break;
    case 'clear-search': $('#search').value=''; onSearch(''); $('#search').focus(); break;
    case 'export': exportData(); break;
    case 'import': openRestore(); break;
    case 'shortcuts': showShortcuts(); break;
    case 'account': if(window.BSCloud) window.BSCloud.openAccount(); break;
    case 'overdue-to-today': { const t0=today(); const od=Object.values(S.tasks).filter(x=>!x.done&&x.due&&x.due<t0); const prev=od.map(clone); od.forEach(x=>patch('tasks',x.id,{due:t0})); toast(`Moved ${od.length} task${od.length===1?'':'s'} to today`,{action:()=>{ prev.forEach(p=>Store.put('tasks',p)); scheduleRender(); }}); break; }
    case 'add-on-day': createTask({due:a.dataset.date},{open:true}); break;
    case 'cal-day': UI.calSel=a.dataset.date; UI.calMonth=UI.calSel.slice(0,7); UI.calMode='day'; savePrefs(); scheduleRender(); break;
    case 'cal-prev': case 'cal-next': if(UI.calMode==='week'||UI.calMode==='day'){ const n=(UI.calMode==='week'?7:1)*(act==='cal-next'?1:-1); UI.calSel=addDays(isDate(UI.calSel)?UI.calSel:today(),n); UI.calMonth=UI.calSel.slice(0,7); savePrefs(); scheduleRender(); break; } { const [y,m]=UI.calMonth.split('-').map(Number); const d=new Date(y,m-1+(act==='cal-next'?1:-1),1); UI.calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; savePrefs(); scheduleRender(); break; }
    case 'cal-today': UI.calMonth=today().slice(0,7); UI.calSel=today(); savePrefs(); scheduleRender(); break;
    case 'cal-select': UI.calSel=a.dataset.date; if(UI.calSel.slice(0,7)!==UI.calMonth) UI.calMonth=UI.calSel.slice(0,7); savePrefs(); scheduleRender(); if(innerWidth<=1180) setTimeout(()=>{ const ag=$('.agenda'); ag&&ag.scrollIntoView({behavior:'smooth',block:'start'}); },60); break;

    case 'toggle-ui': UI[a.dataset.key]=!UI[a.dataset.key]; savePrefs(); scheduleRender(); break;

    case 'clear-done': clearDone(); break;
    case 'tag-rename': renameTag(a.dataset.tag); break;
    case 'tag-delete': removeTag(a.dataset.tag); break;

    case 'ip-sub': { const tk=S.tasks[id]; if(!tk) break; patch('tasks',id,{subtasks:tk.subtasks.map(x=>x.id===a.dataset.sid?{...x,done:!x.done}:x)}); refreshDetail(); break; }

/* ---------- drag and drop ---------- */
let DRAG=null, DROP_EL=null;
function clearDropMarks(){ $$('.drop-before,.drop-after,.drop-inside,.drop-hover').forEach(x=>x.classList.remove('drop-before','drop-after','drop-inside','drop-hover')); DROP_EL=null; }
document.addEventListener('dragstart',e=>{
  const el=e.target.closest&&e.target.closest('[data-drag]'); if(!el) return;
  if(e.target.closest('input,textarea,[contenteditable="true"]')&&!e.target.matches('[data-drag]')){ e.preventDefault(); return; }
  const [kind,id]=el.dataset.drag.split(':'); DRAG={kind,id,el,from:el.dataset.from,date:el.dataset.odate};
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); }catch(_){}
  requestAnimationFrame(()=>el.classList.add('dragging'));
  document.body.classList.add('is-dragging'); closePop();
});
document.addEventListener('dragend',()=>{ if(DRAG&&DRAG.el) DRAG.el.classList.remove('dragging'); $$('.dragging').forEach(x=>x.classList.remove('dragging')); DRAG=null; clearDropMarks(); document.body.classList.remove('is-dragging'); });
const DROP_OK={task:['task','group','folder','nav-inbox','nav-today','nav-starred','day','kcol','slot'],note:['note','folder','day','group'],folder:['folder','tree-root'],sched:['scell','slot','day']};
function dropTarget(e){
  if(!DRAG) return null;
  const k=DRAG.kind, ok=DROP_OK[k]||[];
  let el=e.target.closest&&e.target.closest('[data-drop]');
  if(!el&&e.target.closest&&e.target.closest('.cb-days,.tg-col,.tg-ad')&&document.elementsFromPoint){ for(const x of document.elementsFromPoint(e.clientX,e.clientY)){ if(x.matches&&x.matches('.cb-cell,.tg-slot,.tg-ad')){ el=x; break; } } }
  while(el){
    const type=el.dataset.drop;
    let accept=ok.includes(type);
    if(type==='task'&&k!=='task') accept=false;
    if(type==='note'&&k!=='note') accept=false;
    if(accept&&type==='group'&&k==='note'){ let set={}; try{ set=JSON.parse(el.dataset.set||'{}'); }catch(_){} if(!('due' in set)) accept=false; }
    if(accept&&type==='folder'&&k==='folder'&&(el.dataset.id===DRAG.id||descendants(DRAG.id).includes(el.dataset.id))) accept=false;
    if(accept&&(type==='task'||type==='note')&&el.dataset.id===DRAG.id) return null;
    if(accept) return el;
    el=el.parentElement&&el.parentElement.closest('[data-drop]');
  }
  return null;
}
document.addEventListener('dragover',e=>{
  const el=dropTarget(e); if(!el){ if(DROP_EL) clearDropMarks(); return; }
  e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){}
  const r=el.getBoundingClientRect(); const type=el.dataset.drop; let pos='inside';
  if(type==='task'||(type==='folder'&&DRAG.kind==='folder')) { const y=(e.clientY-r.top)/r.height; pos=type==='task'?(y<.5?'before':'after'):(y<.28?'before':y>.72?'after':'inside'); }
  if(type==='note'){ const x=(e.clientX-r.left)/r.width; pos=x<.5?'before':'after'; }
  const cls=pos==='inside'?(type==='folder'?'drop-inside':type==='group'?'drop-inside':'drop-hover'):'drop-'+pos;
  if(DROP_EL!==el||!el.classList.contains(cls)){ clearDropMarks(); el.classList.add(cls); DROP_EL=el; }
  el.dataset.pos=pos;
});
document.addEventListener('drop',e=>{
  const el=dropTarget(e); if(!el||!DRAG) return; e.preventDefault();
  const {kind,id}=DRAG; const type=el.dataset.drop; const pos=el.dataset.pos||'inside';
  clearDropMarks();
  if(kind==='task'){
    const t=S.tasks[id]; if(!t) return;
    if(type==='task'){
      const list=el.closest('.task-list');
      const p=list&&list.dataset.set?JSON.parse(list.dataset.set):{};
      const rows=$$(':scope > .task[data-id]',list).filter(r=>r.dataset.id!==id);
      const idx=rows.indexOf(el); const ins=pos==='after'?idx+1:idx;
      const prev=rows[ins-1], next=rows[ins];
      const po=prev?S.tasks[prev.dataset.id].order:null, no=next?S.tasks[next.dataset.id].order:null;
      const order=po==null&&no==null?t.order:po==null?no-1:no==null?po+1:(po+no)/2;
      patch('tasks',id,{...p,...(UI.sort==='manual'||UI.view==='search'?{order}:{})});
    }
    else if(type==='group'||type==='day'){ const p=type==='day'?{due:el.dataset.date}:JSON.parse(el.dataset.set||'{}'); patch('tasks',id,p); if(type==='day') toast(`Moved to ${fmtDay(el.dataset.date)}`); }
    else if(type==='folder'){ patch('tasks',id,{folderId:el.dataset.id}); toast(`Moved to ${S.folders[el.dataset.id].name}`); }
    else if(type==='nav-inbox'){ patch('tasks',id,{folderId:null}); toast('Moved to Inbox'); }
    else if(type==='nav-today'){ patch('tasks',id,{due:today()}); toast('Due today'); }
    else if(type==='nav-starred'){ patch('tasks',id,{starred:true}); toast('Starred'); }
    else if(type==='kcol'){ let set={}; try{ set=JSON.parse(el.dataset.set||'{}'); }catch(_){} applyTaskSet(id,set); }
    else if(type==='slot'){ patch('tasks',id,{due:el.dataset.date,time:el.dataset.time}); toast(`Moved to ${fmtDay(el.dataset.date)} ${fmtTime(el.dataset.time)}`); }
    refreshDetail();
  }else if(kind==='sched'){
    schedDrop(el,type);
  }else if(kind==='note'){
    const n=S.notes[id]; if(!n) return;
    if(type==='note'){
      const boardEl=el.closest('.board'); const cards=$$(':scope > .note-card[data-id]',boardEl).filter(c=>c.dataset.id!==id);
      const idx=cards.indexOf(el); const ins=pos==='after'?idx+1:idx; const prev=cards[ins-1], next=cards[ins];
      const po=prev?S.notes[prev.dataset.id].order:null, no=next?S.notes[next.dataset.id].order:null;
      const order=po==null&&no==null?n.order:po==null?no-1:no==null?po+1:(po+no)/2;
      if(UI.notesSort!=='manual'){ UI.notesSort='manual'; savePrefs(); toast('Sorting switched to “My order”'); }
      patch('notes',id,{order});
    }
    else if(type==='day'){ patch('notes',id,{date:el.dataset.date}); toast(`Note moved to ${fmtDay(el.dataset.date)}`); }
    else if(type==='group'){ const p=JSON.parse(el.dataset.set||'{}'); if('due' in p) patch('notes',id,{date:p.due}); }
    else if(type==='folder'){ patch('notes',id,{folderId:el.dataset.id}); toast(`Moved to ${S.folders[el.dataset.id].name}`); }
    refreshDetail();
  }else if(kind==='folder'){
    const f=S.folders[id]; if(!f) return;
    if(type==='tree-root'){ moveFolderInto(id,null); return; }
    const target=S.folders[el.dataset.id]; if(!target) return;
    if(pos==='inside'){ moveFolderInto(id,target.id); return; }
    const parent=folderParent(target);
    const sib=childrenOf(parent).filter(x=>x.id!==id); const idx=sib.findIndex(x=>x.id===target.id); const ins=pos==='after'?idx+1:idx;
    const prev=sib[ins-1], next=sib[ins];
    const order=prev&&next?(prev.order+next.order)/2:prev?prev.order+1:next?next.order-1:0;
    patch('folders',id,{parentId:parent,order});
  }
});

   Smart fill: Claude reads a typed sentence and fills in the task

let SMART=null, smartState='off';
const SMART_PENDING=new Map();
const wordCount=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const smartReady=()=>smartState==='ready'&&UI.smartOn!==false;
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'');
function allJobs(){ return [...new Set(Object.values(S.tasks).map(t=>t.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
function initSmart(){
  if(!(window.claude&&typeof window.claude.use==='function')) return;
  window.claude.use('sample').then(fn=>{ SMART=fn||null; smartState=fn?'ready':'off'; scheduleRender(); if(D) refreshDetail(); },()=>{ smartState='off'; });
}
function calendarLines(){
  const t=today(); const dow=(toDate(t).getDay()+6)%7; const mon=addDays(t,-dow);
  return ['This week','Next week','The week after that'].map((lab,w)=>lab+': '+Array.from({length:7},(_,i)=>{ const x=addDays(mon,w*7+i); return `${DOW_LONG[toDate(x).getDay()]} ${x}${x===t?' (TODAY)':''}`; }).join(', ')).join('\n');
}
function buildSmartPrompt(raw){
  const now=new Date(); const t=today();
  const lists=flatTree().map(({f})=>pathName(f.id)).slice(0,60);
  const jobs=allJobs().slice(0,60);
  const tags=allTags().map(x=>x[0]).slice(0,40);
  return `You turn a note someone typed into a structured to-do item for their task manager. They run electrical and low-voltage crews (cabling, cameras, access control, panels), so expect job names, towns, suppliers and people.

Today is ${DOW_LONG[now.getDay()]} ${t}, and it is ${pad(now.getHours())}:${pad(now.getMinutes())} now.
Calendar (weeks start Monday):
${calendarLines()}

Date rules:
- "tomorrow" = ${addDays(t,1)}. "today"/"tonight" = ${t}.
- A bare weekday ("Thursday", "on fri") = the next one after today.
- "next <weekday>" or "<weekday> of next week" = that weekday in the "Next week" row above.
- "this weekend" = the coming Saturday. "end of the week" = the coming Friday. "in N days/weeks" = count from today.
- A month and day with no year = the next time that date comes around.
- Times are 24-hour HH:MM ("1 pm" = "13:00", "noon" = "12:00"). Never invent a date or time that the note doesn't state or clearly imply.

Their existing lists: ${lists.length?lists.map(x=>JSON.stringify(x)).join(', '):'(none)'}
Their existing job names: ${jobs.length?jobs.map(x=>JSON.stringify(x)).join(', '):'(none)'}
Their existing tags: ${tags.length?tags.join(', '):'(none)'}

The note (between the markers):
<<<
${raw.slice(0,4000)}
>>>

Reply with only one JSON object with exactly these keys:
{"title": string, "details": string, "due": "YYYY-MM-DD" or null, "time": "HH:MM" or null, "contact": string or null, "job": string or null, "location": string or null, "priority": 0|1|2|3, "tags": [string], "list": string or null, "checklist": [string], "repeat": ""|"daily"|"weekdays"|"weekly"|"biweekly"|"monthly"|"yearly", "related": [{"title": string, "due": "YYYY-MM-DD", "time": "HH:MM" or null}]}

Field guide:
- title: the action for THIS item, short and imperative, max 60 characters, keep the person's name (e.g. "Call Kyle").
- details: everything else worth remembering, as one or two clear sentences with dates written out (e.g. "Tell him we need to start the Blue Light job in Nashua, NH next Thursday, Oct 1."). "" if nothing is left.
- due/time: when THIS item should happen.
- contact: the person to call, meet, text or email, capitalized (e.g. "Kyle"), else null.
- job: the job or project name without the word "job" (e.g. "Blue Light"); reuse an existing job name if it is the same job; else null.
- location: town and state as "City, ST" (e.g. "Nashua, NH"), or a street address, else null.
- priority: 3 only for urgent/asap/emergency, 2 for important/soon, else 0.
- tags: at most 3 short lowercase words, prefer existing tags; [] if none fit.
- list: one of their existing list names exactly as written, only if it clearly fits; else null.
- checklist: only if the note lists several separate steps; else [].
- repeat: only if the note says it repeats; else "".
- related: other dated events in the note that deserve their own item on the calendar, like a job start date or a delivery (e.g. {"title": "Start Blue Light job", "due": "<that date>", "time": null}); [] if none. Don't repeat this item itself.`;
}
function sanitizeSmart(r){
  if(!r||typeof r!=='object'||Array.isArray(r)) return null;
  const s=(v,n)=>typeof v==='string'?v.replace(/\s+/g,' ').trim().slice(0,n):'';
  const okDate=v=>isDate(v)&&ymd(toDate(v))===v?v:'';
  const okTime=v=>isTime(v)&&+v.slice(0,2)<24&&+v.slice(3)<60?v:'';
  const listName=s(r.list,200).toLowerCase();
  let folderId;
  if(listName){ const f=flatTree().map(x=>x.f).find(f=>pathName(f.id).toLowerCase()===listName||f.name.toLowerCase()===listName); if(f) folderId=f.id; }
  const out={
    title:s(r.title,200), details:typeof r.details==='string'?r.details.trim().slice(0,4000):'',
    due:okDate(r.due), time:okTime(r.time), contact:s(r.contact,120), job:s(r.job,120).replace(/\s+job$/i,''), location:s(r.location,200),
    priority:[0,1,2,3].includes(r.priority)?r.priority:0, tags:cleanTags(Array.isArray(r.tags)?r.tags.slice(0,3):[]),
    folderId, checklist:Array.isArray(r.checklist)?r.checklist.map(x=>s(x,300)).filter(Boolean).slice(0,20):[],
    repeat:REPEAT_IDS.includes(r.repeat)?r.repeat:'',
    related:Array.isArray(r.related)?r.related.filter(x=>x&&typeof x==='object').map(x=>({title:s(x.title,200),due:okDate(x.due),time:okTime(x.time)})).filter(x=>x.title&&x.due).slice(0,3):[],
  };
  if(!out.title) return null;
  return out;
}
async function runSmart(id,raw,ctx={}){
  if(!SMART||SMART_PENDING.has(id)||!S.tasks[id]) return;
  const snap=clone(S.tasks[id]);
  const ctl=new AbortController(); SMART_PENDING.set(id,ctl);
  scheduleRender(); if(D&&D.id===id) refreshDetail();
  try{
    const res=await SMART.json(buildSmartPrompt(raw),{modelTier:'quick',signal:ctl.signal});
    const r=sanitizeSmart(res);
    if(!r) throw {code:'invalid_json'};
    SMART_PENDING.delete(id);
    applySmart(id,r,snap,ctx);
  }catch(e){ SMART_PENDING.delete(id); smartError(e,id,raw,ctx); }
  finally{ SMART_PENDING.delete(id); scheduleRender(); if(D&&D.id===id) refreshDetail(); }
}
function applySmart(id,r,snap,ctx){
  const cur=S.tasks[id]; if(!cur) return;
  const same=k=>JSON.stringify(cur[k])===JSON.stringify(snap[k]);
  const p={};
  if(same('title')) p.title=r.title;
  if(r.details&&same('desc')&&!hasText(cur.desc)) p.desc=textToHtml(r.details);
  if(r.due&&same('due')) p.due=r.due;
  if(r.time&&same('time')){ p.time=r.time; if(!(p.due||cur.due)) p.due=today(); }
  for(const k of ['contact','job','location']) if(r[k]&&same(k)) p[k]=r[k];
  if(r.priority&&same('priority')) p.priority=r.priority;
  if(r.tags.length&&same('tags')) p.tags=[...new Set([...cur.tags,...r.tags])];
  if(r.folderId&&same('folderId')&&!ctx.folderLocked) p.folderId=r.folderId;
  if(r.checklist.length&&same('subtasks')&&!cur.subtasks.length) p.subtasks=r.checklist.map(text=>({id:uid('s'),text,done:false}));
  if(r.repeat&&same('repeat')) p.repeat=r.repeat;
  const after=patch('tasks',id,p)||cur;
  const made=r.related.map(rel=>createTask({title:rel.title,due:rel.due,time:rel.time||'',folderId:after.folderId,job:after.job,location:after.location,tags:after.tags,order:after.order+0.0005}));
  const bits=[];
  if(after.due) bits.push(fmtDay(after.due)+(after.time?' '+fmtTime(after.time):''));
  for(const k of ['job','location','contact']) if(p[k]) bits.push(p[k]);
  if(made.length) bits.push(`+${made.length} more task${made.length===1?'':'s'} (${made.map(m=>fmtDay(m.due)).join(', ')})`);
  toast(`Filled in: ${bits.join(' · ')||'title and notes'}`,{ms:9000,action:()=>{ Store.put('tasks',{...snap,updatedAt:Date.now()}); made.forEach(m=>Store.del('tasks',m.id)); scheduleRender(); refreshDetail(); }});
}
function smartError(e,id,raw,ctx){
  const c=e&&e.code;
  if(c==='cancelled') return;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ smartState='off'; scheduleRender(); toast('Smart fill isn’t turned on for this app, so the task was saved as you typed it.',{ms:8000}); return; }
  if(c==='rate_limited'){ toast('Smart fill is busy right now. The task was saved as you typed it. Try again in a minute.',{ms:8000}); return; }
  if(c==='session_expired'){ toast('Sign in to Claude again to use smart fill. The task was saved as you typed it.',{ms:8000}); return; }
  toast('Smart fill couldn’t read that one, so the task was saved as you typed it.',{label:'Try again',ms:9000,action:()=>runSmart(id,raw,ctx)});
}

function cleanRules(a){
  if(!Array.isArray(a)) return [];
  return a.filter(r=>r&&typeof r==='object'&&RULE_FIELDS.some(f=>f[0]===r.f)).slice(0,20).map(r=>({f:r.f,op:typeof r.op==='string'?r.op.slice(0,20):'',v:typeof r.v==='string'||typeof r.v==='number'?String(r.v).slice(0,200):''}));
}
function cleanCfg(c){
  c=c&&typeof c==='object'?c:{};
  const pick=(v,list,d)=>list.some(x=>x[0]===v)?v:d;
  const fields={}; if(c.fields&&typeof c.fields==='object') for(const [k] of FIELD_DEFS) if(k in c.fields) fields[k]=c.fields[k]?1:0;
  const out={
    layout:[...LAYOUTS,...NOTE_LAYOUTS].some(x=>x[0]===c.layout)?c.layout:'',
    boardBy:pick(c.boardBy,BOARD_BY,'status'),
    listGroup:pick(c.listGroup,LIST_GROUPS,'none'),
    calMode:['month','week','day'].includes(c.calMode)?c.calMode:'month',
    anchor:isDate(c.anchor)?c.anchor:'',
    tlZoom:pick(c.tlZoom,TL_ZOOM,'month'),
    tlGroup:pick(c.tlGroup,TL_GROUPS,'job'),
    tlStart:isDate(c.tlStart)?c.tlStart:'',
    fields,
    cols:Array.isArray(c.cols)?c.cols.filter(k=>TABLE_COLS.some(x=>x.k===k)):DEFAULT_COLS.slice(),
    tsort:c.tsort&&TABLE_COLS.some(x=>x.k===c.tsort.col)?{col:c.tsort.col,dir:c.tsort.dir===-1?-1:1}:{col:'due',dir:1},
    density:c.density==='compact'?'compact':'comfy',
    rules:cleanRules(c.rules),
    match:c.match==='any'?'any':'all',
    showDone:!!c.showDone,
    startH:Number.isInteger(c.startH)&&c.startH>=0&&c.startH<=12?c.startH:6,
    endH:Number.isInteger(c.endH)&&c.endH>=13&&c.endH<=24?c.endH:21,
  };
  if(!out.cols.includes('title')) out.cols.unshift('title');
  return out;
}

/* ---------- filtering ---------- */
function ruleMatch(t,r){
  const def=RULE_FIELDS.find(f=>f[0]===r.f); if(!def) return true;
  const type=def[2], v=(r.v||'').toLowerCase(), td=today();
  const val={title:t.title,job:t.job,location:t.location,contact:t.contact}[r.f];
  switch(type){
    case 'text': { const s=(val||'').toLowerCase(); return r.op==='not'?!s.includes(v):r.op==='is'?s===v:r.op==='empty'?!s:r.op==='set'?!!s:s.includes(v); }
    case 'status': { const st=t.done?'done':t.status||'todo'; return r.op==='isnt'?st!==r.v:st===r.v; }
    case 'pri': return r.op==='atleast'?t.priority>=+r.v:t.priority===+r.v;
    case 'date': {
      const d=r.f==='added'?ymd(new Date(t.createdAt)):t[r.f]; const n=Math.max(0,parseInt(r.v,10)||0);
      switch(r.op){
        case 'overdue': return !!d&&d<td&&!t.done;
        case 'today': return d===td;
        case 'next': return !!d&&d>=td&&d<=addDays(td,n);
        case 'last': return !!d&&d<=td&&d>=addDays(td,-n);
        case 'before': return !!d&&isDate(r.v)&&d<r.v;
        case 'after': return !!d&&isDate(r.v)&&d>r.v;
        case 'on': return d===r.v;
        case 'empty': return !d;
        case 'set': return !!d;
      } return true;
    }
    case 'person': return r.op==='isnt'?t.assignee!==r.v:r.op==='empty'?!t.assignee:r.op==='set'?!!t.assignee:t.assignee===r.v;
    case 'list': { if(r.op==='empty') return !t.folderId||!S.folders[t.folderId]; const inside=!!t.folderId&&(t.folderId===r.v||descendants(r.v).includes(t.folderId)); return r.op==='isnt'?!inside:inside; }
    case 'tag': return r.op==='isnt'?!t.tags.includes(v):t.tags.includes(v);
    case 'bool': { const b=r.f==='done'?t.done:t.starred; return r.op==='no'?!b:b; }
  }
  return true;
}
function applyRules(tasks,cfg){
  const rules=cfg.rules.filter(r=>r.op);
  if(!rules.length) return tasks;
  return tasks.filter(t=>cfg.match==='any'?rules.some(r=>ruleMatch(t,r)):rules.every(r=>ruleMatch(t,r)));
}

function peopleList(){ return Object.values(S.people).filter(p=>p.active).sort((a,b)=>(b.isMe-a.isMe)||a.order-b.order||a.name.localeCompare(b.name)); }

function buckets(by,tasks,{allFolders=false}={}){
  const t0=today();
  const col=(k,title,set,items,extra={})=>({k,title,set,items,...extra});
  switch(by){
    case 'priority': return [3,2,1,0].map(p=>col('p'+p,p?PRI_NAMES[p]+' priority':'No priority',{priority:p},tasks.filter(x=>x.priority===p),{dot:p?`var(--p-${['','low','med','high'][p]})`:''}));
    case 'assignee': {
      const out=peopleList().map(p=>col('a'+p.id,p.name,{assignee:p.id},tasks.filter(x=>x.assignee===p.id),{dot:p.color}));
      const orphan=tasks.filter(x=>x.assignee&&!S.people[x.assignee]||x.assignee&&S.people[x.assignee]&&!S.people[x.assignee].active);
      out.push(col('a-none','Unassigned',{assignee:''},tasks.filter(x=>!x.assignee).concat(orphan)));
      return out;
    }
    case 'list': {
      const out=[col('l-inbox','Inbox',{folderId:null},tasks.filter(x=>!x.folderId||!S.folders[x.folderId]))];
      for(const {f} of flatTree()){ const items=tasks.filter(x=>x.folderId===f.id); if(items.length||allFolders) out.push(col('l'+f.id,pathName(f.id),{folderId:f.id},items,{dot:f.color})); }
      return out;
    }
    case 'job': {
      const jobs=[...new Set(tasks.map(t=>t.job).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      return [...jobs.map(j=>col('j'+j,j,{job:j},tasks.filter(x=>x.job===j))),col('j-none','No job',{job:''},tasks.filter(x=>!x.job))];
    }
    case 'due': {
      const t1=addDays(t0,1), t7=addDays(t0,7);
      return [
        col('d-over','Overdue',null,tasks.filter(x=>x.due&&x.due<t0&&!x.done),{cls:'alert'}),
        col('d-today','Today',{due:t0},tasks.filter(x=>x.due===t0)),
        col('d-tom','Tomorrow',{due:t1},tasks.filter(x=>x.due===t1)),
        col('d-week','Next 7 days',{due:addDays(t0,2)},tasks.filter(x=>x.due>t1&&x.due<=t7)),
        col('d-later','Later',null,tasks.filter(x=>x.due>t7)),
        col('d-none','No date',{due:''},tasks.filter(x=>!x.due)),
        ...(tasks.some(x=>x.done&&x.due&&x.due<t0)?[col('d-done','Done earlier',null,tasks.filter(x=>x.done&&x.due&&x.due<t0))]:[]),
      ];
    }
    case 'status': return [
      col('s-todo','To do',{status:'',done:false},tasks.filter(x=>!x.done&&!x.status)),
      col('s-doing','In progress',{status:'doing',done:false},tasks.filter(x=>!x.done&&x.status==='doing'),{dot:'var(--accent)'}),
      col('s-waiting','Waiting',{status:'waiting',done:false},tasks.filter(x=>!x.done&&x.status==='waiting'),{dot:'var(--signal)'}),
      col('s-done','Done',{done:true},tasks.filter(x=>x.done).sort((a,b)=>b.doneAt-a.doneAt).slice(0,60),{dot:'var(--ok)'}),
    ];
    default: return [col('all','Tasks',null,tasks)];
  }
}
function applyTaskSet(id,set){
  const t=S.tasks[id]; if(!t||!set) return;
  const p={...set}; delete p.done;
  if(set.done===true&&!t.done){ if(Object.keys(p).length) patch('tasks',id,p); toggleDone(id); return; }
  if(set.done===false&&t.done){ p.done=false; p.doneAt=0; }
  if('due' in p&&!p.due) p.time='';
  if(Object.keys(p).length) patch('tasks',id,p);
  refreshDetail();
}
