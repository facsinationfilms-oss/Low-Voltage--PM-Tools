function personChip(id){ const p=S.people[id]; return p?`<span class="chip person" style="--c:${p.color}" title="Assigned to ${esc(p.name)}"><span class="av" aria-hidden="true">${esc(initials(p.name))}</span>${esc(p.name)}</span>`:''; }
function initials(name){ const w=String(name||'?').trim().split(/\s+/); return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase(); }
function personOptions(sel,none='Nobody'){ return `<option value="">${esc(none)}</option>`+peopleList().map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')+(sel&&S.people[sel]&&!S.people[sel].active?`<option value="${sel}" selected>${esc(S.people[sel].name)} (inactive)</option>`:''); }

/* ---------- BOARD ---------- */
function kbCard(t,cfg,by){
  const o={fields:cfg.fields};
  const chips=[];
  if(t.due&&showF(o,'due')){ const d=diffDays(t.due,today()); chips.push(`<span class="chip date ${!t.done&&d<0?'overdue':!t.done&&d===0?'today':''}">${icon('cal')}${esc(fmtDay(t.due))}${t.time?' · '+esc(fmtTime(t.time)):''}</span>`); }
  if(t.due&&!t.done&&showF(o,'cd')) chips.push(cdHTML(t));
  if(by!=='status'&&showF(o,'status')) chips.push(statusChip(t));
  if(t.priority&&by!=='priority'&&showF(o,'pri')) chips.push(`<span class="chip p${t.priority}">${icon('flag')}${PRI_NAMES[t.priority]}</span>`);
  if(t.assignee&&by!=='assignee'&&showF(o,'assignee')) chips.push(personChip(t.assignee));
  if(t.job&&by!=='job'&&showF(o,'job')) chips.push(`<span class="chip job">${icon('job')}${esc(t.job)}</span>`);
  const f=t.folderId&&S.folders[t.folderId];
  if(f&&by!=='list'&&showF(o,'list')) chips.push(`<span class="chip" style="--c:${f.color}"><span class="dot"></span>${esc(f.name)}</span>`);
  if(t.location&&showF(o,'loc')) chips.push(`<span class="chip">${icon('place')}${esc(t.location)}</span>`);
  if(t.subtasks.length&&showF(o,'checklist')){ const n=t.subtasks.filter(s=>s.done).length; chips.push(`<span class="chip">${icon('checklist')}${n}/${t.subtasks.length}</span>`); }
  if(showF(o,'tags')) for(const g of t.tags) chips.push(`<span class="tag">${esc(g)}</span>`);
  return `<article class="kb-card ${t.done?'done':''} ${t.color?'has-color':''}" data-id="${t.id}" draggable="true" data-drag="task:${t.id}" ${t.color?`style="--c:${t.color}"`:''}>
    <button class="check ${t.done?'done':'p'+t.priority}" data-act="toggle-done" data-id="${t.id}" aria-label="${t.done?'Mark as not done':'Complete'}: ${esc(t.title||'Untitled task')}">${icon('check')}</button>
    <div class="kb-body" data-act="open-task" data-id="${t.id}"><div class="kb-title">${esc(t.title||'Untitled task')}</div>${chips.filter(Boolean).length?`<div class="kb-meta">${chips.join('')}</div>`:''}${showF(o,'added')?`<div class="added" data-added="${t.id}">${esc(addedText(t.createdAt))}</div>`:''}</div></article>`;
}
function boardHTML(key,cfg,tasks,ctxSet){
  const cols=buckets(cfg.boardBy,tasks,{allFolders:key.startsWith('folder:')});
  const sorted=items=>sortTasks(items,'due');
  return `<div class="kb ${cfg.density}" data-by="${cfg.boardBy}">${cols.map(c=>{
    const setAttr=c.set?`data-drop="kcol" data-set='${esc(JSON.stringify(c.set))}'`:'';
    const addSet=c.set?{...ctxSet,...c.set}:null; if(addSet) delete addSet.done;
    return `<section class="kb-col ${c.cls||''}" ${setAttr} data-col="${esc(c.k)}"><header class="kb-head">${c.dot?`<span class="dot round" style="--c:${c.dot}"></span>`:''}<span class="kb-name">${esc(c.title)}</span><span class="count">${c.items.length}</span>${addSet&&!(c.set&&c.set.done)?`<button type="button" class="icon-btn sm" data-act="kb-add" data-set='${esc(JSON.stringify(addSet))}' aria-label="Add a task to ${esc(c.title)}" title="Add a task here">${icon('plus')}</button>`:''}</header>
      <div class="kb-cards">${sorted(c.items).map(t=>kbCard(t,cfg,cfg.boardBy)).join('')||`<div class="kb-empty">${c.set?'Drop tasks here':'Nothing here'}</div>`}</div></section>`;
  }).join('')}</div>`;
}

/* ---------- TABLE ---------- */
function tableSortVal(t,col){
  switch(col){
    case 'title': return (t.title||'').toLowerCase();
    case 'status': return t.done?3:t.status==='waiting'?2:t.status==='doing'?1:0;
    case 'due': return (t.due||'9999')+(t.time||'99');
    case 'time': return t.time||'99';
    case 'cd': return t.due?dueMoment(t):Infinity;
    case 'priority': return -t.priority;
    case 'assignee': return personName(t.assignee).toLowerCase()||'~';
    case 'list': return t.folderId&&S.folders[t.folderId]?pathName(t.folderId).toLowerCase():'~';
    case 'job': case 'location': case 'contact': return (t[col]||'~').toLowerCase();
    case 'start': return t.start||'9999';
    case 'tags': return t.tags.join(',')||'~';
    case 'checklist': return t.subtasks.length?t.subtasks.filter(s=>s.done).length/t.subtasks.length:2;
    case 'added': return t.createdAt; case 'updated': return t.updatedAt;
  }
  return 0;
}
function tableCell(t,col){
  const id=t.id, fid=f=>`id="tb-${id}-${f}" data-tf="${f}" data-id="${id}"`;
  switch(col){
    case 'title': return `<td class="tc-title"><div class="tc-flex"><button class="check ${t.done?'done':'p'+t.priority}" data-act="toggle-done" data-id="${id}" aria-label="${t.done?'Mark as not done':'Complete'}">${icon('check')}</button><input class="tb-in" ${fid('title')} value="${esc(t.title)}" placeholder="Untitled task" aria-label="Task name"><button type="button" class="icon-btn sm" data-act="open-task" data-id="${id}" title="Open" aria-label="Open task">${icon('open')}</button></div></td>`;
    case 'status': return `<td><select class="tb-sel" ${fid('status')} aria-label="Status">${STATUS.map(([v,l])=>`<option value="${v}" ${!t.done&&t.status===v?'selected':''}>${l}</option>`).join('')}<option value="done" ${t.done?'selected':''}>Done</option></select></td>`;
    case 'due': return `<td><input type="date" class="tb-in" ${fid('due')} value="${t.due}" aria-label="Due date"></td>`;
    case 'time': return `<td><input type="time" class="tb-in" ${fid('time')} value="${t.time}" aria-label="Due time"></td>`;
    case 'cd': return `<td>${t.done?'':cdHTML(t)}</td>`;
    case 'priority': return `<td><select class="tb-sel p${t.priority}" ${fid('priority')} aria-label="Priority">${[0,1,2,3].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${PRI_NAMES[p]}</option>`).join('')}</select></td>`;
    case 'assignee': return `<td><select class="tb-sel" ${fid('assignee')} aria-label="Assigned to">${personOptions(t.assignee,'—')}</select></td>`;
    case 'list': return `<td><select class="tb-sel" ${fid('folderId')} aria-label="List">${folderOptions(t.folderId)}</select></td>`;
    case 'job': return `<td><input class="tb-in" ${fid('job')} value="${esc(t.job)}" list="tb-jobs" aria-label="Job"></td>`;
    case 'location': return `<td><input class="tb-in" ${fid('location')} value="${esc(t.location)}" aria-label="Location"></td>`;
    case 'contact': return `<td><input class="tb-in" ${fid('contact')} value="${esc(t.contact)}" aria-label="Contact"></td>`;
    case 'start': return `<td><input type="date" class="tb-in" ${fid('start')} value="${t.start}" aria-label="Start date"></td>`;
    case 'tags': return `<td class="tc-tags">${t.tags.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</td>`;
    case 'checklist': { const n=t.subtasks.length, d=t.subtasks.filter(s=>s.done).length; return `<td class="tc-mono">${n?`${d}/${n}`:''}</td>`; }
    case 'added': return `<td class="tc-mono" title="${esc(fmtStamp(t.createdAt))}">${esc(shortStamp(t.createdAt))}</td>`;
    case 'updated': return `<td class="tc-mono" title="${esc(fmtStamp(t.updatedAt))}">${esc(shortStamp(t.updatedAt))}</td>`;
  }
  return '<td></td>';
}
function shortStamp(ms){ if(!ms) return ''; const d=new Date(ms); return `${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''} ${fmtTime(pad(d.getHours())+':'+pad(d.getMinutes()))}`; }
function tableHTML(key,cfg,tasks){
  const cols=TABLE_COLS.filter(c=>c.always||cfg.cols.includes(c.k));
  const {col,dir}=cfg.tsort;
  const rows=tasks.slice().sort((a,b)=>{ const x=tableSortVal(a,col), y=tableSortVal(b,col); return (x<y?-1:x>y?1:byOrder(a,b))*dir; });
  return `<div class="tb-wrap ${cfg.density}"><table class="tb"><thead><tr>${cols.map(c=>`<th scope="col" class="th-${c.k}"><button type="button" data-act="tsort" data-key="${esc(key)}" data-col="${c.k}" aria-sort="${col===c.k?(dir===1?'ascending':'descending'):'none'}">${esc(c.l)}${col===c.k?`<span class="sort-ar">${dir===1?'▲':'▼'}</span>`:''}</button></th>`).join('')}</tr></thead>
    <tbody>${rows.map(t=>`<tr data-id="${t.id}" class="${t.done?'done':''}" ${t.color?`style="--c:${t.color}"`:''}>${cols.map(c=>tableCell(t,c.k)).join('')}</tr>`).join('')}</tbody></table>
    ${rows.length?'':`<div class="group-empty">No tasks match.</div>`}<datalist id="tb-jobs">${allJobs().map(j=>`<option value="${esc(j)}">`).join('')}</datalist></div>`;
}
function tableEdit(el){
  const id=el.dataset.id, f=el.dataset.tf, t=S.tasks[id]; if(!t) return;
  const v=el.value;
  if(f==='status'){ if(v==='done'){ if(!t.done) toggleDone(id); } else applyTaskSet(id,{status:v,done:false}); return; }
  const p={};
  if(f==='title') p.title=v;
  else if(f==='priority') p.priority=+v||0;
  else if(f==='folderId') p.folderId=v||null;
  else if(f==='assignee') p.assignee=v;
  else if(f==='due'){ p.due=isDate(v)?v:''; if(!p.due) p.time=''; }
  else if(f==='time'){ p.time=isTime(v)?v:''; if(p.time&&!t.due) p.due=today(); }
  else if(f==='start') p.start=isDate(v)?v:'';
  else if(['job','location','contact'].includes(f)) p[f]=v.slice(0,200);
  else return;
  patch('tasks',id,p); refreshDetail();
}

/* ---------- CALENDARS (month grid + time grid) ---------- */
const weekStartOf=d=>{ const ws=+UI.weekStart||0; return addDays(d,-((toDate(d).getDay()-ws+7)%7)); };
const toMin=t=>{ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const fromMin=m=>{ m=Math.max(0,Math.min(24*60-1,Math.round(m))); return pad(Math.floor(m/60))+':'+pad(m%60); };
function calNavHTML(key,cfg,label,modes=['month','week','day']){
  return `<div class="cal-nav lay-cal-nav"><button class="icon-btn" data-act="lay-cal-nav" data-key="${esc(key)}" data-dir="-1" aria-label="Previous">${icon('left')}</button><button class="btn sm" data-act="lay-cal-nav" data-key="${esc(key)}" data-dir="0">Today</button><button class="icon-btn" data-act="lay-cal-nav" data-key="${esc(key)}" data-dir="1" aria-label="Next">${icon('right')}</button><span class="cal-month">${esc(label)}</span><span class="spacer"></span>
    <div class="seg" role="group" aria-label="Calendar range">${modes.map(m=>`<button type="button" data-act="set-cfg" data-key="${esc(key)}" data-k="calMode" data-val="${m}" aria-pressed="${cfg.calMode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>`;
}
function calLabel(mode,anchor){
  const d=toDate(anchor);
  if(mode==='month') return `${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`;
  if(mode==='day') return fmtLong(anchor);
  const s=weekStartOf(anchor), e=addDays(s,6), sd=toDate(s), ed=toDate(e);
  return sd.getMonth()===ed.getMonth()?`${MONTHS[sd.getMonth()]} ${sd.getDate()} – ${ed.getDate()}, ${ed.getFullYear()}`:`${MONTHS[sd.getMonth()]} ${sd.getDate()} – ${MONTHS[ed.getMonth()]} ${ed.getDate()}, ${ed.getFullYear()}`;
}
function shiftAnchor(mode,anchor,dir){
  if(!dir) return today();
  if(mode==='day') return addDays(anchor,dir);
  if(mode==='week') return addDays(anchor,7*dir);
  const d=toDate(anchor); d.setDate(1); d.setMonth(d.getMonth()+dir); return ymd(d);
}
/* items: {date, html} per date for month grid */
function monthGridHTML(anchor,byDate,{key,addSet=null,addKind='task'}={}){
  const [y,m]=anchor.split('-').map(Number);
  const first=new Date(y,m-1,1); const ws=+UI.weekStart||0;
  const offset=(first.getDay()-ws+7)%7; const dim=new Date(y,m,0).getDate();
  const weeks=Math.ceil((offset+dim)/7); const start=addDays(ymd(first),-offset); const t=today();
  let g=''; for(let i=0;i<7;i++) g+=`<div class="cal-dow">${DOW[(i+ws)%7]}</div>`;
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), dt=toDate(d), items=byDate[d]||[], out=dt.getMonth()!==m-1;
    const lim=items.length===4?4:3;
    g+=`<div class="cal-cell lay-cell ${out?'out':''} ${d===t?'today':''}" data-drop="day" data-date="${d}"><div class="cal-top"><span class="cal-num">${dt.getDate()}</span>${addSet?`<button type="button" class="icon-btn sm cal-add" data-act="lay-add-day" data-kind="${addKind}" data-date="${d}" data-set='${esc(JSON.stringify(addSet))}' aria-label="Add on ${esc(fmtLong(d))}">${icon('plus')}</button>`:''}</div>${items.slice(0,lim).map(x=>x.html).join('')}${items.length>lim?`<button type="button" class="cal-more" data-act="lay-day-open" data-key="${esc(key)}" data-date="${d}">+${items.length-lim} more</button>`:''}<div class="cal-dots">${items.slice(0,6).map(x=>`<i style="--c:${x.color||'var(--muted)'}"></i>`).join('')}</div></div>`;
  }
  return `<div class="cal lay-month" role="grid">${g}</div>`;
}
/* generic time grid: columns (days or people) with timed blocks and an all-day row */
function timeGridHTML({cols,items,startH=6,endH=21,slotAct='slot-add',slotKind='task',addSet=null,compact=false}){
  const ppm=compact?.7:.9, H=(endH-startH)*60*ppm, t0=today();
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const head=cols.map(c=>`<div class="tg-ch ${c.date===t0&&!c.person?'today':''}">${c.head}</div>`).join('');
  const allDay=cols.map((c,ci)=>`<div class="tg-ad" data-drop="${c.person!==undefined?'scell':'day'}" data-date="${c.date}" ${c.person!==undefined?`data-person="${c.person}"`:''}>${items.filter(x=>x.col===ci&&x.allDay).map(x=>x.html).join('')}</div>`).join('');
  let hours=''; for(let h=startH;h<endH;h++) hours+=`<div class="tg-hr" style="height:${60*ppm}px"><span>${fmtTime(pad(h)+':00')}</span></div>`;
  const colsHTML=cols.map((c,ci)=>{
    let slots=''; for(let m=startH*60;m<endH*60;m+=30) slots+=`<div class="tg-slot ${m%60?'half':''}" style="height:${30*ppm}px" data-drop="slot" data-date="${c.date}" data-time="${fromMin(m)}" ${c.person!==undefined?`data-person="${c.person}"`:''} data-act="${slotAct}" data-kind="${slotKind}" ${addSet?`data-set='${esc(JSON.stringify(addSet))}'`:''}></div>`;
    const mine=items.filter(x=>x.col===ci&&!x.allDay).map(x=>({...x,s:Math.max(x.start,startH*60),e:Math.min(Math.max(x.end,x.start+20),endH*60)})).filter(x=>x.e>startH*60&&x.s<endH*60).sort((a,b)=>a.s-b.s||b.e-a.e);
    // lanes for overlaps
    const lanesEnd=[]; for(const x of mine){ let l=lanesEnd.findIndex(e=>e<=x.s); if(l<0){ l=lanesEnd.length; lanesEnd.push(x.e); } else lanesEnd[l]=x.e; x.lane=l; }
    for(const x of mine){ x.n=Math.max(1,...mine.filter(y=>y.s<x.e&&y.e>x.s).map(y=>y.lane+1)); }
    const blocks=mine.map(x=>`<div class="tg-item ${x.cls||''}" style="top:${(x.s-startH*60)*ppm}px;height:${Math.max(18,(x.e-x.s)*ppm-2)}px;left:calc(${x.lane}/${x.n}*100% + 2px);width:calc(100%/${x.n} - 4px);${x.style||''}" ${x.attrs||''}>${x.html}</div>`).join('');
    const nowLine=c.date===t0&&nowMin>=startH*60&&nowMin<endH*60?`<div class="tg-now" style="top:${(nowMin-startH*60)*ppm}px"></div>`:'';
    return `<div class="tg-col ${c.date===t0&&!c.person?'today':''}" style="height:${H}px">${slots}${blocks}${nowLine}</div>`;
  }).join('');
  return `<div class="tg" style="--n:${cols.length}"><div class="tg-row tg-headrow"><div class="tg-corner"></div>${head}</div><div class="tg-row tg-adrow"><div class="tg-corner tg-adlab">All day</div>${allDay}</div><div class="tg-row tg-bodyrow"><div class="tg-times">${hours}</div>${colsHTML}</div></div>`;
}
function taskCalChip(t){ const c=itemColor(t); return `<div class="cal-chip ${t.done?'done':''}" ${c?`style="--c:${c}"`:''} data-act="open-task" data-id="${t.id}" draggable="true" data-drag="task:${t.id}" title="${esc((t.title||'Untitled')+(t.time?' · '+fmtTime(t.time):''))}">${icon(t.done?'done':'check')}<span class="t">${t.time?`<b>${fmtTime(t.time)}</b> `:''}${esc(t.title||'Untitled')}</span></div>`; }
function taskCalHTML(key,cfg,tasks,ctxSet){
  const mode=cfg.calMode, anchor=cfg.anchor||today();
  const nav=calNavHTML(key,cfg,calLabel(mode,anchor));
  if(mode==='month'){
    const by={}; for(const t of tasks) if(t.due) (by[t.due]||(by[t.due]=[])).push(t);
    const byDate={}; for(const d in by) byDate[d]=by[d].sort((a,b)=>(a.done-b.done)||(a.time||'99').localeCompare(b.time||'99')).map(t=>({html:taskCalChip(t),color:itemColor(t)}));
    const undated=tasks.filter(t=>!t.due&&!t.done).length;
    return nav+monthGridHTML(anchor,byDate,{key,addSet:ctxSet})+(undated?`<p class="view-sub lay-note">${undated} task${undated===1?' has':'s have'} no due date, so ${undated===1?'it isn’t':'they aren’t'} on the calendar.</p>`:'');
  }
  const days=mode==='day'?[anchor]:Array.from({length:7},(_,i)=>addDays(weekStartOf(anchor),i));
  const cols=days.map(d=>{ const dt=toDate(d); return {date:d,head:`<span class="tg-dow">${DOW[dt.getDay()]}</span><button type="button" class="tg-dnum" data-act="lay-day-open" data-key="${esc(key)}" data-date="${d}">${dt.getDate()}</button>`}; });
  const items=[];
  for(const t of tasks){ const ci=days.indexOf(t.due); if(ci<0) continue;
    const c=itemColor(t);
    if(t.time){ const s=toMin(t.time); items.push({col:ci,start:s,end:s+45,cls:'tg-task'+(t.done?' done':''),style:c?`--c:${c}`:'',attrs:`data-act="open-task" data-id="${t.id}" draggable="true" data-drag="task:${t.id}" title="${esc(t.title)}"`,html:`<b>${fmtTime(t.time)}</b> ${esc(t.title||'Untitled')}`}); }
    else items.push({col:ci,allDay:true,html:taskCalChip(t)});
  }
  return nav+`<div class="tg-wrap">${timeGridHTML({cols,items,startH:cfg.startH,endH:cfg.endH,slotKind:'task',addSet:ctxSet})}</div>`;
}

/* ---------- TIMELINE ---------- */
function timelineHTML(key,cfg,tasks){
  const z=TL_ZOOM.find(x=>x[0]===cfg.tlZoom)||TL_ZOOM[1]; const N=z[2], dw=z[3];
  const start=cfg.tlStart||addDays(weekStartOf(today()),-7); const end=addDays(start,N-1); const t0=today();
  const dated=tasks.filter(t=>t.due||t.start), undated=tasks.filter(t=>!t.due&&!t.start);
  const span=t=>{ let s=t.start||t.due, e=t.due||t.start; if(e<s) [s,e]=[e,s]; return [s,e]; };
  const visible=dated.filter(t=>{ const [s,e]=span(t); return e>=start&&s<=end; });
  const groups=buckets(cfg.tlGroup==='none'?'':cfg.tlGroup,visible).filter(g=>g.items.length);
  // header
  let head='', months='';
  for(let i=0;i<N;i++){ const d=addDays(start,i), dt=toDate(d), wk=dt.getDay()===0||dt.getDay()===6;
    head+=`<div class="tl-d ${d===t0?'today':''} ${wk?'wk':''}" title="${esc(fmtLong(d))}">${dw>=26?`<span>${DOW[dt.getDay()][0]}</span><b>${dt.getDate()}</b>`:(dt.getDate()===1||i===0||dt.getDay()===(+UI.weekStart||0)?`<b>${dt.getDate()}</b>`:'')}</div>`;
    if(i===0||dt.getDate()===1) months+=`<div class="tl-m" style="grid-column:${i+1}/span ${Math.min(N-i,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()-dt.getDate()+1)}">${MONTHS_LONG[dt.getMonth()]} ${dt.getFullYear()}</div>`;
  }
  const todayIdx=diffDays(t0,start);
  const row=t=>{
    const [s,e]=span(t); const a=Math.max(0,diffDays(s,start)), b=Math.min(N-1,diffDays(e,start));
    const c=itemColor(t)||'var(--accent)';
    const cutL=s<start, cutR=e>end;
    return `<div class="tl-row ${t.done?'done':''}"><button type="button" class="tl-label" data-act="open-task" data-id="${t.id}" title="${esc(t.title)}"><span class="check-mini ${t.done?'done':''}"></span>${esc(t.title||'Untitled task')}</button><div class="tl-track">

  const nav=`<div class="cal-nav lay-cal-nav"><button class="icon-btn" data-act="tl-nav" data-key="${esc(key)}" data-dir="-1" aria-label="Earlier">${icon('left')}</button><button class="btn sm" data-act="tl-nav" data-key="${esc(key)}" data-dir="0">Today</button><button class="icon-btn" data-act="tl-nav" data-key="${esc(key)}" data-dir="1" aria-label="Later">${icon('right')}</button><span class="cal-month">${esc(`${MONTHS[toDate(start).getMonth()]} ${toDate(start).getDate()} – ${MONTHS[toDate(end).getMonth()]} ${toDate(end).getDate()}, ${toDate(end).getFullYear()}`)}</span><span class="spacer"></span>
    <div class="seg" role="group" aria-label="Zoom">${TL_ZOOM.map(([v,l])=>`<button type="button" data-act="set-cfg" data-key="${esc(key)}" data-k="tlZoom" data-val="${v}" aria-pressed="${cfg.tlZoom===v}">${l}</button>`).join('')}</div>
    <label class="ctl">Group <select data-cfg="tlGroup" data-key="${esc(key)}" id="tl-group">${TL_GROUPS.map(([v,l])=>`<option value="${v}" ${cfg.tlGroup===v?'selected':''}>${l}</option>`).join('')}</select></label></div>`;
  const hidden=dated.length-visible.length;
  return nav+`<div class="tl-wrap"><div class="tl" style="--dw:${dw}px;--n:${N}"><div class="tl-row tl-headrow"><div class="tl-label tl-corner">Task</div><div class="tl-track tl-scale"><div class="tl-months">${months}</div><div class="tl-days">${head}</div></div></div>
    ${body||`<div class="group-empty">Nothing scheduled in these dates. Use the arrows to look earlier or later.</div>`}
    ${todayIdx>=0&&todayIdx<N?`<div class="tl-today" style="--i:${todayIdx}" aria-hidden="true"></div>`:''}</div></div>
    <p class="view-sub lay-note">Bars run from a task’s <b>start date</b> to its <b>due date</b>. Drag a bar to move it, or drag its right edge to change the due date.${hidden?` ${hidden} task${hidden===1?' is':'s are'} outside these dates.`:''}</p>
    ${undated.length?group({key:'tl-undated-'+key,title:'No dates yet',count:undated.length,defCollapsed:true,body:taskList(sortTasks(undated),{fields:cfg.fields})}):''}`;
}
/* dragging timeline bars */
let TLD=null;
document.addEventListener('pointerdown',e=>{
  const bar=e.target.closest&&e.target.closest('.tl-bar'); if(!bar||e.button>0) return;
  const t=S.tasks[bar.dataset.tl]; if(!t) return;
  const dw=parseFloat(getComputedStyle(bar.closest('.tl')).getPropertyValue('--dw'))||30;
  TLD={id:t.id,bar,x0:e.clientX,dw,mode:e.target.dataset.tlh?'end':'move',moved:false,days:0};
  bar.setPointerCapture&&bar.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!TLD) return;
  const dx=e.clientX-TLD.x0; if(Math.abs(dx)>4) TLD.moved=true;
  TLD.days=Math.round(dx/TLD.dw);
  if(TLD.mode==='move') TLD.bar.style.transform=`translateX(${TLD.days*TLD.dw}px)`;
  else TLD.bar.style.marginRight=`${-TLD.days*TLD.dw}px`;
  TLD.bar.classList.toggle('dragging',TLD.moved);
});
document.addEventListener('pointerup',()=>{
  if(!TLD) return; const d=TLD; TLD=null;
  d.bar.style.transform=''; d.bar.style.marginRight=''; d.bar.classList.remove('dragging');
  const t=S.tasks[d.id]; if(!t) return;
  if(!d.moved){ openDetail('tasks',d.id); return; }
  if(!d.days) return;
  const s=t.start||t.due, e=t.due||t.start;
  if(d.mode==='move'){
    const p={}; if(t.start) p.start=addDays(t.start,d.days); if(t.due) p.due=addDays(t.due,d.days);
    patch('tasks',d.id,p); toast(`Moved ${d.days>0?'later':'earlier'} by ${plural(Math.abs(d.days),'day')}`,{action:()=>{ patch('tasks',d.id,{start:t.start,due:t.due}); }});
  }else{
    let ne=addDays(e,d.days); if(ne<s) ne=s;
    const p={due:ne}; if(!t.start&&ne!==s) p.start=s;
    patch('tasks',d.id,p); toast(`Due ${fmtDay(ne)}`,{action:()=>{ patch('tasks',d.id,{start:t.start,due:t.due}); }});
  }
  refreshDetail();
});
document.addEventListener('pointercancel',()=>{ if(TLD){ TLD.bar.style.transform=''; TLD.bar.style.marginRight=''; TLD=null; } });

/* ---------- saved views ---------- */
function viewBaseTasks(base){
  const all=Object.values(S.tasks);
  if(base.startsWith('folder:')){ const id=base.slice(7); if(!S.folders[id]) return []; const ids=[id,...descendants(id)]; return all.filter(t=>ids.includes(t.folderId)); }
  if(base.startsWith('tag:')){ const g=base.slice(4); return all.filter(t=>t.tags.includes(g)); }
  if(base==='inbox') return all.filter(t=>!t.folderId||!S.folders[t.folderId]);
  if(base==='starred') return all.filter(t=>t.starred);
  return all;
}
function baseName(base){
  if(base.startsWith('folder:')){ const f=S.folders[base.slice(7)]; return f?pathName(f.id):'a deleted list'; }
  if(base.startsWith('tag:')) return '#'+base.slice(4);
  return {inbox:'Inbox',starred:'Starred',all:'All tasks'}[base]||'All tasks';
}
VIEWS.saved=()=>{

};
function renderViewsNav(){

/* ---------- Advanced filters ---------- */
function ruleValueHTML(r,i){
  const def=RULE_FIELDS.find(f=>f[0]===r.f)||RULE_FIELDS[0]; const type=def[2];
  if(['empty','set','overdue','today','yes','no'].includes(r.op)) return '';
  const a=`data-rv="${i}" aria-label="Value"`;
  switch(type){
    case 'status': return `<select ${a}>${[['todo','To do'],['doing','In progress'],['waiting','Waiting'],['done','Done']].map(([v,l])=>`<option value="${v}" ${r.v===v?'selected':''}>${l}</option>`).join('')}</select>`;
    case 'pri': return `<select ${a}>${[3,2,1,0].map(p=>`<option value="${p}" ${String(r.v)===String(p)?'selected':''}>${PRI_NAMES[p]}</option>`).join('')}</select>`;
    case 'person': return `<select ${a}>${peopleList().map(p=>`<option value="${p.id}" ${r.v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')||'<option value="">No people yet</option>'}</select>`;
    case 'list': return `<select ${a}>${flatTree().map(({f,d})=>`<option value="${f.id}" ${r.v===f.id?'selected':''}>${'  '.repeat(d)}${esc(f.name)}</option>`).join('')||'<option value="">No lists yet</option>'}</select>`;
    case 'tag': return `<select ${a}>${allTags().map(([g])=>`<option value="${esc(g)}" ${r.v===g?'selected':''}>#${esc(g)}</option>`).join('')||'<option value="">No tags yet</option>'}</select>`;
    case 'date': return ['next','last'].includes(r.op)?`<input type="number" min="0" max="999" ${a} value="${esc(r.v||'7')}" style="width:80px"> <span class="view-sub">days</span>`:`<input type="date" ${a} value="${esc(isDate(r.v)?r.v:'')}">`;
    default: return `<input ${a} value="${esc(r.v)}" placeholder="text">`;
  }
}
function defaultValue(f,op){ const type=(RULE_FIELDS.find(x=>x[0]===f)||[])[2]; if(type==='status') return 'todo'; if(type==='pri') return '3'; if(type==='person') return (peopleList()[0]||{}).id||''; if(type==='list') return (flatTree()[0]||{f:{}}).f.id||''; if(type==='tag') return (allTags()[0]||[''])[0]; if(type==='date') return ['next','last'].includes(op)?'7':today(); return ''; }
function advancedFilters(key){
  const cfg=cfgFor(key); let rules=clone(cfg.rules); let match=cfg.match;
  const pool=()=>{ if(key.startsWith('saved:')){ const v=S.views[key.slice(6)]; return v?viewBaseTasks(v.base):[]; } const b=key==='all'||key==='inbox'||key==='starred'||key.startsWith('folder:')||key.startsWith('tag:')?key:'all'; return viewBaseTasks(b); };
  const body=()=>`<p>Only show tasks that match <select id="adv-match" aria-label="Match"><option value="all" ${match==='all'?'selected':''}>all</option><option value="any" ${match==='any'?'selected':''}>any</option></select> of these rules:</p>
    <div class="adv-rules">${rules.map((r,i)=>{ const def=RULE_FIELDS.find(f=>f[0]===r.f)||RULE_FIELDS[0]; return `<div class="adv-rule"><select data-rf="${i}" aria-label="Field">${RULE_FIELDS.map(([k,l])=>`<option value="${k}" ${r.f===k?'selected':''}>${l}</option>`).join('')}</select><select data-ro="${i}" aria-label="Condition">${RULE_OPS[def[2]].map(([k,l])=>`<option value="${k}" ${r.op===k?'selected':''}>${l}</option>`).join('')}</select>${ruleValueHTML(r,i)}<button type="button" class="icon-btn sm" data-rdel="${i}" aria-label="Remove rule">${icon('close')}</button></div>`; }).join('')||'<div class="group-empty">No rules yet — everything shows.</div>'}</div>
    <button type="button" class="btn sm" id="adv-add">${icon('plus')}Add a rule</button>
    <p class="adv-count" id="adv-count"></p>
    <details class="adv-help"><summary>Examples</summary><ul><li><b>Due date · within the next 7 days</b> and <b>Priority · is at least High</b> — this week’s urgent work.</li><li><b>Assigned to · is</b> Kyle and <b>Status · is not Done</b> — Kyle’s open tasks.</li><li><b>Job · contains</b> “Milford” — everything for one job.</li></ul></details>`;
  const count=w=>{ const c={...cfg,rules,match}; const base=pool(); const open=cfg.showDone?base:base.filter(t=>!t.done); const n=applyRules(open,c).length; const el=w.querySelector('#adv-count'); if(el) el.textContent=`${n} task${n===1?'':'s'} match right now.`; };
  const bind=w=>{
    const box=w.querySelector('.modal'); const redraw=()=>{ const h2=box.querySelector('h2').outerHTML, acts=box.querySelector('.modal-actions').outerHTML; const st=box.scrollTop; box.querySelector('.adv-body').innerHTML=body(); box.scrollTop=st; count(w); };
    box.addEventListener('change',e=>{
      const t=e.target;
      if(t.id==='adv-match'){ match=t.value; count(w); return; }
      if(t.dataset.rf!==undefined){ const i=+t.dataset.rf; const f=t.value; const type=RULE_FIELDS.find(x=>x[0]===f)[2]; const op=RULE_OPS[type][0][0]; rules[i]={f,op,v:defaultValue(f,op)}; redraw(); return; }
      if(t.dataset.ro!==undefined){ const i=+t.dataset.ro; rules[i].op=t.value; if(!rules[i].v||(['next','last'].includes(t.value)!==/^\d+$/.test(rules[i].v))) rules[i].v=defaultValue(rules[i].f,t.value); redraw(); return; }
      if(t.dataset.rv!==undefined){ rules[+t.dataset.rv].v=t.value; count(w); }
    });
    box.addEventListener('input',e=>{ const t=e.target; if(t.dataset.rv!==undefined&&t.tagName==='INPUT'&&t.type!=='date'){ rules[+t.dataset.rv].v=t.value; count(w); } });
    box.addEventListener('click',e=>{

   Schedule: people, jobs, shifts, appointments, time off

const SCHED_TYPES=[['job','Job','#0B84F3','job'],['shift','Shift','#30A46C','clock'],['appt','Appointment','#8E4EC6','cal'],['off','Time off','#8A8F98','sun']];
const SCHED_REPEATS=[['','Doesn’t repeat'],['daily','Every day'],['weekdays','Every weekday'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month']];
const SVIEWS=[['board','Crew board','board'],['week','Week','cal'],['day','Day','clock'],['list','List','all'],['team','Team','team']];
const typeInfo=t=>SCHED_TYPES.find(x=>x[0]===t)||SCHED_TYPES[0];
const SCHED_DEF={schedView:'board',schedDate:'',schedDays:7,schedPeople:[],schedTypes:['job','shift','appt','off'],schedStartH:6,schedEndH:19,schedColorBy:'type',schedTasks:true,schedHours:true};
for(const [k,v] of Object.entries(SCHED_DEF)) if(UI[k]===undefined||typeof UI[k]!==typeof v||(Array.isArray(v)&&!Array.isArray(UI[k]))) UI[k]=Array.isArray(v)?v.slice():v;

/* ---------- time helpers ---------- */
const hm=m=>{ m=Math.round(m); const h=Math.floor(m/60), mm=m%60; return h&&mm?`${h}h ${mm}m`:h?`${h}h`:`${mm}m`; };
const shortTime=t=>{ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'p':'a'; const hh=h%12||12; return m?`${hh}:${pad(m)}${ap}`:`${hh}${ap}`; };
function timeRange(e){ if(e.type==='off'&&!e.start) return 'All day'; if(e.allDay||!e.start) return 'All day'; return e.end?`${shortTime(e.start)}–${shortTime(e.end)}`:shortTime(e.start); }
function entryMinutes(e,person){
  if(e.type==='off') return 0;
  if(e.allDay||!e.start||!e.end){ if(e.type==='appt') return 0; const p=person&&S.people[person]; const s=toMin(p?p.dayStart:'07:00'), en=toMin(p?p.dayEnd:'15:30'); return Math.max(0,en-s); }
  let s=toMin(e.start), en=toMin(e.end); if(en<=s) en+=24*60; return en-s;
}

/* ---------- occurrences (repeats + multi-day) ---------- */
const REP_STEP={daily:1,weekdays:1,weekly:7,biweekly:14};
function occurrences(from,to){
  const out=[];
  for(const e of Object.values(S.sched)){
    const span=e.endDate?Math.max(0,diffDays(e.endDate,e.date)):0;
    if(!e.repeat){ const end=addDays(e.date,span); if(end>=from&&e.date<=to) out.push({e,oid:e.id,date:e.date,endDate:end,rep:false}); continue; }
    const until=e.repeatUntil&&e.repeatUntil<to?e.repeatUntil:to;
    let d=e.date, guard=0;
    const step=REP_STEP[e.repeat];
    if(step){ const back=diffDays(from,e.date)-span; if(back>step){ d=addDays(e.date,Math.floor(back/step)*step); } }
    while(d<=until&&guard++<800){
      const end=addDays(d,span);
      const wk=toDate(d).getDay();
      if(end>=from&&!(e.repeat==='weekdays'&&(wk===0||wk===6))) out.push({e,oid:e.id+'@'+d,date:d,endDate:end,rep:true});
      d=step?addDays(d,step):advance(d,'monthly');
    }
  }
  return out;
}
function schedFilterPeople(){ const act=peopleList(); const sel=(UI.schedPeople||[]).filter(id=>S.people[id]); return sel.length?act.filter(p=>sel.includes(p.id)):act; }
function occForPerson(occ,pid){ return pid==='__none'?!occ.e.people.filter(id=>S.people[id]).length:occ.e.people.includes(pid); }
function typeOn(t){ return (UI.schedTypes||[]).includes(t); }

/* ---------- colors ---------- */
function hashColor(s){ let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length][1]; }
function entryColor(e,pid){
  if(e.color) return e.color;
  const by=UI.schedColorBy;
  if(by==='person'){ const p=S.people[pid&&pid!=='__none'?pid:e.people[0]]; if(p) return p.color; }
  if(by==='job'&&e.job) return hashColor(e.job.toLowerCase());
  return typeInfo(e.type)[2];
}

/* ---------- conflicts ---------- */
function conflictsIn(from,to){
  const occ=occurrences(from,to); const out=new Map(); // oid -> [messages]
  const add=(o,msg)=>{ if(!out.has(o.oid)) out.set(o.oid,[]); const l=out.get(o.oid); if(!l.includes(msg)) l.push(msg); };
  for(const p of Object.values(S.people)){
    const mine=occ.filter(o=>o.e.people.includes(p.id));
    for(let d=from; d<=to; d=addDays(d,1)){
      const today_=mine.filter(o=>o.date<=d&&o.endDate>=d);
      const off=today_.filter(o=>o.e.type==='off'), work=today_.filter(o=>o.e.type!=='off');
      if(off.length&&work.length) for(const w of work) add(w,`${p.name} has time off on ${fmtDay(d)}`);
      const timed=work.filter(o=>o.e.start&&o.e.end&&!o.e.allDay).map(o=>({o,s:toMin(o.e.start),en:toMin(o.e.end)<=toMin(o.e.start)?toMin(o.e.end)+1440:toMin(o.e.end)}));
      for(let i=0;i<timed.length;i++) for(let j=i+1;j<timed.length;j++){ const a=timed[i], b=timed[j]; if(a.s<b.en&&b.s<a.en){ add(a.o,`${p.name} is double-booked with “${b.o.e.title||b.o.e.job||typeInfo(b.o.e.type)[1]}”`); add(b.o,`${p.name} is double-booked with “${a.o.e.title||a.o.e.job||typeInfo(a.o.e.type)[1]}”`); } }
    }
  }
  return out;
}

/* ---------- range ---------- */
function schedAnchor(){ return isDate(UI.schedDate)?UI.schedDate:today(); }
function schedRange(){
  const a=schedAnchor();
  if(UI.schedView==='day') return [a];
  const n=+UI.schedDays||7;
  const start=n===5?addDays(a,-((toDate(a).getDay()+6)%7)):weekStartOf(a);

}
function rangeLabel(days){
  if(days.length===1) return fmtLong(days[0]);

}

function av(p,cls=''){ return `<span class="av ${cls}" style="--c:${p.color}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`; }

};
function schedEmpty(){
  return `<div class="sched-empty"><div class="se-ill">${icon('team')}</div><h3>Set up your crew</h3><p>Add yourself first, then the people you schedule. You’ll be able to put visits, appointments and time off on everyone’s calendar, and see who’s free at a glance.</p><div class="row"><button class="btn primary" data-act="add-me">${icon('user')}Add me</button><button class="btn" data-act="person-new">${icon('plus')}Add someone else</button></div></div>`;

function hoursFor(pid,days){
  const from=days[0], to=days[days.length-1]; let m=0;
  for(const o of occurrences(from,to)) if(o.e.people.includes(pid)) for(let d=o.date; d<=o.endDate; d=addDays(d,1)) if(d>=from&&d<=to) m+=entryMinutes(o.e,pid);
  return m;
}
function crewBoard(days){
  const from=days[0], to=days[days.length-1], t0=today(), N=days.length;
  const occ=occurrences(from,to).filter(o=>typeOn(o.e.type));
  const warn=conflictsIn(from,to);
  const rows=schedFilterPeople().map(p=>({pid:p.id,p}));
  if(occ.some(o=>occForPerson(o,'__none'))&&!(UI.schedPeople||[]).length) rows.push({pid:'__none',p:null});

/* ---------- quick add ---------- */
const WD_RE='(sun(?:day)?|mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?)';
const WD_IDX=w=>({sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6})[w.slice(0,3).toLowerCase()];
function parseSched(text){
  const out={type:'job',people:[],date:'',endDate:'',start:'',end:'',allDay:false,job:'',title:'',location:'',tokens:[]};
  let s=' '+text.trim()+' ';
  const cut=re=>{ let m=null; s=s.replace(re,(...a)=>{ m=a; return ' '; }); return m; };
  // type
  if(/\b(off|vacation|pto|sick|day off|holiday|out of office|ooo|out)\b/i.test(s)){ out.type='off'; }
  else if(/\b(shift|visit)\b/i.test(s)){ out.type='job'; cut(/\b(shift|visit)\b/i); }
  else if(/\b(meeting|meet|appt|appointment|site walk|walkthrough|walk-through|walk through|inspection|estimate visit|call)\b/i.test(s)) out.type='appt';
  // people
  const ppl=Object.values(S.people).filter(p=>p.active).sort((a,b)=>b.name.length-a.name.length);
  for(const p of ppl){
    const first=p.name.split(/\s+/)[0];
    const names=[p.name,first].filter((x,i,a)=>x&&a.indexOf(x)===i).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const re=new RegExp(`\\b(${names.join('|')})('s)?\\b`,'i');
    if(re.test(s)){ out.people.push(p.id); s=s.replace(re,' '); }
  }
  if(/\b(me|i|my)\b/i.test(s)){ const me=Object.values(S.people).find(p=>p.isMe); if(me&&!out.people.includes(me.id)){ out.people.push(me.id); } s=s.replace(/\b(me|i|my)\b/ig,' '); }
  s=s.replace(/\s(and|&|,|with|\+)\s/gi,' ').replace(/\s(and|&|with)\s/gi,' ');
  // time range
  const tr=cut(/\s(?:from\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?\s*(?:-|–|—|to|until|til)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?(?=[\s,.;!?])/i);
  if(tr){
    let [, h1,m1,a1,h2,m2,a2]=tr; h1=+h1; h2=+h2; m1=+(m1||0); m2=+(m2||0);
    const ap=(h,a,other)=>{ if(a){ a=a[0].toLowerCase(); if(a==='p'&&h<12) h+=12; if(a==='a'&&h===12) h=0; return h; } return null; };
    let H1=ap(h1,a1), H2=ap(h2,a2);
    if(H2===null) H2=h2>=1&&h2<=6||(H1!==null&&h2<=H1%12&&H1>=12)?h2+12:h2===12?12:h2;
    if(H1===null) H1=h1>=1&&h1<=5?h1+12:h1===12?12:h1;
    if(H1>=H2&&H1<12&&H2<12) H2+=12;
    if(H1<24&&H2<=24){ out.start=pad(H1)+':'+pad(m1); out.end=pad(H2%24)+':'+pad(m2); out.tokens.push(['time',`${shortTime(out.start)}–${shortTime(out.end)}`]); }
  }
  if(/\ball[\s-]?day\b/i.test(s)){ out.allDay=true; cut(/\ball[\s-]?day\b/i); out.tokens.push(['time','All day']); }
  // day range: mon-wed / monday to friday
  const dr=cut(new RegExp(`\\s(?:from\\s+)?${WD_RE}\\s*(?:-|–|—|to|through|thru)\\s*${WD_RE}(?=[\\s,.;!?])`,'i'));
  if(dr){ const a=WD_IDX(dr[1]), b=WD_IDX(dr[2]); out.date=nextWeekday(a,true); out.endDate=addDays(out.date,(b-a+7)%7); out.tokens.push(['date',`${fmtDay(out.date)} → ${fmtDay(out.endDate)}`]); }
  // everything else the task parser understands (dates, single times)
  const q=parseQuick(s.trim());
  if(!out.date&&q.due){ out.date=q.due; out.tokens.push(['date',fmtDay(q.due)]); }
  if(!out.start&&q.time&&!(q.due===today()&&!/\b(today|tonight)\b/i.test(text)&&false)){ out.start=q.time; out.end=fromMin(toMin(q.time)+(out.type==='appt'?60:8*60)); out.tokens.push(['time',shortTime(out.start)]); }
  let rest=q.title;
  // job: known job names / list names, or "at Something"
  const known=[...new Set([...allJobs(),...Object.values(S.folders).map(f=>f.name)])].sort((a,b)=>b.length-a.length);
  for(const j of known){ const re=new RegExp(`\\b${j.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i'); if(re.test(rest)){ out.job=allJobs().find(x=>x.toLowerCase()===j.toLowerCase())||j; rest=rest.replace(re,' '); break; } }
  const at=/(?:^|\s)(?:at|@)\s+([A-Z0-9][\w&'.-]*(?:\s+[A-Z0-9][\w&'.-]*)*)/.exec(rest);
  if(!out.job&&at&&out.type!=='off'){ const said=at[1].trim(); const hit=known.find(j=>j.toLowerCase().startsWith(said.toLowerCase()+' ')||j.toLowerCase()===said.toLowerCase()); out.job=hit?(allJobs().find(x=>x.toLowerCase()===hit.toLowerCase())||hit):said; rest=rest.replace(at[0],' '); }
  else if(at&&out.job) rest=rest.replace(/(?:^|\s)(?:at|@)(?=\s|$)/,' ');
  rest=rest.replace(/(?:^|\s)(?:at|@|on|for|is|are|will be|be|working|work)(?=\s|$)/gi,' ').replace(/\s+/g,' ').trim().replace(/^[,.;:\-–\s]+|[,.;:\-–\s]+$/g,'');
  if(out.type==='off'){ rest=rest.replace(/\b(off|out|ooo)\b/gi,' ').replace(/\s+/g,' ').trim(); out.title=rest?rest[0].toUpperCase()+rest.slice(1):'Time off'; if(!out.start) out.allDay=true; }
  else out.title=rest&&rest.toLowerCase()!==out.job.toLowerCase()?rest[0].toUpperCase()+rest.slice(1):'';
  if(!out.date) out.date=today();
  if(out.type!=='off'&&!out.start&&!out.allDay&&out.type!=='appt'){ const p=S.people[out.people[0]]; out.start=p?p.dayStart:'07:00'; out.end=p?p.dayEnd:'15:30'; }
  if(out.type==='appt'&&!out.start) out.allDay=true;
  return out;
}

function schedPeoplePop(anchor){

    return `<div class="lo-head"><h3>Show whose schedule</h3></div><div class="lo-sec"><label class="lo-chk"><input type="checkbox" data-sp="__all" ${sel.size?'':'checked'}><span><b>Everyone</b></span></label>${peopleList().map(p=>`<label class="lo-chk"><input type="checkbox" data-sp="${p.id}" ${sel.has(p.id)?'checked':''}>${av(p,'sm')}<span>${esc(p.name)}${p.isMe?' (me)':''}</span></label>`).join('')||'<div class="view-sub">No people yet.</div>'}</div>${Object.values(S.people).some(p=>p.isMe)?`<div class="lo-actions"><button type="button" class="btn sm" data-sp-me="1">Just me</button></div>`:''}`; };
  openPop(anchor,draw(),el=>{
    el.addEventListener('change',e=>{ const c=e.target.closest('[data-sp]'); if(!c) return; let sel=new Set((UI.schedPeople||[]).filter(id=>S.people[id])); if(c.dataset.sp==='__all') sel=new Set(); else if(c.checked) sel.add(c.dataset.sp); else sel.delete(c.dataset.sp); UI.schedPeople=[...sel]; savePrefs(); scheduleRender(); el.innerHTML=draw(); });
    el.addEventListener('click',e=>{ if(e.target.closest('[data-sp-me]')){ const me=Object.values(S.people).find(p=>p.isMe); UI.schedPeople=me?[me.id]:[]; savePrefs(); scheduleRender(); el.innerHTML=draw(); } });
  },{role:'dialog',cls:'lo',sheet:innerWidth<=600,noFocus:true});
}
function schedOptsPop(anchor){
  const draw=()=>{
    const seg=(k,opts)=>`<div class="seg lo-seg">${opts.map(([v,l])=>`<button type="button" data-so="${k}" data-val="${v}" aria-pressed="${String(UI[k])===String(v)}">${l}</button>`).join('')}</div>`;
    const chk=(k,label)=>`<label class="lo-chk"><input type="checkbox" data-sc="${k}" ${UI[k]?'checked':''}><span>${label}</span></label>`;
    return `<div class="lo-head"><h3>Customize the schedule</h3><p>Saved on this device.</p></div>
      <div class="lo-sec"><div class="pop-label">Days shown</div>${seg('schedDays',[[5,'Work week'],[7,'Full week'],[14,'2 weeks']])}</div>
      <div class="lo-sec"><div class="pop-label">Show</div><div class="lo-grid">${SCHED_TYPES.map(([k,l,c])=>`<label class="lo-chk"><input type="checkbox" data-st="${k}" ${typeOn(k)?'checked':''}><span class="dot round" style="--c:${c}"></span><span>${l}</span></label>`).join('')}</div>${chk('schedTasks','Tasks assigned to people')}${chk('schedHours','Hour totals')}</div>
      <div class="lo-sec"><div class="pop-label">Color blocks by</div>${seg('schedColorBy',[['type','Type'],['person','Person'],['job','Job']])}</div>
      <div class="lo-sec"><div class="pop-label">Hours on the week & day grids</div><div class="lo-row"><label class="ctl">From <select data-sn="schedStartH">${Array.from({length:13},(_,i)=>`<option value="${i}" ${UI.schedStartH===i?'selected':''}>${fmtTime(pad(i)+':00')}</option>`).join('')}</select></label><label class="ctl">to <select data-sn="schedEndH">${Array.from({length:12},(_,i)=>i+13).map(i=>`<option value="${i}" ${UI.schedEndH===i?'selected':''}>${i===24?'midnight':fmtTime(pad(i)+':00')}</option>`).join('')}</select></label></div></div>
      <div class="lo-sec"><div class="pop-label">Week starts on</div>${seg('weekStart',[[0,'Sunday'],[1,'Monday']])}</div>`;
  };
  openPop(anchor,draw(),el=>{
    const redraw=()=>{ const st=el.scrollTop; el.innerHTML=draw(); el.scrollTop=st; };
    el.addEventListener('click',e=>{ const b=e.target.closest('[data-so]'); if(!b) return; const k=b.dataset.so; const v=b.dataset.val; UI[k]=/^\d+$/.test(v)?+v:v; savePrefs(); scheduleRender(); redraw(); });
    el.addEventListener('change',e=>{ const t=e.target;
      if(t.dataset.st){ const s=new Set(UI.schedTypes||[]); if(t.checked) s.add(t.dataset.st); else s.delete(t.dataset.st); UI.schedTypes=[...s]; }
      else if(t.dataset.sc) UI[t.dataset.sc]=t.checked;
      else if(t.dataset.sn) UI[t.dataset.sn]=+t.value;
      savePrefs(); scheduleRender(); });
  },{role:'dialog',cls:'lo',sheet:innerWidth<=600,alignLeft:false,noFocus:true});
}

/* ---------- detail panels ---------- */
function schedWarningsFor(e){
  const to=e.repeat?addDays(e.date,60):(e.endDate||e.date); const w=conflictsIn(e.date,to); const msgs=[];
  for(const [oid,l] of w) if(oid===e.id||oid.startsWith(e.id+'@')) for(const m of l) if(!msgs.includes(m)) msgs.push(m);
  return msgs.slice(0,6);
}
function renderSchedDetail(el,o){
  if(D.kind==='people') return renderPersonDetail(el,o);
  const e=o, ti=typeInfo(e.type);
  const days=(e.endDate?diffDays(e.endDate,e.date):0)+1;

  el.innerHTML=`<div class="detail-inner" data-kind="sched">

      <button class="icon-btn" data-sd="close" aria-label="Close" title="Close (Esc)">${icon('close')}</button></div>
    <div class="detail-body">
      <div class="d-title-row"><span class="se-sw" style="--c:${entryColor(e)}"></span><textarea class="d-title" id="d-title" rows="1" placeholder="${e.type==='off'?'Reason (optional) — e.g. Vacation':e.type==='appt'?'What is it? e.g. Site walk with Bob':'What’s the work? e.g. Install cameras'}" aria-label="Title">${esc(e.title)}</textarea></div>
      <div class="d-fields">
        <div class="d-label">${icon('views')}Type</div><div class="d-val"><div class="seg" role="group" aria-label="Type">${SCHED_TYPES.map(([k,l])=>`<button type="button" data-stype="${k}" aria-pressed="${e.type===k}">${l}</button>`).join('')}</div></div>
        <div class="d-label">${icon('team')}People</div><div class="d-val"><div class="pchips">${peopleList().map(p=>`<button type="button" class="pchip" data-pid="${p.id}" aria-pressed="${e.people.includes(p.id)}" style="--c:${p.color}">${av(p,'sm')}${esc(p.name)}</button>`).join('')}${e.people.filter(id=>S.people[id]&&!S.people[id].active).map(id=>`<button type="button" class="pchip" data-pid="${id}" aria-pressed="true" style="--c:${S.people[id].color}">${av(S.people[id],'sm')}${esc(S.people[id].name)} (inactive)</button>`).join('')}<button type="button" class="pchip add" data-sd="new-person">${icon('plus')}New person</button></div></div>
        <div class="d-label">${icon('cal')}Date</div><div class="d-val"><input type="date" id="s-date" value="${e.date}" aria-label="Date"><span class="view-sub">to</span><input type="date" id="s-enddate" value="${e.endDate}" min="${e.date}" aria-label="End date (for more than one day)">${e.endDate?`<span class="view-sub">${days} days</span>`:''}</div>
        <div class="d-label">${icon('clock')}Time</div><div class="d-val"><label class="lo-chk inline"><input type="checkbox" id="s-allday" ${e.allDay?'checked':''}><span>All day</span></label>${e.allDay?'':`<input type="time" id="s-start" value="${e.start}" aria-label="Start time"><span class="view-sub">–</span><input type="time" id="s-end" value="${e.end}" aria-label="End time">`}${!e.allDay&&e.people.length===1&&S.people[e.people[0]]?`<button type="button" class="btn sm ghost" data-sd="usual">Usual hours</button>`:''}${perDay&&e.type!=='off'?`<span class="view-sub">${hm(perDay)}${days>1?` × ${days} days`:''}</span>`:''}</div>
        ${e.type==='off'?'':`<div class="d-label">${icon('job')}Job</div><div class="d-val"><input id="s-job" class="d-text" list="s-job-list" value="${esc(e.job)}" placeholder="Job or project" aria-label="Job"><datalist id="s-job-list">${allJobs().map(j=>`<option value="${esc(j)}">`).join('')}</datalist></div>
        <div class="d-label">${icon('place')}Location</div><div class="d-val"><input id="s-loc" class="d-text" value="${esc(e.location)}" placeholder="Address or town" aria-label="Location"><a class="map-link" id="s-map" href="${mapUrl(e.location)}" target="_blank" rel="noopener noreferrer" ${e.location?'':'hidden'}>Map</a></div>`}
        <div class="d-label">${icon('repeat')}Repeat</div><div class="d-val"><select id="s-rep" aria-label="Repeat">${SCHED_REPEATS.map(([v,l])=>`<option value="${v}" ${e.repeat===v?'selected':''}>${l}</option>`).join('')}</select>${e.repeat?`<span class="view-sub">until</span><input type="date" id="s-until" value="${e.repeatUntil}" min="${e.date}" aria-label="Repeat until">`:''}</div>

      <section class="d-sec"><div class="d-sec-head">${icon('text')}Notes</div><textarea id="s-notes" class="s-notes" placeholder="Anything the crew should know — gate code, materials, who to ask for." aria-label="Notes">${esc(e.notes)}</textarea></section>
      <div class="d-foot"><span>Added ${fmtStamp(e.createdAt)}</span><span>Updated ${fmtStamp(e.updatedAt)}</span></div>
    </div></div>`;
  bindSchedDetail(e.id);
}
function bindSchedDetail(id){
  const root=$('#detail'); const cur=()=>S.sched[id];
  const up=(p,re=true)=>{ patch('sched',id,p); if(re) refreshDetail(); };
  const title=$('#d-title'); autoGrow(title); requestAnimationFrame(()=>autoGrow(title));
  title.addEventListener('input',()=>{ autoGrow(title); up({title:title.value},false); });
  title.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); title.blur(); } });
  $$('[data-stype]',root).forEach(b=>b.addEventListener('click',()=>{ const t=b.dataset.stype; const p={type:t}; if(t==='off'&&!cur().start) p.allDay=true; up(p); }));
  $$('[data-pid]',root).forEach(b=>b.addEventListener('click',()=>{ const s=new Set(cur().people); if(s.has(b.dataset.pid)) s.delete(b.dataset.pid); else s.add(b.dataset.pid); up({people:[...s]}); }));
  $('#s-date').addEventListener('change',e=>{ const v=e.target.value; if(!isDate(v)) return; const c=cur(); const span=c.endDate?diffDays(c.endDate,c.date):0; up({date:v,endDate:span?addDays(v,span):''}); });
  $('#s-enddate').addEventListener('change',e=>{ const v=e.target.value; up({endDate:isDate(v)&&v>cur().date?v:''}); });
  $('#s-allday').addEventListener('change',e=>{ const c=cur(); const p={allDay:e.target.checked}; if(!p.allDay&&!c.start){ const who=S.people[c.people[0]]; p.start=who?who.dayStart:'07:00'; p.end=who?who.dayEnd:'15:30'; } up(p); });
  const st=$('#s-start'), en=$('#s-end');
  if(st) st.addEventListener('change',()=>{ const c=cur(); const p={start:isTime(st.value)?st.value:''}; if(p.start&&c.start&&c.end){ const dur=toMin(c.end)-toMin(c.start); if(dur>0) p.end=fromMin(toMin(p.start)+dur); } up(p); });
  if(en) en.addEventListener('change',()=>up({end:isTime(en.value)?en.value:''}));
  const job=$('#s-job'); if(job) job.addEventListener('input',()=>up({job:job.value.slice(0,120)},false));
  const loc=$('#s-loc'); if(loc) loc.addEventListener('input',()=>{ up({location:loc.value.slice(0,200)},false); const m=$('#s-map'); m.hidden=!loc.value.trim(); m.href=mapUrl(loc.value); });
  $('#s-rep').addEventListener('change',e=>up({repeat:e.target.value}));
  const un=$('#s-until'); if(un) un.addEventListener('change',()=>up({repeatUntil:isDate(un.value)?un.value:''}));
  $$('.swatches [data-color]',root).forEach(b=>b.addEventListener('click',()=>up({color:b.dataset.color})));
  const cp=$('[data-colorpick]',root); if(cp) cp.addEventListener('change',()=>up({color:cp.value.toUpperCase()}));
  const notes=$('#s-notes'); notes.addEventListener('input',()=>up({notes:notes.value},false));
  $$('[data-sd]',root).forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.sd;
    if(a==='close') closeDetail();
    else if(a==='menu') schedMenu(b,id);
    else if(a==='usual'){ const p=S.people[cur().people[0]]; if(p) up({start:p.dayStart,end:p.dayEnd}); }
    else if(a==='new-person') quickPerson(pid=>{ up({people:[...cur().people,pid]}); });
  }));
}
function schedMenu(anchor,id){
  const e=S.sched[id]; if(!e) return;
  menu(anchor,[
    {label:'Duplicate',icon:'copy',act:()=>{ const c=createSched({...clone(e),id:uid('s')}); openDetail('sched',c.id); toast('Duplicated'); }},
    {label:'Copy to next day',icon:'right',act:()=>{ const span=e.endDate?diffDays(e.endDate,e.date):0; const c=createSched({...clone(e),id:uid('s'),date:addDays(e.date,span+1),endDate:span?addDays(e.endDate,span+1):'',repeat:''}); toast(`Copied to ${fmtDay(c.date)}`,{label:'Open',action:()=>openDetail('sched',c.id)}); }},
    {label:'Make a task from this',icon:'check',act:()=>{ const t=createTask({title:entryLabel(e),due:e.date,time:e.allDay?'':e.start,job:e.job,location:e.location,assignee:e.people[0]||'',desc:e.notes?textToHtml(e.notes):''}); toast('Task created',{label:'Open',action:()=>openDetail('tasks',t.id)}); }},
    {sep:true},
    {label:e.repeat?'Delete all repeats':'Delete',icon:'trash',danger:true,act:()=>{ closeDetail(true); Store.del('sched',id); scheduleRender(); toast('Removed from the schedule',{action:()=>{ Store.put('sched',e); scheduleRender(); }}); }},
  ]);
}
function quickPerson(then){
  openModal({title:'Add a person',body:`<div class="field"><label for="qp-name">Name</label><input id="qp-name" placeholder="e.g. Kyle Brooks" maxlength="120"></div><div class="field"><label for="qp-role">Role (optional)</label><input id="qp-role" placeholder="e.g. Lead tech" maxlength="120"></div>`,
    actions:[{label:'Cancel'},{label:'Add',kind:'primary',act:w=>{ const n=w.querySelector('#qp-name').value.trim(); if(!n) return false; const p=createPerson({name:n,role:w.querySelector('#qp-role').value.trim()}); then&&then(p.id); toast(`Added ${p.name}`); }}]});
}

  const wk=Array.from({length:7},(_,i)=>addDays(weekStartOf(today()),i));
  const next=occurrences(today(),addDays(today(),45)).filter(o=>o.e.people.includes(p.id)).sort((a,b)=>a.date.localeCompare(b.date)||(a.e.start||'').localeCompare(b.e.start||'')).slice(0,8);

  el.innerHTML=`<div class="detail-inner" data-kind="people">
    <div class="detail-head"><span class="crumb">${icon('team')}Team</span><span class="spacer"></span>
      <button class="icon-btn" data-pd="menu" aria-label="More actions" aria-haspopup="menu" title="More">${icon('more')}</button>

        <div class="d-label">${icon('phone')}Phone</div><div class="d-val"><input id="p-phone" class="d-text" type="tel" value="${esc(p.phone)}" placeholder="Phone number" aria-label="Phone">${p.phone?`<a class="map-link" href="tel:${esc(p.phone.replace(/[^\d+]/g,''))}">Call</a><a class="map-link" href="sms:${esc(p.phone.replace(/[^\d+]/g,''))}">Text</a>`:''}</div>
        <div class="d-label">${icon('mail')}Email</div><div class="d-val"><input id="p-email" class="d-text" type="email" value="${esc(p.email)}" placeholder="Email (used for their login later)" aria-label="Email"></div>
        <div class="d-label">${icon('clock')}Usual hours</div><div class="d-val"><input type="time" id="p-start" value="${p.dayStart}" aria-label="Usual start"><span class="view-sub">–</span><input type="time" id="p-end" value="${p.dayEnd}" aria-label="Usual end"><span class="view-sub">Used for new jobs and hour totals</span></div>
        <div class="d-label">${icon('drop')}Color</div><div class="d-val">${swatchesHTML(p.color)}</div>
        <div class="d-label">${icon('user')}App access</div><div class="d-val"><div class="seg" role="group" aria-label="App access">${[['admin','Admin'],['edit','Can edit'],['view','View only']].map(([k,l])=>`<button type="button" data-acc="${k}" aria-pressed="${p.access===k}">${l}</button>`).join('')}</div><span class="view-sub" style="flex-basis:100%">What they’ll be able to do when they get their own login.</span></div>
        <div class="d-label"></div><div class="d-val"><label class="lo-chk inline"><input type="checkbox" id="p-me" ${p.isMe?'checked':''}><span>This is me</span></label><label class="lo-chk inline"><input type="checkbox" id="p-active" ${p.active?'checked':''}><span>Active (shows on the schedule)</span></label></div>
      </div>
      <section class="d-sec"><div class="d-sec-head">${icon('sched')}Coming up <span class="count">${hm(hoursFor(p.id,wk))||'0h'} this week</span></div>${next.map(o=>`<button type="button" class="pc-ent wide" style="--c:${entryColor(o.e)}" data-sd-open="${o.e.id}"><span>${esc(fmtDay(o.date))}</span><b>${esc(entryLabel(o.e))}</b><small>${esc(timeRange(o.e))}</small></button>`).join('')||'<div class="group-empty">Nothing scheduled in the next 6 weeks.</div>'}<button type="button" class="btn sm" data-pd="schedule">${icon('plus')}Schedule ${esc(p.name.split(/\s+/)[0])}</button></section>
      <section class="d-sec"><div class="d-sec-head">${icon('check')}Assigned tasks <span class="count">${tasks.length}</span></div>${taskList(tasks,{empty:'No open tasks assigned.'})}</section>
      <section class="d-sec"><div class="d-sec-head">${icon('text')}Notes</div><textarea id="p-notes" class="s-notes" placeholder="Certifications, truck #, anything useful." aria-label="Notes">${esc(p.notes)}</textarea></section>

  const id=p.id, root=el, cur=()=>S.people[id];
  const up=(x,re=true)=>{ patch('people',id,x); if(re) refreshDetail(); };
  const title=$('#d-title'); autoGrow(title); title.addEventListener('input',()=>{ autoGrow(title); up({name:title.value.slice(0,120)||''},false); });

  $('#p-start').addEventListener('change',e=>{ if(isTime(e.target.value)) up({dayStart:e.target.value}); });

  $$('[data-acc]',root).forEach(b=>b.addEventListener('click',()=>up({access:b.dataset.acc})));

  $$('[data-pd]',root).forEach(b=>b.addEventListener('click',()=>{

    if(a==='close') closeDetail();

    else if(a==='menu') menu(b,[{label:'Show only their schedule',icon:'sched',act:()=>{ UI.schedPeople=[id]; go('schedule'); }},{sep:true},{label:'Delete person…',icon:'trash',danger:true,act:()=>deletePerson(id)}]);
  }));
}
function deletePerson(id){
  const p=S.people[id]; if(!p) return;
  const ents=Object.values(S.sched).filter(e=>e.people.includes(id)); const tks=Object.values(S.tasks).filter(t=>t.assignee===id);
  openModal({title:`Delete ${p.name}?`,body:`<p>${ents.length?`They’re on ${ents.length} schedule entr${ents.length===1?'y':'ies'}; they’ll be taken off ${ents.length===1?'it':'them'}. `:''}${tks.length?`${tks.length} task${tks.length===1?' is':'s are'} assigned to them and will become unassigned. `:''}Tip: to keep their history, untick <b>Active</b> instead.</p>`,
    actions:[{label:'Cancel'},{label:'Delete',kind:'danger',act:()=>{
      const bE=ents.map(clone), bT=tks.map(clone);
      for(const e of ents) patch('sched',e.id,{people:e.people.filter(x=>x!==id)});
      for(const t of tks) patch('tasks',t.id,{assignee:''});
      closeDetail(true); Store.del('people',id); UI.schedPeople=(UI.schedPeople||[]).filter(x=>x!==id); savePrefs(); scheduleRender();
      toast(`Deleted ${p.name}`,{action:()=>{ Store.put('people',p); bE.forEach(e=>Store.put('sched',e)); bT.forEach(t=>Store.put('tasks',t)); scheduleRender(); }});
    }}]});
}

/* ---------- actions + drops ---------- */
function schedAction(act,a,e){
  switch(act){
    case 'sched-view': UI.schedView=a.dataset.val; savePrefs(); scheduleRender(); return true;
    case 'sched-nav': { const dir=+a.dataset.dir; if(!dir){ UI.schedDate=today(); } else { const step=UI.schedView==='day'?1:(+UI.schedDays===14?14:7); UI.schedDate=addDays(schedAnchor(),dir*step); } savePrefs(); scheduleRender(); return true; }
    case 'sched-day': UI.schedDate=a.dataset.date; UI.schedView='day'; savePrefs(); scheduleRender(); return true;
    case 'sched-people': e.stopPropagation(); if(POP&&POP.anchor===a){ closePop(); return true; } schedPeoplePop(a); return true;
    case 'sched-opts': e.stopPropagation(); if(POP&&POP.anchor===a){ closePop(); return true; } schedOptsPop(a); return true;

function schedDrop(el,type){
  const d=DRAG; const e=S.sched[d.id]; if(!e) return;
  if(e.repeat){ toast('This one repeats — change its date or time inside the entry.',{label:'Open',action:()=>openDetail('sched',e.id)}); return; }
  const before=clone(e);
  const from=d.from||''; const to=el.dataset.person!==undefined?el.dataset.person:null;
  const p={};
  const newDate=el.dataset.date; const shift=diffDays(newDate,d.date||e.date);
  if(shift){ p.date=addDays(e.date,shift); if(e.endDate) p.endDate=addDays(e.endDate,shift); }
  if(type==='slot'&&el.dataset.time){ const dur=e.start&&e.end?((toMin(e.end)-toMin(e.start)+1440)%1440||60):60; p.start=el.dataset.time; p.end=fromMin(toMin(el.dataset.time)+dur); p.allDay=false; }
  if(to!==null&&to!==from){ let ppl=e.people.filter(x=>x!==from); if(to&&!ppl.includes(to)) ppl.push(to); p.people=ppl; }
  if(!Object.keys(p).length) return;
  patch('sched',e.id,p); refreshDetail();
  const bits=[]; if(p.date) bits.push(fmtDay(p.date)); if(p.start) bits.push(shortTime(p.start)); if(p.people) bits.push(p.people.map(personName).join(', ')||'unassigned');
  toast(`Moved to ${bits.join(' · ')}`,{action:()=>{ Store.put('sched',{...before,updatedAt:Date.now()}); scheduleRender(); refreshDetail(); }});
}

  if(!UI.item){ LIST_SCROLL=$('#content').scrollTop; ITEM_STACK=[]; }

function leaveItem(){ UI.item=null; ITEM_STACK=[]; document.body.classList.remove('item-open'); }

/* ---------- jobs: helpers ---------- */
const jobKey=n=>String(n||'').trim().toLowerCase();
const jobSlug=n=>'j_'+(jobKey(n).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||Date.now().toString(36));
function jobsOf(type){ return Object.values(S.jobs).filter(j=>!type||j.type===type); }
function jobByName(n){ const k=jobKey(n); if(!k) return null; return Object.values(S.jobs).find(j=>jobKey(j.name)===k)||null; }
function jobTasks(j,{done=false}={}){ const k=jobKey(j.name); return Object.values(S.tasks).filter(t=>jobKey(t.job)===k&&(done?t.done:!t.done)); }
function jobSched(j){ const k=jobKey(j.name); return Object.values(S.sched).filter(e=>jobKey(e.job)===k); }
function jobMaps(j){ return Object.values(S.maps).filter(m=>m.jobId===j.id).sort((a,b)=>b.savedAt-a.savedAt||a.name.localeCompare(b.name)); }
function jobNext(j){ const k=jobKey(j.name); const t0=today(); const occ=occurrences(t0,addDays(t0,90)).filter(o=>jobKey(o.e.job)===k).sort((a,b)=>a.date.localeCompare(b.date)||(a.e.start||'').localeCompare(b.e.start||'')); return occ[0]||null; }
const JOB_ORDER={active:0,scheduled:1,quoted:2,lead:3,hold:4,done:5};
function sortJobs(arr){ return arr.slice().sort((a,b)=>(b.pinned-a.pinned)||(JOB_ORDER[a.status]-JOB_ORDER[b.status])||a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})); }
function allJobs(){ return [...new Set([...Object.values(S.jobs).filter(j=>j.status!=='done').map(j=>j.name),...Object.values(S.tasks).map(t=>t.job).filter(Boolean)])].sort((a,b)=>a.localeCompare(b)); }
function createJob(p={},opts={}){
  const now=Date.now();
  const id=p.id||(p.name&&!S.jobs[jobSlug(p.name)]?jobSlug(p.name):uid('j'));
  const j=NORM.jobs({status:'active',type:'job',order:now,createdAt:now,updatedAt:now,...p,id});
  putNew('jobs',j);
  if(opts.open) openItem('jobs',j.id);
  return j;
}
/* rename a job: tasks and schedule entries that used the old name follow */
function renameJob(id,oldName,newName){
  const k=jobKey(oldName); if(!k||jobKey(newName)===k||!newName.trim()) return 0;
  let n=0;
  for(const t of Object.values(S.tasks)) if(jobKey(t.job)===k){ patch('tasks',t.id,{job:newName.trim()}); n++; }
  for(const e of Object.values(S.sched)) if(jobKey(e.job)===k){ patch('sched',e.id,{job:newName.trim()}); n++; }
  return n;
}

/* Jobs typed on tasks or the schedule before jobs had their own pages become job records (once, same id on every device) */
function seedJobs(){
  const names=new Map();
  for(const t of Object.values(S.tasks)) if(t.job&&t.job.trim()) names.set(jobKey(t.job),{name:t.job.trim(),loc:t.location,contact:t.contact,done:t.done});
  for(const e of Object.values(S.sched)) if(e.job&&e.job.trim()&&!names.has(jobKey(e.job))) names.set(jobKey(e.job),{name:e.job.trim(),loc:e.location});
  let n=0;
  for(const [k,v] of names){
    if(jobByName(v.name)) continue;
    const open=Object.values(S.tasks).some(t=>jobKey(t.job)===k&&!t.done)||Object.values(S.sched).some(e=>jobKey(e.job)===k&&(e.endDate||e.date)>=today());
    createJob({id:jobSlug(v.name),name:v.name,address:v.loc||'',contact:v.contact&&jobKey(v.contact)!==k?v.contact:'',status:open?'active':'done'});
    n++;
  }
  return n;
}
function hubReady(){
  ShareSync.start();
  if(Store.readonly) return;
  const n=seedJobs();
  if(n) toast(`Set up ${n} job page${n===1?'':'s'} from the jobs on your tasks`,{ms:5000});
  Maps.retryPending();
}

/* =========================================================
   Maps & drawings: the Site Markup app in a frame + cloud copies
   ========================================================= */
const Maps={
  frame:null, api:null, loading:null, st:{}, timers:{}, pending:new Set(JSON.parse(lsGet('bs-hub.mapq')||'[]')),
  state(id){ return this.st[id]||(this.pending.has(id)?'pending':'ok'); },
  setState(id,s){ this.st[id]=s; this.savePending(); if(UI.item&&UI.item.kind==='jobs') scheduleRender(); },
  savePending(){ lsSet('bs-hub.mapq',JSON.stringify([...this.pending])); },
  ensure(){
    if(this.api) return Promise.resolve(this.api);
    if(this.loading) return this.loading;
    this.loading=new Promise((res,rej)=>{
      this._ready=res;
      const f=document.createElement('iframe');
      f.id='tool-frame'; f.title='Markup and layout tools'; f.src='markup.html?hub=1';
      f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen; web-share');
      $('#tool-wrap').appendChild(f); this.frame=f;
      setTimeout(()=>{ if(!this.api){ $('#tool-loading').innerHTML='The markup tools didn’t load. Check your connection and reload the page.'; rej(new Error('Markup tools did not load')); } },45000);
    });
    return this.loading;
  },
  _onReady(){
    const w=this.frame&&this.frame.contentWindow;
    this.api=w&&w.MarkupAPI;
    $('#tool-loading').hidden=true;
    try{ this.api.setTheme(UI.theme==='light'?'light':'dark'); }catch(e){}
    if(this._ready) this._ready(this.api);
  },
  async withApi(fn,{show=null}={}){
    try{ const api=show?await hubShowTool(show):await this.ensure(); return await fn(api); }
    catch(e){ console.error(e); toast('Couldn’t do that: '+(e.message||e)); return null; }
  },
  /* ---- uploads ---- */
  queue(id,ms=2500){
    this.pending.add(id); this.savePending();
    clearTimeout(this.timers[id]);
    this.timers[id]=setTimeout(()=>this.upload(id),ms);
    if(UI.item&&UI.item.kind==='jobs') scheduleRender();
  },
  retryPending(){ for(const id of this.pending) this.queue(id,1500); },
  async upload(id){
    if(this.busy&&this.busy[id]){ this.queue(id,3000); return; }
    this.busy=this.busy||{}; this.busy[id]=true;
    try{
      const api=await this.ensure();
      const x=await api.exportProject(id);
      if(!x){ this.pending.delete(id); this.savePending(); return; }
      const rec=S.maps[id];
      const jobId=x.jobId||(rec&&rec.jobId)||'';
      if(!jobId){ this.pending.delete(id); this.savePending(); return; }   // not part of a job: stays on this device
      this.setState(id,'uploading');
      let blob=new Blob([x.text],{type:'application/json'}), name=id+'.bsmap';
      if(typeof CompressionStream==='function'){ blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob(); name+='.gz'; }
      let path=rec&&rec.path||'';
      if(window.BSCloud&&window.BSCloud.user){ path=await window.BSCloud.files.upload(name,blob); }
      else if(!window.BSCloud){ path='local:'+name; }
      else throw Object.assign(new Error('Not signed in'),{code:'unavailable'});
      const now=Date.now();
      const m=NORM.maps({...(rec||{createdAt:now,order:now}),id,jobId,name:x.name,kind:x.kind,plans:x.plans,devices:x.devices,photos:x.photos,thumb:x.thumb,size:blob.size,path,savedAt:x.savedAt,updatedAt:now});
      Store.put('maps',m); scheduleRender();
      this.pending.delete(id); this.setState(id,'ok');
    }catch(e){
      console.warn('map upload failed',e);
      this.setState(id,'error');
      clearTimeout(this.timers[id]); this.timers[id]=setTimeout(()=>this.upload(id),navigator.onLine===false?30000:15000);
    }finally{ this.busy[id]=false; }
  },
  /* ---- opening ---- */
  async open(id){
    const m=S.maps[id];
    const tab=m&&m.kind==='layout'?'layout':'markup';
    return this.withApi(async api=>{
      const local=await api.localInfo(id);
      if(local&&(!m||!m.path||local.savedAt>=m.savedAt-2000)) return api.openLocal(id);
      if(!m||!m.path) throw new Error('This map isn’t in the cloud yet. Open it on the device that made it.');
      $('#tool-loading').hidden=false; $('#tool-loading').innerHTML='<span class="spin"></span>Downloading '+esc(m.name)+'…';
      try{
        const text=await this.fetchText(m);
        return await api.openText(text,{jobId:m.jobId});
      }finally{ $('#tool-loading').hidden=true; }
    },{show:tab});
  },
  async fetchText(m){
    if(!window.BSCloud||!window.BSCloud.user) throw new Error('Sign in to download maps');
    const blob=await window.BSCloud.files.download(m.path);
    if(/\.gz$/.test(m.path)) return await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return await blob.text();
  },
  newFor(jobId,mode){
    const j=S.jobs[jobId]; if(!j) return;
    this.withApi(async api=>{ api.newProject({mode:mode==='layout'?'layout':'upload',jobId,name:`${j.name} – ${mode==='layout'?'Layout':'Site plan'}`,client:j.client,address:j.address,contact:j.contact,phone:j.phone}); },{show:mode==='layout'?'layout':'markup'});
  },
  async attachFile(jobId){
    const f=await new Promise(res=>{ const i=document.createElement('input'); i.type='file'; if(!/iP(hone|ad|od)/.test(navigator.userAgent)) i.accept='.bsmap,application/json'; i.onchange=()=>res(i.files&&i.files[0]); i.addEventListener('cancel',()=>res(null)); i.click(); });
    if(!f) return;
    await this.withApi(async api=>{
      const text=await f.text();
      const r=await api.importText(text,{jobId,fileName:f.name});
      this.queue(r.id,100);
      toast(`Attached ${r.name} — saving it to the cloud`);
    });
  },
  async fromDevice(jobId){
    const api=await this.ensure().catch(()=>null); if(!api) return;
    const list=(await api.listLocal()).filter(x=>x.jobId!==jobId).sort((a,b)=>b.openedAt-a.openedAt);
    if(!list.length){ openModal({title:'Nothing to attach',body:'<p>There are no other markups or layouts in the app on this device yet. Make one with <b>New markup</b> or <b>New layout</b>.</p>'}); return; }
    openModal({title:'Attach from this device',body:`<p>Pick the markups and layouts that belong to <b>${esc(S.jobs[jobId].name)}</b>.</p><div class="pick-maps">${list.map(x=>`<label class="pm-row"><input type="checkbox" value="${esc(x.id)}"><span class="pm-th">${x.thumb?`<img src="${x.thumb}" alt="">`:icon('map')}</span><span class="pm-t"><b>${esc(x.name)}</b><small>${x.plans} plan${x.plans===1?'':'s'} · ${x.devices} device${x.devices===1?'':'s'}${x.jobId&&S.jobs[x.jobId]?` · now in ${esc(S.jobs[x.jobId].name)}`:''}</small></span></label>`).join('')}</div>`,
      actions:[{label:'Cancel'},{label:'Attach',kind:'primary',act:w=>{
        const ids=$$('input:checked',w).map(i=>i.value); if(!ids.length){ toast('Tick at least one'); return false; }
        (async()=>{ for(const id of ids){ await api.link(id,jobId); const r=S.maps[id]; if(r) patch('maps',id,{jobId}); this.queue(id,200); } toast(`Attached ${ids.length} — saving to the cloud`); })();
      }}]});
  },
  async download(id){
    const m=S.maps[id];
    const text=await this.withApi(async api=>{ const local=await api.localInfo(id); if(local){ const x=await api.exportProject(id); return x&&x.text; } return this.fetchText(m); });
    if(!text) return;
    const name=(m?m.name:'map').replace(/[\\/:*?"<>|]+/g,'-')+'.bsmap';
    const blob=new Blob([text],{type:'application/json'});
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&matchMedia('(pointer: coarse)').matches){ try{ if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Downloaded '+name);
  },
  moveTo(id){
    const m=S.maps[id]; if(!m) return;
    const js=sortJobs(Object.values(S.jobs).filter(j=>j.id!==m.jobId));
    openModal({title:'Move to another job',body:`<div class="field"><label for="mv-job">Job or project</label><select id="mv-job">${js.map(j=>`<option value="${j.id}">${esc(j.name)}${j.type==='project'?' (project)':''}</option>`).join('')}</select></div>`,
      actions:[{label:'Cancel'},{label:'Move',kind:'primary',act:w=>{ const to=w.querySelector('#mv-job').value; if(!to) return false; patch('maps',id,{jobId:to}); this.withApi(api=>api.link(id,to)); toast(`Moved to ${S.jobs[to].name}`); }}]});
  },
  remove(id,{quiet=false}={}){
    const m=S.maps[id]; if(!m) return;
    const go_=()=>{ Store.del('maps',id); this.pending.delete(id); this.savePending(); if(window.BSCloud&&window.BSCloud.user&&m.path&&!m.path.startsWith('local:')) window.BSCloud.files.remove(m.path); if(this.api) this.api.link(id,'').catch(()=>{}); scheduleRender(); };
    if(quiet){ go_(); return; }
    openModal({title:`Remove ${esc(m.name)} from this job?`,body:'<p>It comes off the job and out of the cloud. Any device that already has it keeps its copy in the Markup / Layout tab.</p>',actions:[{label:'Cancel'},{label:'Remove',kind:'danger',act:go_}]});
  },
  menu(anchor,id){
    menu(anchor,[
      {label:'Open',icon:'open',act:()=>this.open(id)},
      {label:'Download a copy (.bsmap)',icon:'download',act:()=>this.download(id)},
      {label:'Move to another job',icon:'move',act:()=>this.moveTo(id)},
      {sep:true},
      {label:'Remove from this job…',icon:'trash',danger:true,act:()=>this.remove(id)},
    ]);
  },
};

   Actions
   ========================================================= */
function hubAction(act,a,e){
  const id=a.dataset.id;
  if(fmAction(act,a,e)) return true;
  switch(act){
    case 'side-sec': { const k='side-'+a.dataset.key; const col=a.getAttribute('aria-expanded')==='true'; UI.collapsed[k]=col; savePrefs(); renderNav(); return true; }
    case 'open-job': if(e.target.closest('[data-stop]')&&a.dataset.stop===undefined) return true; e.stopPropagation(); hubLeaveTool(); if(UI.view==='search'){ $('#search').value=''; onSearch(''); } openItem('jobs',id); renderNav(); return true;
    case 'nav-jobs': go('jobs',{jobsType:a.dataset.type==='project'?'project':'job'}); return true;
    case 'nav-team': go('schedule',{schedView:'team'}); return true;
    case 'jobs-status': UI.jobsStatus=a.dataset.val; savePrefs(); scheduleRender(); return true;
    case 'new-job': newJobDialog(a.dataset.type==='project'?'project':'job'); return true;
    case 'job-pin': patch('jobs',id,{pinned:!S.jobs[id].pinned}); return true;
    case 'job-task': { const j=S.jobs[id]; createTask({job:j.name,location:j.address},{open:true}); return true; }
    case 'job-sched': { const j=S.jobs[id]; const s=createSched({type:'job',job:j.name,location:j.address,date:today(),title:'',people:[],allDay:false,start:'07:00',end:'15:30'},{open:true}); return true; }
    case 'home-day': UI.schedDate=a.dataset.date; UI.schedView='day'; go('schedule'); return true;
    case 'home-sday': UI.homeDay=a.dataset.date; savePrefs(); scheduleRender(); return true;
    case 'hub-tab': { const t=a.dataset.tab; if(t==='home'){ go('home'); return true; } closeAllScreens(); hubShowTool(t); return true; }
    case 'map-new': Maps.newFor(id,a.dataset.mode); return true;
    case 'map-open': Maps.open(id); return true;
    case 'map-menu': e.stopPropagation(); if(POP&&POP.anchor===a){ closePop(); return true; } Maps.menu(a,id); return true;
    case 'map-attach': Maps.attachFile(id); return true;
    case 'map-local': Maps.fromDevice(id); return true;
  }
  return false;
}

  async put(prefix,file){

  del(f){ if(f&&f.path&&this.can()) window.BSCloud.files.remove(f.path,'files'); },

function saveBlob(blob,name,type){
  const file=new File([blob],name,{type:type||blob.type||'application/octet-stream'});
  if(navigator.canShare&&navigator.share&&matchMedia('(pointer: coarse)').matches){ try{ if(navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(()=>{}); return; } }catch(e){} }
  const url=URL.createObjectURL(file); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000);
}
function imgThumb(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*s)); c.height=Math.max(1,Math.round(im.height*s)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.78)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('not an image')); };
    im.src=url;
  });
}

const Screens=[];
function openScreen(cls,html,{onClose}={}){
  closePop(); closeModal();
  const el=document.createElement('div'); el.className='fm-screen '+cls; el.innerHTML=html; el.tabIndex=-1;
  document.body.appendChild(el); document.body.classList.add('screen-open');
  const s={el,onClose}; Screens.push(s);
  requestAnimationFrame(()=>el.classList.add('in'));
  return el;
}
function closeScreen(el){
  const i=Screens.findIndex(s=>s.el===el); if(i<0) return;
  const [s]=Screens.splice(i,1);
  try{ s.onClose&&s.onClose(); }catch(e){ console.error(e); }
  s.el.remove();
  if(!Screens.length) document.body.classList.remove('screen-open');
}
const topScreen=()=>Screens[Screens.length-1]||null;
/* keyboard: while a work area is open, the app's single-key shortcuts stay quiet; Esc steps back */
document.addEventListener('keydown',e=>{
  const s=topScreen(); if(!s) return;
  if(e.key==='Escape'){
    if(POP||MODAL) return;               // the app closes those
    const f=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]');
    if(f&&s.el.contains(f)){             // first Esc leaves the field (and closes its suggestions); the next one goes back
      if(f.classList.contains('qs-in')) return;
      e.stopImmediatePropagation(); e.preventDefault(); f.blur(); return;
    }
    e.stopImmediatePropagation(); e.preventDefault();
    const back=s.el.querySelector('[data-esc]'); if(back) back.click();
    return;
  }
  const t=e.target, typing=t.closest&&t.closest('input,textarea,select,[contenteditable="true"]');
  if(!typing&&!e.metaKey&&!e.ctrlKey&&e.key.length===1) e.stopImmediatePropagation();
},true);

  switch(act){

    case 'dash-done': DASH.edit=false; scheduleRender(); toast('Dashboard saved'); return true;

    case 'dash-move': { const j=i+(+a.dataset.dir); if(i>=0&&j>=0&&j<ws.length){ [ws[i],ws[j]]=[ws[j],ws[i]]; saveDash(ws); } return true; }
    case 'dash-remove': if(i>=0){ const [w]=ws.splice(i,1); saveDash(ws); toast(`Removed ${DASH_W[w.id].title}`,{action:()=>{ const n=dashLayout(); n.splice(Math.min(i,n.length),0,w); saveDash(n); }}); } return true;

    case 'dash-note': openItem('notes',a.dataset.id); return true;
