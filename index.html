function gridMetrics(){ const g=$('#dgrid'); const cs=getComputedStyle(g); const gap=parseFloat(cs.columnGap)||16; const cols=cs.gridTemplateColumns.split(' ').length; const colW=(g.clientWidth-gap*(cols-1))/cols; return {g,gap,cols,colW}; }
document.addEventListener('pointerdown',e=>{
  if(!DASH.edit||e.button>0) return;
  const grip=e.target.closest&&e.target.closest('[data-grip]'), rs=e.target.closest&&e.target.closest('[data-rs]');
  if(!grip&&!rs) return;
  e.preventDefault();
  const card=(grip||rs).closest('.dw'); const id=card.dataset.w; const r=card.getBoundingClientRect();
  if(grip){
    const ph=document.createElement('div'); ph.className='dw-ph'; ph.style.cssText=`--span:${getComputedStyle(card).getPropertyValue('--span')};height:${r.height}px`;
    card.after(ph);
    card.classList.add('dragging'); Object.assign(card.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:50});
    DASH.drag={type:'move',id,card,ph,dx:e.clientX-r.left,dy:e.clientY-r.top,pid:e.pointerId};
  }else{
    const m=gridMetrics(); const ws=dashLayout(); const w=ws.find(x=>x.id===id);
    DASH.drag={type:'size',id,card,x0:e.clientX,y0:e.clientY,w0:r.width,h0:r.height,span:w.w,m,min:DASH_W[id].min,h:w.h,pid:e.pointerId};
    card.classList.add('sizing');
  }
  try{ (grip||rs).setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove',e=>{
  const d=DASH.drag; if(!d||e.pointerId!==d.pid) return;
  e.preventDefault();
  if(d.type==='move'){
    d.card.style.left=(e.clientX-d.dx)+'px'; d.card.style.top=(e.clientY-d.dy)+'px';
    d.card.style.pointerEvents='none';
    const over=document.elementFromPoint(e.clientX,e.clientY); const t=over&&over.closest&&over.closest('.dw:not(.dragging)');
    if(t&&t.parentElement&&t.parentElement.id==='dgrid'){ const tr=t.getBoundingClientRect(); const before=(e.clientY<tr.top+tr.height*.35)||(e.clientY<tr.bottom-tr.height*.35&&e.clientX<tr.left+tr.width/2); if(before) t.before(d.ph); else t.after(d.ph); }
    // keep the page scrolling while dragging near the edges
    const c=$('#content'); const cr=c.getBoundingClientRect(); if(e.clientY<cr.top+60) c.scrollTop-=14; else if(e.clientY>cr.bottom-60) c.scrollTop+=14;
  }else{
    const {m}=d; const wpx=d.w0+(e.clientX-d.x0);
    let span=Math.round((wpx+m.gap)/(m.colW+m.gap)); span=Math.max(d.min,Math.min(m.cols,span));
    if(m.cols<12) span=d.span;   // phones: one column, height only
    d.span2=span; d.card.style.setProperty('--span',span);
    const hpx=Math.max(160,Math.round((d.h0+(e.clientY-d.y0))/10)*10);
    if(Math.abs(e.clientY-d.y0)>6||d.h){ d.h2=hpx; d.card.classList.add('fixed'); d.card.style.setProperty('--h',hpx+'px'); }
  }
});
function endDashDrag(e,cancel){
  const d=DASH.drag; if(!d||(e&&e.pointerId!==d.pid)) return;
  DASH.drag=null;
  const ws=dashLayout();
  if(d.type==='move'){
    d.card.classList.remove('dragging'); d.card.removeAttribute('style');
    if(!cancel){ const order=[...$('#dgrid').children].map(el=>el.classList.contains('dw-ph')?d.id:el.classList.contains('dragging')?null:el.dataset.w).filter(Boolean); const by=Object.fromEntries(ws.map(w=>[w.id,w])); const next=order.filter(id=>by[id]).map(id=>by[id]); d.ph.remove(); saveDash(next); }
    else d.ph.remove();
  }else{
    d.card.classList.remove('sizing');
    const w=ws.find(x=>x.id===d.id); if(w&&!cancel){ if(d.span2) w.w=d.span2; if(d.h2) w.h=d.h2; saveDash(ws); }
  }
  DASH.dirty=false; scheduleRender();
}

/* money in = payments actually collected, on the day they came in */
function revenueEvents(){ return Object.values(S.payments||{}).map(p=>({date:p.date,amt:p.amount,jobId:p.jobId})); }
function jobMoney(j){
  const qs=Object.values(S.quotes).filter(q=>q.jobId===j.id&&!q.template);
  const acc=qs.filter(q=>q.status==='accepted');
  const qt=q=>quoteCalc(q).total;
  const contract=acc.length?acc.reduce((a,q)=>a+qt(q),0):j.contract||0;
  const open=qs.filter(q=>['draft','sent','viewed'].includes(q.status)).reduce((a,q)=>a+qt(q),0);
  const invs=Object.values(S.invoices||{}).filter(i=>i.jobId===j.id&&i.status!=='void'&&(i.status!=='draft'||invPayments(i).length));
  const invoiced=invs.reduce((a,i)=>a+quoteCalc(i).total,0);
  const collected=Object.values(S.payments||{}).filter(p=>p.jobId===j.id).reduce((a,p)=>a+p.amount,0);
  const outstanding=invs.reduce((a,i)=>a+Math.max(0,invCalc(i).balance),0);
  const xs=Object.values(S.expenses).filter(x=>x.jobId===j.id);
  const expenses=xs.reduce((a,x)=>a+x.amount,0);
  const est=acc.reduce((a,q)=>a+quoteCalc(q).cost,0);
  return {revenue:collected,collected,contract,invoiced,outstanding,open,expenses,profit:collected-expenses,margin:collected?((collected-expenses)/collected*100):0,expected:contract-expenses,count:xs.length,fromQuotes:acc.length>0,estCost:est,quotes:qs.length};
}
function finMonths(range){
  const now=new Date(); let n=range==='ytd'?now.getMonth()+1:Math.max(1,+range||6);
  const months=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,label:MONTHS[d.getMonth()],year:d.getFullYear(),revenue:0,expenses:0}); }
  const by=Object.fromEntries(months.map(m=>[m.key,m]));
  for(const e of revenueEvents()){ const m=by[e.date.slice(0,7)]; if(m) m.revenue+=e.amt; }
  for(const x of Object.values(S.expenses)){ const m=by[x.date.slice(0,7)]; if(m) m.expenses+=x.amount; }
  for(const m of months){ m.revenue=money(m.revenue); m.expenses=money(m.expenses); m.profit=money(m.revenue-m.expenses); }
  return months;
}
function niceTicks(lo,hi,count=4){
  if(hi<=lo) hi=lo+1;
  const raw=(hi-lo)/count; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||10*mag;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step; const out=[]; for(let v=a;v<=b+step/2;v+=step) out.push(Math.round(v*100)/100); return out;
}
function financeChart(range){
  const ms=finMonths(range);
  const tot=ms.reduce((a,m)=>({r:a.r+m.revenue,e:a.e+m.expenses}),{r:0,e:0}); const prof=tot.r-tot.e;
  const vals=ms.flatMap(m=>[m.revenue,m.expenses,m.profit]);
  const ticks=niceTicks(Math.min(0,...vals),Math.max(vals.some(v=>v)?100:1000,...vals));
  const lo=ticks[0], hi=ticks[ticks.length-1], span=hi-lo||1;
  const pos=v=>(v-lo)/span*100, z=pos(0), n=ms.length;
  const label=ms.length===1?`${MONTHS_LONG[new Date().getMonth()]}`:range==='ytd'?'This year':`Last ${n} months`;
  const empty=!vals.some(v=>v);
  const tip=m=>`<b>${MONTHS_LONG[MONTHS.indexOf(m.label)]} ${m.year}</b><span><i class="sw rev"></i>Collected <b>${fmtMoney(m.revenue,{cents:false})}</b></span><span><i class="sw exp"></i>Expenses <b>${fmtMoney(m.expenses,{cents:false})}</b></span><span><i class="ln"></i>Profit <b>${fmtMoney(m.profit,{cents:false})}</b></span>`;
  const bar=(v,cls)=>v>0?`<span class="b ${cls}" style="bottom:${z}%;height:${v/span*100}%"></span>`:'';
  const pts=ms.map((m,i)=>`${(i+.5)*10},${100-pos(m.profit)}`).join(' ');
  return `<div class="fin">
    <div class="fin-sum"><div><span>Collected</span><b>${fmtMoney(tot.r,{cents:false})}</b></div><div><span>Expenses</span><b>${fmtMoney(tot.e,{cents:false})}</b></div><div><span>Profit</span><b class="${prof<0?'neg':''}">${fmtMoney(prof,{cents:false})}</b>${tot.r?`<small>${pct(prof/tot.r*100)} margin</small>`:''}</div><span class="fin-when">${esc(label)}</span></div>
    <div class="fin-legend" aria-hidden="true"><span><i class="sw rev"></i>Collected</span><span><i class="sw exp"></i>Expenses</span><span><i class="ln"></i>Profit</span></div>
    <div class="fin-plot" role="img" aria-label="${esc(`${label}: collected ${fmtMoney(tot.r,{cents:false})}, expenses ${fmtMoney(tot.e,{cents:false})}, profit ${fmtMoney(prof,{cents:false})}`)}">
      <div class="fin-area" style="--n:${n}">
        ${ticks.map(t=>`<div class="fin-gl ${t===0?'zero':''}" style="bottom:${pos(t)}%"><span>${fmtK(t)}</span></div>`).join('')}
        <div class="fin-cols">${ms.map(m=>`<div class="fin-m" data-tip="${esc(tip(m))}"><div class="fin-bars">${bar(m.revenue,'rev')}${bar(m.expenses,'exp')}</div><span class="fin-x">${esc(m.label)}</span></div>`).join('')}</div>
        ${empty?'':`<svg class="fin-line" viewBox="0 0 ${n*10} 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" vector-effect="non-scaling-stroke"/></svg>${ms.map((m,i)=>`<span class="fin-dot" style="left:${(i+.5)/n*100}%;bottom:${pos(m.profit)}%"></span>`).join('')}`}
      </div>
      <div class="fin-tip" hidden></div>
      ${empty?`<div class="fin-empty">Record a payment or log an expense and it shows up here.</div>`:''}
    </div>
    <table class="sr"><caption>${esc(label)}</caption><tr><th>Month</th><th>Collected</th><th>Expenses</th><th>Profit</th></tr>${ms.map(m=>`<tr><td>${m.label} ${m.year}</td><td>${fmtMoney(m.revenue)}</td><td>${fmtMoney(m.expenses)}</td><td>${fmtMoney(m.profit)}</td></tr>`).join('')}</table>
  </div>`;
}

function expPeriod(p){
  const t=today(), y=t.slice(0,4), m=t.slice(0,7); const d=new Date(); const lm=new Date(d.getFullYear(),d.getMonth()-1,1); const lmk=`${lm.getFullYear()}-${pad(lm.getMonth()+1)}`;
  if(p==='month') return x=>x.date.slice(0,7)===m;
  if(p==='last') return x=>x.date.slice(0,7)===lmk;
  if(p==='year') return x=>x.date.slice(0,4)===y;
  return ()=>true;
}

const margin=(cost,price)=>price?((price-cost)/price*100):0;
function searchItems(q,{limit=12}={}){
  const all=Object.values(S.items);
  const terms=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return all.slice().sort((a,b)=>(b.lastUsed-a.lastUsed)||(b.uses-a.uses)||a.name.localeCompare(b.name)).slice(0,limit);
  const scored=[];
  for(const it of all){
    const f=[[it.name.toLowerCase(),6],[it.sku.toLowerCase(),6],[it.mfr.toLowerCase(),3],[it.category.toLowerCase(),2],[it.desc.toLowerCase(),1],[it.vendor.toLowerCase(),1]];
    let sc=0, ok=true;
    for(const t of terms){ let best=0; for(const [v,w] of f){ if(!v) continue; const i=v.indexOf(t); if(i<0) continue; best=Math.max(best,w*(i===0||/\W/.test(v[i-1])?2:1)); } if(!best){ ok=false; break; } sc+=best; }
    if(ok) scored.push([sc+Math.min(3,it.uses/5),it]);
  }
  return scored.sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name)).slice(0,limit).map(x=>x[1]);
}

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','||c==='\t'){ row.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

    actions:[{label:'Cancel'},{label:'Import',kind:'primary',act:()=>{ const now=Date.now(); let n=0; for(const i of items){ const ex=byKey.get(key(i)); const o=NORM.items(ex?{...ex,...Object.fromEntries(Object.entries(i).filter(([k,v])=>v!==''&&v!==0)),updatedAt:now}:{...i,id:uid('it'),createdAt:now,updatedAt:now}); Store.put('items',o); n++; } scheduleRender(); toast(`Imported ${n} item${n===1?'':'s'}`); }}]});

/* =========================================================
   Quotes: list, new quote, the quote builder (sections, items, labor, files, contracts, totals)
   ========================================================= */
function quoteCalc(q){
  const r={sub:0,disc:0,taxable:0,tax:0,total:0,dep:0,cost:0,profit:0,margin:0,labor:0,opt:0,secs:{},lines:{},count:0};
  for(const s of q.sections){ let st=0, lh=0, est=0;
    for(const l of s.lines){ if(l.type==='text'){ r.lines[l.id]=0; continue; } const amt=money(l.qty*l.price); r.lines[l.id]=amt;
      if(l.optional){ r.opt+=amt; continue; }
      st+=amt; r.count++; r.cost+=l.qty*l.cost; if(l.taxable) r.taxable+=amt; if(l.type==='labor') lh+=l.qty; else est+=l.qty*(l.labor||0); }
    r.labor+=s.lines.some(l=>l.type==='labor'&&!l.optional)?lh:est;   // labor lines are the labor; otherwise the items' estimate
    r.secs[s.id]=money(st); r.sub+=st; }
  r.sub=money(r.sub);
  r.disc=money(q.discType==='amt'?Math.min(q.disc,r.sub):r.sub*Math.min(q.disc,100)/100);
  const taxBase=r.sub?r.taxable*(1-r.disc/r.sub):0;
  r.tax=money(taxBase*q.taxRate/100);
  r.total=money(r.sub-r.disc+r.tax);
  r.dep=money(r.total*q.depositPct/100);
  r.cost=money(r.cost); r.profit=money(r.sub-r.disc-r.cost); r.margin=r.sub-r.disc?r.profit/(r.sub-r.disc)*100:0;
  r.labor=Math.round(r.labor*100)/100;
  return r;
}

function qbFlush(){
  if(!QB||QB.saved) return;
  clearTimeout(QB.timer);
  const cur=S[QB.kind][QB.id]; if(!cur){ return; }
  const c=qbCalc();
  // fields the customer side changes (status, signature, payments…) always come from the stored copy
  const hist=QB.q.history.length>=cur.history.length?QB.q.history:cur.history;
  const keep=isInv(cur)?{status:cur.status,viewedAt:cur.viewedAt,voidedAt:cur.voidedAt,share:cur.share,history:hist}:{status:cur.status,viewedAt:cur.viewedAt,acceptedAt:cur.acceptedAt,acceptedBy:cur.acceptedBy,signature:cur.signature,declinedAt:cur.declinedAt,responseNote:cur.responseNote,share:cur.share,history:hist};
  const o=NORM[QB.kind]({...QB.q,...keep,totals:{sub:c.sub,total:c.total,cost:c.cost},updatedAt:Date.now()});
  Store.put(QB.kind,o); QB.q={...QB.q,...keep}; QB.saved=true; qbSaveState();
  if(o.share&&o.share.hash&&(o.status==='sent'||o.status==='viewed')) qbBanner();
}

function lineFromItem(it,qty=1){ return cleanLine({id:uid('l'),type:it.kind==='labor'?'labor':'item',itemId:it.id,name:it.name,desc:it.desc,sku:it.sku,mfr:it.mfr,unit:it.unit,qty,price:it.price,cost:it.cost,taxable:it.taxable,labor:it.labor}); }
function qbAddItem(sid,it,qty=1,{flash=true}={}){
  const s=findSec(sid); if(!s) return;

  let id;

function duplicateQuote(id,{revision=false}={}){

  if(revision&&!src.template){ const base=src.number.replace(/-R\d+$/,''); const revs=Object.values(S.quotes).filter(x=>x.number.startsWith(base+'-R')).length; number=`${base}-R${revs+1}`; num=src.num; }

function deleteQuote(id){

  if(isInv(q)&&invPayments(q).length){ openModal({title:`${esc(q.number)} has payments`,body:'<p>An invoice with payments recorded can’t be deleted. Void it instead — it stays on file, marked Void, and stops counting as owed.</p>',actions:[{label:'Cancel'},{label:'Void invoice',kind:'danger',act:()=>voidInvoice(id)}]}); return; }
  openModal({title:`Delete ${esc(q.template?q.title:q.number)}?`,body:`<p>${q.share?'The customer’s link stops working. ':''}${q.files.length?`Its ${q.files.length} file${q.files.length===1?'':'s'} are deleted too. `:''}This can’t be undone after you leave this page.</p>`,

function materialsCsv(q){
  const qv=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[['Section','Item','Part #','Manufacturer','Qty','Unit','Unit cost','Total cost','Vendor','Optional']];
  for(const s of q.sections) for(const l of s.lines){ if(l.type!=='item') continue; const it=S.items[l.itemId]; rows.push([s.name,l.name,l.sku,l.mfr,fmtQty(l.qty),l.unit,l.cost.toFixed(2),(l.cost*l.qty).toFixed(2),it?it.vendor:'',l.optional?'yes':'']); }
  saveBlob(new Blob([rows.map(r=>r.map(qv).join(',')).join('\r\n')],{type:'text/csv'}),`${safeName(q.number||'quote')}-materials.csv`,'text/csv');
}

async function qbUpload(list){
  if(!QB) return; const id=QB.id; const up=QB.el.querySelector('.qup');
  for(const file of list){
    const row=document.createElement('div'); row.className='qup-row'; row.innerHTML=`<span class="spin"></span>Uploading ${esc(file.name)}…`; up&&up.appendChild(row);
    try{ const f=await Files.put('quotes/'+id,file); if(QB&&QB.id===id){ f.include=false; QB.q.files.push(f); QB.q.history=qHist(QB.q,`Added file ${f.name}`); qbChanged({rerender:true}); } else { const q=docById(id); if(q) patch(docKind(id),id,{files:[...q.files,f]}); } }

  });

      else if(e.key==='Enter'){ e.preventDefault(); if(!t.value.trim()&&drop.hidden) return; const o=os[i]||os[0]; if(o) qsPick(t,o); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); if(!drop.hidden||t.value){ drop.hidden=true; t.value=''; } else t.blur(); }

/* drag to reorder lines (also between sections) and sections */
function qbStartSort(e,grip){
  const kind=grip.dataset.qdrag; const el=grip.closest(kind==='sec'?'.qsec':'.ql'); if(!el) return;
  const r=el.getBoundingClientRect(); const ph=document.createElement('div'); ph.className='sort-ph'; ph.style.height=r.height+'px'; el.after(ph);
  el.classList.add('sorting'); Object.assign(el.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',zIndex:95,pointerEvents:'none'});
  const dy=e.clientY-r.top, scroller=QB.el.querySelector('.qb-scroll'); let lastY=e.clientY, tick=0;
  const place=y=>{
    const over=document.elementFromPoint(r.left+r.width/2,y);
    if(kind==='sec'){ const t=over&&over.closest('.qsec:not(.sorting)'); if(t){ const tr=t.getBoundingClientRect(); if(y<tr.top+Math.min(60,tr.height/2)) t.before(ph); else if(y>tr.bottom-Math.min(60,tr.height/2)) t.after(ph); } return; }
    const t=over&&over.closest('.ql:not(.sorting)'); if(t){ const tr=t.getBoundingClientRect(); if(y<tr.top+tr.height/2) t.before(ph); else t.after(ph); return; }
    const s=over&&over.closest('.qsec'); if(s){ const box=s.querySelector('.qlines'); const lr=box.getBoundingClientRect(); if(!box.querySelector('.ql:not(.sorting)')||y>lr.bottom-4) box.appendChild(ph); else if(y<lr.top+4) box.prepend(ph); }
  };
  const mv=ev=>{ if(ev.pointerId!==e.pointerId) return; ev.preventDefault(); lastY=ev.clientY; el.style.top=(ev.clientY-dy)+'px'; place(ev.clientY); };
  const auto=()=>{ const sr=scroller.getBoundingClientRect(); if(lastY<sr.top+60) scroller.scrollTop-=12; else if(lastY>sr.bottom-60) scroller.scrollTop+=12; place(lastY); tick=requestAnimationFrame(auto); };
  tick=requestAnimationFrame(auto);
  const up=ev=>{ if(ev.pointerId!==e.pointerId) return; cancelAnimationFrame(tick); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    el.classList.remove('sorting'); el.removeAttribute('style'); ph.replaceWith(el);

/* show a PDF's pages (pdf.js) inside an element */
async function renderPdfInto(box,bytes,{maxW=860}={}){
  const pdfjs=await Libs.pdfjs();
  const pdf=await pdfjs.getDocument({data:bytes.slice?bytes.slice(0):bytes}).promise;
  box.innerHTML='';
  const w=Math.min(maxW,box.clientWidth-24||maxW); const dpr=Math.min(2.5,window.devicePixelRatio||1);
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i); const vp0=pg.getViewport({scale:1}); const scale=w/vp0.width; const vp=pg.getViewport({scale:scale*dpr});
    const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); cv.style.width=Math.round(vp0.width*scale)+'px'; cv.style.height=Math.round(vp0.height*scale)+'px'; cv.className='pv-page'; cv.setAttribute('aria-label',`Page ${i} of ${pdf.numPages}`);
    box.appendChild(cv);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  }
  return pdf.numPages;
}

/* =========================================================
   Sending quotes: email (Gmail / email app), share the PDF, a link the customer
   opens to view, download and accept (with signature) — and their answer coming back
   ========================================================= */
function qbHash(q){
  const v=JSON.stringify([q.title,q.intro,q.notes,q.customer,q.site,q.date,q.validUntil,q.sections,q.contracts.map(c=>[c.title,c.body]),q.files.filter(f=>f.include).map(f=>f.id),q.discType,q.disc,q.taxRate,q.depositPct,q.show]);
  let h=0x811c9dc5; for(let i=0;i<v.length;i++){ h^=v.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16);
}
const shareLink=token=>new URL('quote.html?t='+encodeURIComponent(token),location.href.replace(/[?#].*$/,'')).href;
function newToken(){ const a=new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a,b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join(''); }
function fillTpl(s,q,link){
  const co=company(); const inv=isInv(q); const c=inv?invCalc(q):quoteCalc(q);
  const due=inv&&q.dueDate?(q.dueDate<=q.date?', due on receipt':`, due ${fmtLong(q.dueDate)}`):'';
  return String(s||'').replace(/\{(\w+)\}/g,(m,k)=>({first:firstName(q.customer.name)||'there',name:q.customer.name,title:quoteName(q),number:q.number,total:fmtMoney(c.total),balance:fmtMoney(inv?c.balance:c.total),due,link:link||'',me:meName()||co.name,company:co.name,valid:q.validUntil?fmtLong(q.validUntil):''}[k]??m));
}
/* puts the current version where the customer's link can reach it */
async function publishQuote(id,{resetResponse=false}={}){
  const q=docById(id); if(!q) throw new Error('Quote not found'); const inv=isInv(q);
  if(!window.BSCloud||!window.BSCloud.user) throw new Error(`Sign in to send ${inv?'invoices':'quotes'}`);
  if(navigator.onLine===false) throw new Error(`You’re offline. Connect to send the ${inv?'invoice':'quote'}.`);
  const fresh=resetResponse||!q.share||!q.share.token||(!inv&&(q.status==='accepted'||q.status==='declined'));
  const token=fresh?newToken():q.share.token;
  const bytes=await buildQuotePdf(q);
  const path=await window.BSCloud.files.upload(`${token}.pdf`,new Blob([bytes],{type:'application/pdf'}),'quote-pdfs');
  const info=shareInfo(q);
  await window.BSCloud.shares.put({token,quote_id:id,info,pdf_path:path,status:'sent',viewed_at:null,responded_at:null,signer_name:null,signature:null,response_note:null});
  if(fresh&&q.share&&q.share.token&&q.share.token!==token) withdrawShare(q);
  return {token,path,bytes,link:shareLink(token)};
}
function withdrawShare(q){
  if(!q.share||!q.share.token||!window.BSCloud||!window.BSCloud.user) return;
  window.BSCloud.shares.put({token:q.share.token,quote_id:q.id,status:'withdrawn'}).catch(()=>{});
  if(q.share.pdfPath) window.BSCloud.files.remove(q.share.pdfPath,'quote-pdfs');
}

  if(isInv(q)){ quotePatch(id,{status:q.status==='draft'?'sent':q.status,share:{token:pub.token,pdfPath:pub.path,sentAt:Date.now(),sentTo:who,hash:qbHash(q)},cc,history:qHist(q,`${q.share?'Sent again':'Sent'}${who?' to '+who:''}${how?' ('+how+')':''}`)}); if(QB&&QB.id===id) qbRender(); return; }

/* ---------- the customer's answer comes back ---------- */
const ShareSync={
  busy:false, unwatch:null,
  start(){
    if(!window.BSCloud||!window.BSCloud.user||this.started) return; this.started=true;
    this.pull();
    try{ this.unwatch=window.BSCloud.shares.watch(r=>applyShare(r)); }catch(e){}
    setInterval(()=>this.pull(),120000);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') this.pull(); });
    addEventListener('online',()=>this.pull());
  },
  async pull(){ if(this.busy||!Store.ready) return; this.busy=true; try{ const rows=await window.BSCloud.shares.list(); for(const r of rows) applyShare(r); }catch(e){} finally{ this.busy=false; } },
};
function applyShare(r){
  if(!Store.ready||Store.readonly) return;
  const q=Object.values(S.quotes).find(x=>x.share&&x.share.token===r.token)||Object.values(S.invoices).find(x=>x.share&&x.share.token===r.token); if(!q) return;
  const at=s=>Date.parse(s)||Date.now();
  if(isInv(q)){ if(r.status==='viewed'&&q.status==='sent'){ quotePatch(q.id,{status:'viewed',viewedAt:at(r.viewed_at),history:qHist(q,'The customer opened it')}); if(QB&&QB.id===q.id) qbRenderSide(); } return; }
  if(r.status==='viewed'&&q.status==='sent'){ quotePatch(q.id,{status:'viewed',viewedAt:at(r.viewed_at),history:qHist(q,'The customer opened it')}); if(QB&&QB.id===q.id) qbRenderSide(); }
  else if(r.status==='accepted'&&q.status!=='accepted'){
    quotePatch(q.id,{status:'accepted',acceptedAt:at(r.responded_at),acceptedBy:r.signer_name||q.customer.name,signature:r.signature||'',responseNote:r.response_note||'',viewedAt:q.viewedAt||at(r.viewed_at),history:qHist(q,`Accepted online by ${r.signer_name||'the customer'}`)});
    afterAccepted(S.quotes[q.id]);
    toast(`${q.number} was accepted by ${r.signer_name||'the customer'} · ${fmtMoney(q.totals.total)}`,{label:'Open',action:()=>openQuote(q.id),ms:12000});
    if(QB&&QB.id===q.id){ QB.unlocked=false; qbRender(); }
    // the customer's PDF becomes the signed copy
    setTimeout(async()=>{ try{ const cur=S.quotes[q.id]; const bytes=await buildQuotePdf(cur); await window.BSCloud.files.upload(`${r.token}.pdf`,new Blob([bytes],{type:'application/pdf'}),'quote-pdfs'); }catch(e){ console.warn('signed copy',e); } },400);
  }
  else if(r.status==='declined'&&q.status!=='declined'){
    quotePatch(q.id,{status:'declined',declinedAt:at(r.responded_at),responseNote:r.response_note||'',history:qHist(q,`Declined online${r.response_note?': “'+r.response_note.slice(0,120)+'”':''}`)});

    if(QB&&QB.id===q.id) qbRender();
  }
}

   Invoices & payments: bill from an accepted quote (full, deposit, progress, remaining balance)
   or from scratch, record payments, and count profit from money actually collected

KINDS.push('invoices','payments');
Object.assign(S,{invoices:{},payments:{}});
const PAY_METHODS=[['check','Check'],['ach','Bank transfer / ACH'],['card','Card'],['cash','Cash'],['zelle','Zelle / Venmo'],['other','Other']];
const payMethod=m=>(PAY_METHODS.find(x=>x[0]===m)||PAY_METHODS[PAY_METHODS.length-1])[1];
const TERMS=[[0,'Due on receipt'],[15,'Net 15'],[30,'Net 30'],[45,'Net 45'],[60,'Net 60']];
const termsName=n=>(TERMS.find(t=>t[0]===n)||[n,`Net ${n}`])[1];
NORM.invoices=o=>{ const b=NORM.quotes({...o,template:false,depositPct:0}); return {...b,docType:'invoice',status:['draft','sent','viewed','void'].includes(o.status)?o.status:'draft',quoteId:validId(o.quoteId)?o.quoteId:'',mode:['full','deposit','progress','balance','blank'].includes(o.mode)?o.mode:'blank',dueDate:isDate(o.dueDate)?o.dueDate:'',terms:Math.max(0,Math.round(num(o.terms,30))),voidedAt:num(o.voidedAt),validUntil:'',acceptedAt:0,acceptedBy:'',signature:'',declinedAt:0}; };
NORM.payments=o=>({id:str(o.id),invoiceId:validId(o.invoiceId)?o.invoiceId:'',jobId:validId(o.jobId)?o.jobId:'',date:isDate(o.date)?o.date:today(),amount:money(finNum(o.amount)),method:PAY_METHODS.some(x=>x[0]===o.method)?o.method:'check',reference:str(o.reference).slice(0,120),notes:str(o.notes).slice(0,1000),createdAt:num(o.createdAt,Date.now()),updatedAt:num(o.updatedAt,Date.now())});

/* ---------- money on an invoice ---------- */
const invPayments=inv=>Object.values(S.payments).filter(p=>p.invoiceId===inv.id).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
function invCalc(inv){ const c=quoteCalc(inv); const paid=money(invPayments(inv).reduce((a,p)=>a+p.amount,0)); return {...c,paid,balance:money(c.total-paid)}; }
function invState(inv){
  if(inv.status==='void') return 'void';
  const c=invCalc(inv);
  if(c.total>0&&c.balance<=0.004) return 'paid';
  if(inv.status!=='draft'&&inv.dueDate&&inv.dueDate<today()) return 'overdue';
  if(c.paid>0) return 'partial';
  return inv.status;
}
const INV_STATE={draft:['Draft','#8A8F98'],sent:['Sent','#0B84F3'],viewed:['Viewed','#8E4EC6'],partial:['Partly paid','#E8A317'],paid:['Paid','#30A46C'],overdue:['Overdue','#E5484D'],void:['Void','#6F7C85']};
function invPill(inv){ const s=INV_STATE[invState(inv)]; return `<span class="qst" style="--c:${s[1]}">${esc(s[0])}</span>`; }
function invDueText(inv){ if(!inv.dueDate||invState(inv)==='paid'||inv.status==='void') return ''; const d=diffDays(inv.dueDate,today()); return d<0?`${-d} day${d===-1?'':'s'} late`:d===0?'Due today':`Due in ${d} day${d===1?'':'s'}`; }
function nextInvoiceNum(){ const co=company(); let m=0; for(const x of Object.values(S.invoices)) if(x.num>m) m=x.num; return Math.max(m+1,+co.invStart||1001); }
const invoicedFor=qid=>Object.values(S.invoices).filter(i=>i.quoteId===qid&&i.status!=='void').reduce((a,i)=>a+quoteCalc(i).total,0);
const quotesToBill=jobId=>Object.values(S.quotes).filter(q=>!q.template&&q.status==='accepted'&&(!jobId||q.jobId===jobId)).sort((a,b)=>b.acceptedAt-a.acceptedAt);

/* ---------- creating an invoice ---------- */
function createInvoice({jobId='',quoteId='',mode='blank',pct=0,amount=0,title=''}={}){
  const co=company(); const q=quoteId&&S.quotes[quoteId]; const j=S.jobs[jobId||(q&&q.jobId)]; const now=Date.now(); const n=nextInvoiceNum();
  const qt=q?quoteCalc(q).total:0; const done=q?invoicedFor(q.id):0;
  const line=(name,desc,price)=>cleanLine({id:uid('l'),type:'item',name,desc,qty:1,unit:'ea',price:money(price),cost:0,taxable:false});
  let sections=[blankSection()], disc=0, discType='pct', taxRate=+co.taxRate||0;
  if(q&&mode==='full'){ sections=clone(q.sections).map(s=>({...s,id:uid('sec'),lines:s.lines.filter(l=>!l.optional).map(l=>({...l,id:uid('l')}))})).filter(s=>s.lines.length||s.name); disc=q.disc; discType=q.discType; taxRate=q.taxRate; }
  else if(q&&mode==='deposit'){ sections=[{id:uid('sec'),name:'',desc:'',lines:[line(`Deposit – ${fmtQty(pct)}% of quote ${q.number}`,quoteName(q),qt*pct/100)]}]; }
  else if(q&&mode==='progress'){ const amt=amount||qt*pct/100; sections=[{id:uid('sec'),name:'',desc:'',lines:[line(`Progress billing${pct&&!amount?` – ${fmtQty(pct)}%`:''} of quote ${q.number}`,`${quoteName(q)} · contract ${fmtMoney(qt)}`,amt)]}]; }
  else if(q&&mode==='balance'){ const prev=Object.values(S.invoices).filter(i=>i.quoteId===q.id&&i.status!=='void'); sections=[{id:uid('sec'),name:'',desc:'',lines:[line(`Balance due on quote ${q.number}`,`${quoteName(q)} · contract ${fmtMoney(qt)}${prev.length?` less ${fmtMoney(done)} already invoiced (${prev.map(i=>i.number).join(', ')})`:''}`,qt-done)]}]; }
  if(q&&mode!=='full') taxRate=0;
  const terms=Number.isFinite(+co.invTerms)?+co.invTerms:30;
  const inv=NORM.invoices({id:uid('inv'),num:n,number:(co.invPrefix||'INV-')+n,title:title||(q?quoteName(q):j?j.name:''),jobId:j?j.id:'',quoteId:q?q.id:'',mode:q?mode:'blank',status:'draft',
    customer:q?clone(q.customer):customerFromJob(j),site:q?clone(q.site):{name:j?j.name:'',address:j?j.address:''},date:today(),terms,dueDate:addDays(today(),terms),
    sections,discType,disc,taxRate,show:q?{...q.show,secTotals:mode==='full'&&q.show.secTotals}:{},contracts:[],files:[],notes:'',intro:'',cc:q?[...q.cc]:[],share:null,
    history:[{at:now,what:q?`Created from ${q.number} (${{full:'full amount',deposit:'deposit',progress:'progress billing',balance:'remaining balance'}[mode]})`:'Created'}],createdAt:now,updatedAt:now});
  const c=quoteCalc(inv); inv.totals={sub:c.sub,total:c.total,cost:c.cost};
  putNew('invoices',inv);
  return inv;
}

  const head=`<div class="jc-bar"><div class="seg jc-seg" role="group" aria-label="Calendar view">${JC_VIEWS.map(([v,l])=>`<button type="button" data-act="jc-view" data-val="${v}" aria-pressed="${view===v}">${l}</button>`).join('')}</div>

    <span class="spacer"></span><button class="btn primary" data-act="jv-new" data-job="${j.id}">${icon('plus')}Schedule</button></div>`;
  let body='';

    for(let d=from; d<=to; d=addDays(d,1)){

      g+=`<div class="jc-cell ${toDate(d).getMonth()!==m?'out':''} ${d===t?'today':''}" data-act="jv-add" data-job="${j.id}" data-date="${d}" role="button" tabindex="0" aria-label="Schedule on ${esc(fmtLong(d))}"><span class="jc-num">${toDate(d).getDate()}</span>${its.slice(0,3).map(visitChip).join('')}${its.length>3?`<span class="jc-more">+${its.length-3} more</span>`:''}</div>`;

    let tg=timeGridHTML({cols,items,startH:Math.min(UI.schedStartH,6),endH:Math.max(UI.schedEndH,18),slotAct:'jv-add',slotKind:'visit',addSet:{job:j.id}});

  }
  return `<section class="ip-sec jcal">${head}${body}<p class="view-sub lay-note">Click a day${view==='month'?'':' or a time'} to schedule a visit · click a visit to open its page.</p></section>`;

function visitClockCard(e,k,ppl){
  const day=visitDay(e);
  const extra=[...new Set(k.ss.map(s=>s.pid))].filter(pid=>!e.people.includes(pid)&&S.people[pid]).map(pid=>S.people[pid]);
  const crew=[...ppl,...extra];
  const rows=crew.map(p=>{ const on=k.open.get(p.id); const mine=k.ss.filter(s=>s.pid===p.id); const todayM=mine.filter(s=>msDate(s.in)===today()).reduce((a,s)=>a+k.mins(s),0); const allM=mine.reduce((a,s)=>a+k.mins(s),0);

      <button type="button" class="btn ${on?'':'primary'} vc-btn" data-act="v-clock" data-id="${e.id}" data-pid="${p.id}">${icon(on?'clockOut':'clockIn')}${on?'Clock out':'Clock in'}</button></div>`; }).join('');
  const notIn=crew.filter(p=>!k.open.get(p.id));

  return `<section class="ip-sec vclock"><h2 class="ip-sec-h">${icon('clock')}Time clock${k.total>=1?` <span class="count">${hm(k.total)}</span>`:''}<span class="spacer"></span>${notIn.length>1?`<button type="button" class="btn sm" data-act="v-clock-all" data-id="${e.id}">${icon('clockIn')}Clock everyone in</button>`:''}${k.open.size>1?`<button type="button" class="btn sm" data-act="v-clock-out-all" data-id="${e.id}">${icon('clockOut')}Clock everyone out</button>`:''}</h2>
    <div class="ip-card vc-card">${rows||`<div class="ip-empty">No crew on this visit yet. Tap <b>Edit</b> to pick who’s going${Me.id()?`, or <button type="button" class="linkish" data-act="v-clock" data-id="${e.id}" data-pid="${Me.id()}">clock in as ${esc(Me.name())}</button>`:''}.</div>`}${log}</div>${day!==today()&&!k.open.size?`<p class="view-sub vc-note">${day>today()?`This visit starts ${esc(fmtDay(day))}.`:'This visit is in the past — fix times in the time sheet if needed.'}</p>`:''}</section>`;
}
function clockToggle(e,pid){
  if(!pid){ Me.pick($('.vh-me')||document.body,id=>clockToggle(S.sched[e.id],id)); return; }

  if(on){ vlPut({id:on.id,out:Date.now()}); toast(`${personName(pid)} clocked out · ${hm((Date.now()-on.in)/60000)}`); return; }
  // on the clock somewhere else? close that first
  const other=Object.values(S.visitlog).find(r=>r.kind==='clock'&&r.pid===pid&&!r.out&&r.visitId!==e.id);
  if(other){ vlPut({id:other.id,out:Date.now()}); }
  const j=visitJob(e);
  vlPut({id:uid('vk'),kind:'clock',visitId:e.id,jobId:j?j.id:'',pid,date:today(),in:Date.now(),out:0,by:Me.id(),byName:Me.name()});
  if(!e.people.includes(pid)) patch('sched',e.id,{people:[...e.people,pid]});

}

async function shrinkImage(file,max=2000){
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)||file.size<350000) return file;
  try{
    const url=URL.createObjectURL(file); const im=new Image(); im.src=url; await im.decode(); URL.revokeObjectURL(url);
    const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); if(!b||b.size>=file.size) return file;
    return new File([b],(file.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});
  }catch(err){ return file; }
}
async function uploadPhotos(files,prefix){
  const out=[];
  for(const f0 of files){ try{ const f=await shrinkImage(f0); out.push(await Files.put(prefix,f)); }catch(err){ toast(err.message||'Couldn’t upload '+f0.name); break; } }
  return out;
}

/* =========================================================
   Maps on a visit: the crew sees each plan with its devices greyed in,
   taps one to record install status, issues, notes and photos.
   Everything they record is also written into the original map.
   ========================================================= */
const FIELD_ST={installed:['Installed','#16a34a'],issue:['Issue','#e5484d'],planned:['Not done yet','#8a8f98'],other:['Existing','#94a3b8']};
const devRowId=(mapId,devId)=>'dv_'+mapId+'_'+devId;
function devState(mapId,d){
  const r=S.visitlog[devRowId(mapId,d.id)];
  if(r&&r.status) return r.status;
  return d.status==='installed'?'installed':d.status==='service'?'issue':d.status==='planned'?'planned':'other';
}
const safeGlyph=g=>String(g||'').replace(/<\s*\/?\s*(script|foreignObject|iframe)[^>]*>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
const devIcon=d=>d.image&&/^data:image\//.test(d.image)?`<img src="${esc(d.image)}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${safeGlyph(d.glyph)}</svg>`;

/* ---------- map packs (plan pictures + device positions) ---------- */
const FieldMaps={
  cache:{},
  key(m){ return m.id+':'+(m.savedAt||0); },
  pack(mapId){
    const m=S.maps[mapId]; if(!m) return Promise.reject(new Error('This map was removed from the job'));
    const k=this.key(m); if(this.cache[k]) return this.cache[k];
    const pr=(async()=>{
      const api=await Maps.ensure();
      const local=await api.localInfo(mapId).catch(()=>null);
      let pk=null;
      if(local&&(!m.path||m.path.startsWith('local:')||local.savedAt>=(m.savedAt||0)-2000)) pk=await api.fieldPack({id:mapId});
      if(!pk){ if(!m.path||m.path.startsWith('local:')) throw new Error('This map isn’t in the cloud yet — open it once on the device that made it.'); pk=await api.fieldPack({text:await Maps.fetchText(m)}); }
      if(!pk) throw new Error('Couldn’t read this map');
      return pk;
    })();
    this.cache[k]=pr; pr.catch(()=>{ if(this.cache[k]===pr) delete this.cache[k]; });
    return pr;
  },
};

/* ---------- the viewer (kept alive across page redraws so pictures don't reload) ---------- */
const FieldView={
  el:null, visitId:null, ids:'', packs:{}, errs:{}, i:0, z:{k:1,x:0,y:0}, cur:null,
  attach(){
    const slot=document.getElementById('fv-slot'); if(!slot){ return; }
    const e=S.sched[slot.dataset.visit]; if(!e) return;
    if(!this.el||this.visitId!==e.id) this.build(e);
    slot.replaceWith(this.el);
    this.sync(e);
  },
  build(e){
    this.visitId=e.id; this.ids=''; this.i=0; this.cur=null; this.errs={};
    const el=document.createElement('div'); el.className='fv'; el.id='fv';
    el.innerHTML=`<div class="fv-top"><button type="button" class="icon-btn" data-fv="prev" aria-label="Previous plan">${icon('left')}</button><div class="fv-title"><b></b><small></small></div><button type="button" class="icon-btn" data-fv="next" aria-label="Next plan">${icon('right')}</button></div>
      <div class="fv-legend"></div>
      <div class="fv-vp" tabindex="0" aria-label="Plan with devices. Tap a device to record it."><div class="fv-stage"><img class="fv-img" alt="" draggable="false"><div class="fv-wash"></div><div class="fv-devs"></div></div><div class="fv-msg"></div>
        <div class="fv-zoom"><button type="button" data-fv="in" aria-label="Zoom in">${icon('zoomIn')}</button><button type="button" data-fv="out" aria-label="Zoom out">${icon('zoomOut')}</button><button type="button" data-fv="fit" aria-label="Fit the plan">${icon('fit')}</button><button type="button" data-fv="full" aria-label="Full screen">${icon('expand')}</button></div></div>
      <div class="fv-dots"></div>`;
    this.el=el; this.bind();
  },
  slides(){ const out=[]; for(const id of this.ids.split(',').filter(Boolean)){ const pk=this.packs[id]; if(pk&&pk.plans.length) for(const pl of pk.plans) out.push({mapId:id,pk,plan:pl}); else out.push({mapId:id,pending:true}); } return out; },
  sync(e){
    const ids=e.mapIds.filter(id=>S.maps[id]).join(',');
    if(ids!==this.ids){ this.ids=ids; this.load(); }
    this.draw();
  },
  load(){
    for(const id of this.ids.split(',').filter(Boolean)){
      const m=S.maps[id]; const k=FieldMaps.key(m);
      if(this.packs[id]&&this.packs[id]._k===k) continue;
      FieldMaps.pack(id).then(pk=>{ pk._k=k; this.packs[id]=pk; delete this.errs[id]; this.draw(); }).catch(err=>{ this.errs[id]=err.message||String(err); this.draw(); });
    }
  },
  draw(){
    if(!this.el) return;
    const sl=this.slides(); if(this.i>=sl.length) this.i=Math.max(0,sl.length-1);
    const s=sl[this.i];
    const t=this.el.querySelector('.fv-title');
    const msg=this.el.querySelector('.fv-msg');
    this.el.querySelector('[data-fv=prev]').disabled=this.i<=0;
    this.el.querySelector('[data-fv=next]').disabled=this.i>=sl.length-1;
    this.el.querySelector('.fv-dots').innerHTML=sl.length>1?sl.map((x,i)=>`<button type="button" class="${i===this.i?'on':''}" data-fv="go" data-i="${i}" aria-label="Plan ${i+1}"></button>`).join(''):'';
    if(!s){ t.querySelector('b').textContent='No maps'; t.querySelector('small').textContent=''; return; }
    const m=S.maps[s.mapId];
    if(s.pending){
      t.querySelector('b').textContent=m?m.name:'Map'; t.querySelector('small').textContent='';
      msg.hidden=false; msg.innerHTML=this.errs[s.mapId]?`${icon('warn')}<span>${esc(this.errs[s.mapId])}</span><button type="button" class="btn sm" data-fv="retry">Try again</button>`:`<span class="spin"></span><span>Loading ${esc(m?m.name:'the map')}…</span>`;
      this.el.querySelector('.fv-img').removeAttribute('src'); this.el.querySelector('.fv-devs').innerHTML=''; this.el.querySelector('.fv-legend').innerHTML=''; this.cur=null; return;
    }
    msg.hidden=true;
    t.querySelector('b').textContent=s.plan.name; t.querySelector('small').textContent=`${m?m.name:s.pk.name}${sl.length>1?` · ${this.i+1} of ${sl.length}`:''}`;
    const key=s.mapId+'/'+s.plan.id+'/'+s.pk._k;
    const img=this.el.querySelector('.fv-img');
    if(this.cur!==key){ const first=!this.cur||!this.cur.startsWith(s.mapId+'/'+s.plan.id+'/'); this.cur=key; if(s.plan.src) img.src=s.plan.src; else img.removeAttribute('src'); if(first) requestAnimationFrame(()=>this.fit()); }
    const counts={installed:0,issue:0,planned:0,other:0};
    this.el.querySelector('.fv-devs').innerHTML=s.plan.devices.map(d=>{ const st=devState(s.mapId,d); counts[st]++; const r=S.visitlog[devRowId(s.mapId,d.id)]; const ph=(r&&r.photos.length)||0;
      return `<button type="button" class="fv-dev st-${st}" style="left:${(d.x*100).toFixed(3)}%;top:${(d.y*100).toFixed(3)}%;--dc:${esc(d.color)}" data-dev="${esc(d.id)}" title="${esc(d.label+' · '+d.typeName+' · '+FIELD_ST[st][0])}" aria-label="${esc(d.label+', '+d.typeName+', '+FIELD_ST[st][0])}"><span class="fv-ic">${devIcon(d)}</span><span class="fv-lb">${esc(d.label)}</span>${st==='installed'?`<i class="fv-b ok">${icon('done')}</i>`:st==='issue'?`<i class="fv-b bad">!</i>`:''}${ph?`<i class="fv-ph">${icon('camera')}</i>`:''}</button>`; }).join('');
    const n=s.plan.devices.length;
    this.el.querySelector('.fv-legend').innerHTML=n?`<span class="fl-i st-planned"><i></i>${counts.planned} to do</span><span class="fl-i st-installed"><i></i>${counts.installed} installed</span>${counts.issue?`<span class="fl-i st-issue"><i></i>${counts.issue} issue${counts.issue>1?'s':''}</span>`:''}${counts.other?`<span class="fl-i st-other"><i></i>${counts.other} existing</span>`:''}<span class="fl-bar"><i style="width:${Math.round(counts.installed/Math.max(1,n-counts.other)*100)}%"></i></span>`:`<span class="fl-i">No devices on this plan</span>`;
    this.apply();
  },
  /* ---- zoom & pan ---- */
  base(){ const s=this.slides()[this.i]; const vp=this.el.querySelector('.fv-vp'); const vw=vp.clientWidth, vh=vp.clientHeight; if(!s||!s.plan) return null; const s0=Math.min(vw/s.plan.w,vh/s.plan.h); return {vw,vh,w:s.plan.w*s0,h:s.plan.h*s0}; },
  fit(){ const s=this.slides()[this.i]; const vp=this.el.querySelector('.fv-vp'); if(s&&s.plan&&!this.el.classList.contains('full')){ const want=Math.round(vp.clientWidth*s.plan.h/s.plan.w)+24; const max=Math.round(innerHeight*(innerWidth<700?.62:.66)); vp.style.height=Math.max(260,Math.min(max,want))+'px'; } else vp.style.height='';

/* ---------- writing the crew's records into the original map ---------- */
const FieldSync={
  t:{}, busy:{},
  queue(mapId,ms=2500){ clearTimeout(this.t[mapId]); this.t[mapId]=setTimeout(()=>this.run(mapId),ms); },
  pending(mapId){ return Object.values(S.visitlog).filter(r=>r.kind==='device'&&r.mapId===mapId&&r.at>r.mergedAt); },
  async run(mapId){
    if(this.busy[mapId]){ this.queue(mapId,3000); return; }
    const rows=this.pending(mapId); const m=S.maps[mapId]; if(!rows.length||!m) return;
    if(!Files.can()||navigator.onLine===false){ this.queue(mapId,30000); return; }
    this.busy[mapId]=true;
    try{
      const api=await Maps.ensure();
      const local=await api.localInfo(mapId).catch(()=>null);
      let text='';
      if(m.path&&!m.path.startsWith('local:')&&(!local||local.savedAt<(m.savedAt||0)-2000)){ text=await Maps.fetchText(m); if(local){ await api.importText(text,{jobId:m.jobId}); text=''; } }
      const ups=[]; for(const r of rows) ups.push(await this.update(r));
      const res=await api.applyField(mapId,ups,{text,jobId:m.jobId});
      if(res&&res.missing) throw new Error('map not found');
      for(const r of rows){ const cur=S.visitlog[r.id]; if(cur&&cur.at===r.at) Store.put('visitlog',{...cur,mergedAt:r.at,updatedAt:Date.now()}); }
      if(res&&res.changed) Maps.queue(mapId,300);
      scheduleRender();
    }catch(err){ console.warn('field sync',err); this.queue(mapId,30000); }
    finally{ this.busy[mapId]=false; }
  },
  async update(r){
    const who=r.byName||personName(r.by)||'crew'; const d=fmtDay(msDate(r.createdAt||r.at)).replace(/^(Today|Yesterday)$/,()=>fmtLong(msDate(r.createdAt||r.at)));
    const fields={}; for(const [k,v] of Object.entries(r.fields||{})) if(v!==''&&v!==null&&v!==undefined&&!(k==='tested'&&v===false&&!(r.fields.tested===false))) fields[k]=v;
    const noteLines=[]; if(r.status==='issue'&&r.issue) noteLines.push(`Issue (${d}, ${who}): ${r.issue}`); if(r.notes) noteLines.push(`Field note (${d}, ${who}): ${r.notes}`);
    const photos=[];
    for(const f of r.photos||[]){ if((f.addedAt||0)<=r.mergedAt) continue; try{ const b=await Files.blob(f); const data=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); }); photos.push({id:'vf_'+f.id,data,name:f.name,caption:`${r.label} · ${who} · ${d}`,at:f.addedAt}); }catch(err){ console.warn('field photo',err); } }
    return {planId:r.planId,devId:r.devId,status:{installed:'installed',issue:'service',planned:'planned'}[r.status]||'',fields,noteLines,photos};
  },
  sweep(){ const ids=new Set(Object.values(S.visitlog).filter(r=>r.kind==='device'&&r.at>r.mergedAt&&Date.now()-r.at>60000).map(r=>r.mapId)); for(const id of ids) if(S.maps[id]) this.queue(id,1000+Math.random()*4000); },
};
setTimeout(()=>{ FieldSync.sweep(); setInterval(()=>FieldSync.sweep(),5*60000); },20000);
addEventListener('online',()=>setTimeout(()=>FieldSync.sweep(),3000));

    <section class="ip-sec"><h2 class="ip-sec-h">${icon('receipt')}Expenses <span class="count">${xs.length||''}</span><span class="spacer"></span><button class="btn sm primary" data-act="exp-new" data-job="${j.id}">${icon('plus')}Add expense</button></h2>
    ${byCat.length?`<div class="xw-cats jx-cats">${byCat.map(([c,v])=>`<div class="xw-cat"><span><span class="dot round" style="--c:${c[2]}"></span>${esc(c[1])}</span><span class="xw-bar"><i style="width:${Math.max(2,v/byCat[0][1]*100)}%"></i></span><b>${fmtMoney(v,{cents:false})}</b></div>`).join('')}</div>`:''}
    ${xs.length?`<div class="xrows">${xs.map(x=>expenseRow(x,{showJob:false})).join('')}</div>`:`<div class="ip-card"><div class="ip-empty">No expenses on this ${j.type} yet. Log materials, fuel and permits with <b>Add expense</b> — snap the receipt while you’re at it.</div></div>`}</section>`;
  }
  return hero+tabs+`<div class="jtab-body">${body}</div>`+`<div class="ip-foot"><span>Added ${esc(fmtStamp(j.createdAt))}</span><span>Updated ${esc(fmtStamp(j.updatedAt))}</span></div>`;
}

NORM.contacts=o=>({id:str(o.id),name:(str(o.name).slice(0,160))||'New contact',role:str(o.role).slice(0,120),company:str(o.company).slice(0,200),phone:str(o.phone).slice(0,60),phone2:str(o.phone2).slice(0,60),email:str(o.email).slice(0,200),address:str(o.address).slice(0,300),notes:str(o.notes).slice(0,4000),createdAt:num(o.createdAt,Date.now()),updatedAt:num(o.updatedAt,Date.now())});

const conKey=n=>String(n||'').trim().toLowerCase();
const conSlug=n=>'c_'+(conKey(n).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||Date.now().toString(36));
function contactsList(){ return Object.values(S.contacts).sort((a,b)=>a.name.localeCompare(b.name)); }
function contactByName(n){ const k=conKey(n); if(!k) return null; return Object.values(S.contacts).find(c=>conKey(c.name)===k)||null; }
function createContact(p){ const now=Date.now(); const id=p.id||(p.name&&!S.contacts[conSlug(p.name)]?conSlug(p.name):uid('c')); const c=NORM.contacts({createdAt:now,updatedAt:now,...p,id}); putNew('contacts',c); return c; }
function projectsList(){ return sortJobs(jobsOf('project')); }
function jobsInProject(pid){ return sortJobs(Object.values(S.jobs).filter(j=>j.type==='job'&&j.projectId===pid)); }
const projOf=j=>j&&j.projectId&&S.jobs[j.projectId]||null;
/* the contact a job or project points to (makes one from its typed contact details if needed) */
function contactFor(rec,{make=true}={}){
  if(!rec) return null;
  if(rec.contactId&&S.contacts[rec.contactId]) return S.contacts[rec.contactId];
  if(!rec.contact||!rec.contact.trim()) return null;
  let c=contactByName(rec.contact);
  if(!c&&make) c=createContact({name:rec.contact.trim(),phone:rec.phone||'',email:rec.email||'',company:rec.client&&jobKey(rec.client)!==jobKey(rec.contact)?rec.client:''});
  if(c&&S.jobs[rec.id]&&rec.contactId!==c.id) patch('jobs',rec.id,{contactId:c.id});
  return c;
}
/* contacts already typed on jobs and tasks become contact cards (once, same id on every device) */
function seedContacts(){
  let n=0;
  for(const j of Object.values(S.jobs)){ if(j.contact&&!j.contactId&&!contactByName(j.contact)){ createContact({id:conSlug(j.contact),name:j.contact.trim(),phone:j.phone,email:j.email,company:j.client&&jobKey(j.client)!==jobKey(j.contact)?j.client:''}); n++; } if(j.contact&&!j.contactId){ const c=contactByName(j.contact); if(c) patch('jobs',j.id,{contactId:c.id}); } }
  for(const t of Object.values(S.tasks)){ if(!t.contact||t.contactId||jobKey(t.contact)===jobKey(t.job)) continue; let c=contactByName(t.contact); if(!c){ c=createContact({id:conSlug(t.contact),name:t.contact.trim()}); n++; } patch('tasks',t.id,{contactId:c.id}); }
  return n;
}

   Search-as-you-type box (projects, jobs, contacts)
   ========================================================= */
const CBX_WORD={project:'project',job:'job',contact:'contact'};
function comboHTML(kind,val,{id,ph='',disabled=false}={}){
  return `<div class="cbx" data-cbx="${kind}"><span class="cbx-ic">${icon('search')}</span><input id="${id}" class="d-text cbx-in" value="${esc(val||'')}" placeholder="${esc(ph)}" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" ${disabled?'disabled':''}><button type="button" class="cbx-x" ${val?'':'hidden'} aria-label="Clear" title="Clear">${icon('close')}</button><div class="cbx-drop" role="listbox" hidden></div></div>`;
}
function cbxItems(kind,q,ctx={}){
  const k=conKey(q), has=s=>!k||String(s||'').toLowerCase().includes(k);
  const score=(r,name)=>(conKey(name).startsWith(k)?0:1);
  if(kind==='project'){
    return projectsList().filter(p=>has([p.name,p.client,p.address].join(' '))).sort((a,b)=>score(a,a.name)-score(b,b.name)||(a.status==='done')-(b.status==='done')).slice(0,30)
      .map(p=>({id:p.id,name:p.name,sub:[p.client,p.address].filter(Boolean).join(' · '),badge:p.status==='done'?'Done':'',rec:p}));
  }
  if(kind==='job'){
    const pj=ctx.projectId; let list=Object.values(S.jobs).filter(j=>j.type==='job'&&has([j.name,j.client,j.address,(projOf(j)||{}).name].join(' ')));
    list=sortJobs(list).sort((a,b)=>((b.projectId===pj)-(a.projectId===pj))||score(a,a.name)-score(b,b.name)||(a.status==='done')-(b.status==='done'));
    return list.slice(0,40).map(j=>({id:j.id,name:j.name,sub:[projOf(j)?'In '+projOf(j).name:'',j.client,j.address].filter(Boolean).join(' · '),badge:j.status==='done'?'Done':'',group:pj?(j.projectId===pj?'In this project':'Other jobs'):'',rec:j}));
  }
  return contactsList().filter(c=>has([c.name,c.company,c.role,c.phone,c.email].join(' '))).sort((a,b)=>score(a,a.name)-score(b,b.name)).slice(0,30)
    .map(c=>({id:c.id,name:c.name,sub:[c.role,c.company,c.phone].filter(Boolean).join(' · '),rec:c}));
}
function bindCombo(box,{onPick,onText,onClear,onCreate,ctx=()=>({})}){
  const kind=box.dataset.cbx, inp=box.querySelector('.cbx-in'), drop=box.querySelector('.cbx-drop'), x=box.querySelector('.cbx-x');
  const word=CBX_WORD[kind];
  let opts=[], hi=0, picking=false, startVal=inp.value;
  const close=()=>{ drop.hidden=true; inp.setAttribute('aria-expanded','false'); box.classList.remove('open'); };
  const draw=()=>{
    const q=inp.value.trim(); const items=cbxItems(kind,q,ctx());
    const exact=items.find(i=>conKey(i.name)===conKey(q));
    opts=items.map(i=>({type:'pick',...i}));
    if(q&&!exact) opts.push({type:'new',name:q});
    if(!q) opts.push({type:'new',name:''});
    hi=Math.min(hi,opts.length-1); if(hi<0) hi=0;
    let lastG=null;
    drop.innerHTML=(q&&!items.length?`<div class="cbx-none">${icon('search')}<span>No ${word} called <b>“${esc(q)}”</b></span></div>`:'')+opts.map((o,i)=>{
      if(o.type==='new') return `<button type="button" class="cbx-o cbx-new ${i===hi?'on':''}" data-i="${i}" role="option"><span class="cbx-plus">${icon('plus')}</span><span class="cbx-t"><b>${o.name?`New ${word} “${esc(o.name)}”`:`New ${word}…`}</b><small>Opens beside the editor so you can fill it in</small></span></button>`;
      const g=o.group&&o.group!==lastG?`<div class="cbx-g">${esc(o.group)}</div>`:''; lastG=o.group;
      return g+`<button type="button" class="cbx-o ${i===hi?'on':''}" data-i="${i}" role="option"><span class="cbx-av">${icon(kind==='project'?'project':kind==='job'?'job':'user')}</span><span class="cbx-t"><b>${esc(o.name)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</span>${o.badge?`<span class="cbx-badge">${esc(o.badge)}</span>`:''}</button>`;
    }).join('');
    drop.hidden=false; inp.setAttribute('aria-expanded','true'); box.classList.add('open');
  };
  const choose=o=>{ picking=true; close(); if(o.type==='new'){ const nm=o.name||inp.value.trim(); inp.value=startVal; x.hidden=!startVal; onCreate&&onCreate(nm); } else { inp.value=o.name; startVal=o.name; x.hidden=false; onPick&&onPick(o.rec); } setTimeout(()=>picking=false,50); };
  inp.addEventListener('focus',()=>{ startVal=inp.value; draw(); });
  inp.addEventListener('input',()=>{ hi=0; x.hidden=!inp.value; draw(); });
  inp.addEventListener('keydown',e=>{
    if(drop.hidden&&(e.key==='ArrowDown')){ draw(); e.preventDefault(); return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!opts.length) return; hi=(hi+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length; drop.querySelectorAll('.cbx-o').forEach(b=>b.classList.toggle('on',+b.dataset.i===hi)); const on=drop.querySelector('.cbx-o.on'); on&&on.scrollIntoView({block:'nearest'}); }
    else if(e.key==='Enter'){ e.preventDefault(); if(!drop.hidden&&opts[hi]) choose(opts[hi]); else inp.blur(); }
    else if(e.key==='Escape'){ if(!drop.hidden){ e.preventDefault(); e.stopPropagation(); close(); } }
    else if(e.key==='Tab'){ close(); }
  });
  drop.addEventListener('mousedown',e=>e.preventDefault());
  drop.addEventListener('click',e=>{ const b=e.target.closest('.cbx-o'); if(b) choose(opts[+b.dataset.i]); });
  inp.addEventListener('blur',()=>setTimeout(()=>{ if(picking) return; close(); const v=inp.value.trim(); if(v!==startVal.trim()){ const ex=cbxItems(kind,v,ctx()).find(i=>conKey(i.name)===conKey(v)); if(ex&&onPick){ inp.value=ex.name; onPick(ex.rec); } else onText&&onText(v); startVal=v; } },120));
  x.addEventListener('click',()=>{ inp.value=''; x.hidden=true; startVal=''; onClear?onClear():onText&&onText(''); inp.focus(); });
}

  else{ const top=($('.appbar')||{getBoundingClientRect:()=>({bottom:0})}).getBoundingClientRect().bottom; const full=innerWidth<=600; Object.assign(el.style,{top:(full?0:top)+'px',height:(full?innerHeight:innerHeight-top)+'px',right:'0px',left:'auto',width:(full?innerWidth:W)+'px'}); el.classList.add('solo'); }

function closeSubPanel(){

const STATUS_OPTS=(cur)=>JOB_STATUS.map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('');

  el.addEventListener('click',e=>{ const b=e.target.closest('[data-sp]'); if(!b) return; const a=b.dataset.sp;
    if(a==='close') closeSubPanel(); else if(a==='save') save();
    else if(a==='delete'&&edit){ openModal({title:`Delete ${esc(edit.name)}?`,body:'<p>Removes the contact card. Tasks and jobs that use it keep the name.</p>',actions:[{label:'Cancel'},{label:'Delete',kind:'danger',act:()=>{ const old=S.contacts[edit.id]; Store.del('contacts',edit.id); scheduleRender(); closeSubPanel(); toast(`Deleted ${old.name}`,{action:()=>{ Store.put('contacts',old); scheduleRender(); }}); }}]}); } });
  el.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!MODAL&&!POP){ e.preventDefault(); e.stopPropagation(); closeSubPanel(); } else if(e.key==='Enter'&&e.target.tagName==='INPUT'){ e.preventDefault(); save(); } });
  el.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); save(); });
  setTimeout(()=>{ const n=el.querySelector(isEdit||!prefill.name?'#sp-name':'#sp-name'); n&&n.focus(); if(prefill.name&&!isEdit){ const nx=el.querySelector('.sp-grid input:not(#sp-name),.sp-grid select'); nx&&nx.focus(); } },230);

function bindTaskLinks(root,id){
  const cur=()=>S.tasks[id];
  const filled=[];
  const say=src=>{ if(filled.length) toast(`Filled in ${filled.join(' and ')} from ${src}`,{ms:3500}); filled.length=0; };
  const linkContact=(c)=>{ if(!c) return; patch('tasks',id,{contactId:c.id,contact:c.name}); };
  const autoFrom=rec=>{ const t=cur(); const prevJob=t.job&&jobByName(t.job); const prevProj=t.project&&jobByName(t.project);
    // a job's own address beats its project's; only replace a location that came from the previous pick
    const replaceable=rec.type==='project'?[prevProj&&prevProj.address]:[prevJob&&prevJob.address,prevProj&&prevProj.address];
    if(rec.address&&(!t.location||replaceable.includes(t.location))&&t.location!==rec.address){ patch('tasks',id,{location:rec.address}); filled.push('the location'); }
    if(!t.contactId||(prevJob&&prevJob.contactId===t.contactId)||(prevProj&&prevProj.contactId===t.contactId)){ const c=contactFor(rec)||(rec.type==='job'?contactFor(projOf(rec)):null); if(c&&c.id!==t.contactId){ linkContact(c); filled.push('the contact'); } } };
  const pick={
    project:p=>{ const t=cur(); autoFrom(p); patch('tasks',id,{project:p.name});
      const j=t.job&&jobByName(t.job);
      const msg=filled.length?`Filled in ${filled.join(' and ')} from ${p.name}.`:''; filled.length=0;
      if(j&&j.type==='job'&&!j.projectId){ patch('jobs',j.id,{projectId:p.id}); toast(`${msg} ${j.name} is now part of ${p.name}.`.trim(),{action:()=>patch('jobs',j.id,{projectId:''}),ms:7000}); }
      else if(msg) toast(msg,{ms:3500});
      refreshDetail(); },
    job:j=>{ autoFrom(j.address||!projOf(j)?j:{...j,address:projOf(j).address}); const p=projOf(j); const ch={job:j.name}; if(p&&conKey(cur().project)!==conKey(p.name)){ ch.project=p.name; filled.unshift('the project'); } patch('tasks',id,ch); say(j.name); refreshDetail(); },
    contact:c=>{ linkContact(c); UI.contactOpen=true; refreshDetail(); },
  };
  const proj=()=>{ const p=jobByName(cur().project); return p&&p.type==='project'?p:null; };
  const boxes={project:$('#d-project',root),job:$('#d-job',root),contact:$('#d-contact',root)};
  for(const [k,inp] of Object.entries(boxes)){ if(!inp) continue;
    bindCombo(inp.closest('.cbx'),{
      ctx:()=>({projectId:(proj()||{}).id||''}),
      onPick:pick[k],
      onText:v=>{ if(k==='contact'){ patch('tasks',id,{contact:v,contactId:''}); } else patch('tasks',id,{[k]:v}); refreshDetail(); },
      onClear:()=>{ if(k==='contact') patch('tasks',id,{contact:'',contactId:''}); else patch('tasks',id,{[k]:''}); refreshDetail(); },
      onCreate:name=>{
        const t=cur(); const p=proj(); const j=t.job&&jobByName(t.job);
        if(k==='contact') openSubPanel('contact',{name,company:(j&&j.client)||(p&&p.client)||''},{onDone:c=>{ if(c&&S.tasks[id]){ linkContact(c); UI.contactOpen=true; refreshDetail(); } }});
        else if(k==='project') openSubPanel('project',{name,client:j?j.client:'',address:t.location||'',contact:t.contactId&&S.contacts[t.contactId]?S.contacts[t.contactId].name:''},{onDone:rec=>{ if(rec&&S.tasks[id]) pick.project(rec); }});
        else openSubPanel('job',{name,projectId:p?p.id:'',client:p?p.client:'',address:t.location||(p?p.address:''),contact:t.contactId&&S.contacts[t.contactId]?S.contacts[t.contactId].name:''},{onDone:rec=>{ if(rec&&S.tasks[id]) pick.job(rec); }});
      },
    });
  }
  const loc=$('#d-location',root); loc.addEventListener('input',()=>{ patch('tasks',id,{location:loc.value.slice(0,200)}); const m=$('#d-map',root); m.hidden=!loc.value.trim(); m.href=mapUrl(loc.value); });
  $('#d-cx-head',root).addEventListener('click',()=>{ const box=$('#d-cx',root); const open=!box.classList.contains('open'); box.classList.toggle('open',open); $('#d-cx-body',root).hidden=!open; $('#d-cx-head',root).setAttribute('aria-expanded',open); UI.contactOpen=open; });
  const save=debounce((cid,k,v)=>{ if(S.contacts[cid]) patch('contacts',cid,{[k]:v}); },300);
  $$('[data-cx]',root).forEach(i=>{ i.addEventListener('input',()=>{ const t=cur(); if(t.contactId){ save(t.contactId,i.dataset.cx,i.value); const c=S.contacts[t.contactId]; const sm=$('#d-cx .cx-sum',root); if(c&&sm) sm.textContent=[c.name,$('#d-cx-role',root).value.trim()].filter(Boolean).join(' · '); } }); i.addEventListener('change',()=>{ save.flush(); refreshDetailSoon(); }); });
  $$('[data-cx-act]',root).forEach(b=>b.addEventListener('click',()=>{ const t=cur();
    if(b.dataset.cxAct==='save'){ const ex=contactByName(t.contact); if(ex){ linkContact(ex); refreshDetail(); return; } openSubPanel('contact',{name:t.contact},{onDone:c=>{ if(c&&S.tasks[id]){ linkContact(c); refreshDetail(); } }}); }
    else if(b.dataset.cxAct==='unlink'){ patch('tasks',id,{contactId:'',contact:''}); refreshDetail(); } }));
}

/* =========================================================
   Estimate from map take-offs
   ========================================================= */
const INSTALLABLE=st=>st!=='existing'&&st!=='remove';
function estimateFrom(takeoffs,{crew=Est.crew(),statusOf=null}={}){
  const types=new Map(), cables=new Map(), warn={unscaled:[],untyped:0,unpriced:new Set(),zero:new Set(),skipped:new Set()};
  for(const tk of takeoffs) for(const pl of tk.plans){
    for(const d of pl.devices){
      const st=statusOf?statusOf(tk,d):d.status; if(!INSTALLABLE(st)) continue;
      let x=types.get(d.type); if(!x){ const e=Est.type(d.type,d.system); if(!e.labor&&!e.price&&!e.mat){ warn.skipped.add(d.typeName); continue; } x={id:d.type,name:d.typeName,system:d.system,sysName:d.sysName||Catalog.sysName(d.system)||'Other',qty:0,installed:0,issue:0,...e,devices:[]}; types.set(d.type,x); }
      if(x.skip) continue;
      x.qty++; if(st==='installed') x.installed++; if(st==='issue'||st==='service') x.issue++;
      x.devices.push({mapId:tk.id,planId:pl.id,id:d.id,label:d.label,status:st});
      if(d.cableLength>0){ const ct=EST_CABLES.includes(d.cableType)?d.cableType:'Other'; const c=cables.get(ct)||{type:ct,ft:0,runs:0}; c.ft+=d.cableLength; c.runs++; cables.set(ct,c); }
    }
    for(const r of pl.cables){
      if(r.ft==null){ if(!warn.unscaled.includes(pl.name)) warn.unscaled.push(pl.name); continue; }
      let ct=EST_CABLES.find(c=>c.toLowerCase()===String(r.cableType||'').toLowerCase()); if(!ct){ ct='Other'; warn.untyped++; }
      const c=cables.get(ct)||{type:ct,ft:0,runs:0}; c.ft+=r.ft; c.runs+=r.count||1; cables.set(ct,c);
    }
  }
  const T=[...types.values()].map(x=>{ x.laborTotal=r2(x.qty*x.labor); x.matTotal=r2(x.qty*x.mat); x.priceTotal=r2(x.qty*x.price); if(!x.price) warn.unpriced.add(x.name); if(!x.labor) warn.zero.add(x.name); return x; }).sort((a,b)=>a.sysName.localeCompare(b.sysName)||b.qty-a.qty);
  const slack=Est.slack();
  const C=[...cables.values()].map(c=>{ const v=Est.cable(c.type); const ft=Math.round(c.ft*(1+slack/100)); return {...c,ftNet:Math.round(c.ft),ft,...v,labor:r2(ft/v.ftHr),matTotal:r2(ft*v.mat),priceTotal:r2(ft*v.price)}; }).sort((a,b)=>b.ft-a.ft);
  const devLabor=r2(T.reduce((a,x)=>a+x.laborTotal,0)), cabLabor=r2(C.reduce((a,c)=>a+c.labor,0)), labor=r2(devLabor+cabLabor);
  const mat=r2(T.reduce((a,x)=>a+x.matTotal,0)+C.reduce((a,c)=>a+c.matTotal,0)), matPrice=r2(T.reduce((a,x)=>a+x.priceTotal,0)+C.reduce((a,c)=>a+c.priceTotal,0));
  const laborCost=r2(labor*Est.laborCost()), laborPrice=r2(labor*Est.laborRate());
  const days=labor/(Math.max(1,crew)*Est.dayHrs());
  const bySys=new Map(); for(const x of T){ const s=bySys.get(x.sysName)||{name:x.sysName,labor:0,qty:0}; s.labor+=x.laborTotal; s.qty+=x.qty; bySys.set(x.sysName,s); }
  return {types:T,cables:C,bySys:[...bySys.values()],warn,crew,totals:{devLabor,cabLabor,labor,mat,matPrice,laborCost,laborPrice,cost:r2(mat+laborCost),price:r2(matPrice+laborPrice),days,count:T.reduce((a,x)=>a+x.qty,0),installed:T.reduce((a,x)=>a+x.installed,0)}};
}
const fmtDays=d=>{ d=+d||0; if(d<0.05) return '—'; const r=Math.round(d*2)/2; return `${r.toLocaleString()} day${r===1?'':'s'}`; };

  const rows=E.types.map(x=>{ const t=Catalog.type(x.id)||{color:'#64748b',glyph:''}; return `<div class="et-row ${!x.labor||!x.price?'warnrow':''}"><span class="et-name">${typeGlyph({...t,image:t.image||''},22)}<b>${esc(x.name)}</b><small>${esc(x.sysName)}</small></span><span>${x.qty}</span>${progress?`<span>${x.installed}${x.issue?` <em class="neg">· ${x.issue} issue</em>`:''}</span>`:''}<span>${fmtH(x.hrs)}</span><span>${x.crew}</span><span>${fmtH(x.laborTotal)}</span><span>${fmtMoney(x.matTotal,{cents:false})}</span><span>${x.price?fmtMoney(x.priceTotal,{cents:false}):'<em class="neg">no price</em>'}</span></div>`; }).join('');
  const cab=E.cables.length?`<div class="est-tbl est-sum-cab"><div class="et-row head"><span>Cable</span><span>Feet</span><span>Runs</span><span>Rate</span><span>Labor</span><span>Material</span><span>Sell</span></div>${E.cables.map(c=>`<div class="et-row"><span class="et-name"><b>${esc(c.type)}</b><small>${c.ftNet.toLocaleString()} ft + ${Est.slack()}% slack</small></span><span>${c.ft.toLocaleString()}</span><span>${c.runs}</span><span>${c.ftHr} ft/h</span><span>${fmtH(c.labor)}</span><span>${fmtMoney(c.matTotal,{cents:false})}</span><span>${fmtMoney(c.priceTotal,{cents:false})}</span></div>`).join('')}</div>`:'';

function estWarnings(E){
  const w=[];
  if(E.warn.unscaled.length) w.push(`Cable runs on ${E.warn.unscaled.map(esc).join(', ')} aren’t counted — set the plan scale so they can be measured.`);
  if(E.warn.untyped) w.push(`${E.warn.untyped} cable run${E.warn.untyped>1?'s have':' has'} no cable type, so ${E.warn.untyped>1?'they’re':'it’s'} counted as “Other”. Pick a type on the run in the markup.`);
  if(E.warn.unpriced.size) w.push(`No sell price yet for ${[...E.warn.unpriced].slice(0,6).map(esc).join(', ')}${E.warn.unpriced.size>6?'…':''}. Set it (or link a library item) in Install times &amp; costs.`);
  if(E.warn.zero.size) w.push(`${[...E.warn.zero].slice(0,6).map(esc).join(', ')} ${E.warn.zero.size===1?'has':'have'} a price but no install time.`);
  if(E.warn.skipped.size) w.push(`Left out (no install time or price set): ${[...E.warn.skipped].slice(0,8).map(esc).join(', ')}.`);
  return w.length?`<div class="est-warn">${w.map(x=>`<div>${icon('warn')}<span>${x}</span></div>`).join('')}</div>`:'';
}

async function estimateDialog(mapId){
  if(!Est.canSee()){ toast('Only managers can make quotes from a map'); return; }

  if(!tk){ toast('Couldn’t read the map'); return; }
  const m=S.maps[mapId]; const jobId=(m&&m.jobId)||'';
  let crew=Est.crew();
  const w=bigModal({title:'Estimate & quote',size:'wide',body:`<div class="est-dlg"><div class="est-dlg-top"><div><b>${esc(tk.name)}</b><small>${esc([S.jobs[jobId]?S.jobs[jobId].name:'Not on a job yet',`${tk.plans.length} plan${tk.plans.length===1?'':'s'}`].join(' · '))}</small></div>
      <label class="est-crew">Crew size <input id="ed-crew" type="number" min="1" max="20" value="${crew}"></label></div><div id="ed-body"></div></div>`,
    actions:[{label:'Cancel'},{label:'Edit install times',act:()=>{ closeAllScreens(); hubLeaveTool&&hubLeaveTool(); go('estimating'); }},{label:'Create quote',kind:'primary',act:w=>{ const q=quoteFromEstimate(tk,estimateFrom([tk],{crew}),{jobId,mapId}); hubLeaveTool&&hubLeaveTool(); openQuote(q.id); toast(`Quote ${q.number} made from ${tk.name}`); }}]});

async function jobTakeoffs(j){

  const rows=[['Device','System','Qty','Installed','Issues','Est labor each (h)','Actual each (h)','Est total (h)','Done (h)','Left (h)'],...R.E.types.map(x=>[x.name,x.sysName,x.qty,x.installed,x.issue,x.labor,x.actualEach==null?'':r2(x.actualEach),x.laborTotal,r2(x.earned),r2(x.remaining)]),[],['Cable','Feet','Est labor (h)'],...R.E.cables.map(c=>[c.type,c.ft,c.labor]),[],['Person','Hours','Pay rate','Cost','Installed','Checked off'],...R.people.map(p=>[personName(p.pid)||'Someone',r2(p.hrs),Est.pay(p.pid),r2(p.cost),p.installs,p.checks]),[],['Summary'],['Complete %',Math.round(R.pct*100)],['Worked (h)',r2(R.actualH)],['Estimate (h)',r2(R.L)],['At completion (h)',r2(R.projH)],['Labor cost so far',r2(R.actualCost)],['Projected labor cost',r2(R.projCost)],['Projected finish',R.finish]];
  saveBlob(new Blob([rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}),`progress-${safeName(R.j.name)}-${today()}.csv`,'text/csv');
}

    case 'tm-copy': { const v=window.BSCloud.inviteLink(); try{ await navigator.clipboard.writeText(v); toast('Invite link copied — paste it into a text or email'); }catch(e){ const i=$('#tm-link'); i.select(); document.execCommand('copy'); toast('Invite link copied'); } return true; }
    case 'tm-share': navigator.share({title:'Join us on B&S Office Hub',text:'Make your account for B&S Office Hub:',url:window.BSCloud.inviteLink()}).catch(()=>{}); return true;
    case 'tm-newlink': openModal({title:'Make a new invite link?',body:'<p>The current link stops working. People already on the team keep their access.</p>',actions:[{label:'Cancel'},{label:'New link',kind:'primary',act:async()=>{ try{ await window.BSCloud.team.setOrg({newCode:true}); scheduleRender(); toast('New invite link ready'); }catch(e){ toast(e.message||'Couldn’t do that'); } }}]}); return true;
    case 'tm-approve': { if(!m) return true; const row=a.closest('.tm-row'); const role=row.querySelector('[data-tm-role]').value; const pc=row.querySelector('[data-tm-person]').value; const pid=personFor({...m,role},pc);
      const ok=await Team.set(uid,{role,status:'active',person:pid||''}); if(ok) toast(`${m.name||m.email} approved as ${Role.name(role).toLowerCase()==='admin'?'an admin':'a '+Role.name(role).toLowerCase()}`); return true; }
    case 'tm-decline': if(!m) return true; openModal({title:`Decline ${esc(m.name||m.email)}?`,body:'<p>They won’t get in. You can let them back in later from the Removed list.</p>',actions:[{label:'Cancel'},{label:'Decline',kind:'danger',act:async()=>{ await Team.set(uid,{status:'removed'}); toast('Declined'); }}]}); return true;
    case 'tm-remove': if(!m) return true; openModal({title:`Remove ${esc(m.name||m.email)}?`,body:'<p>They’re signed out of the company right away and can’t see anything. Their crew card, time and work stay.</p>',actions:[{label:'Cancel'},{label:'Remove',kind:'danger',act:async()=>{ await Team.set(uid,{status:'removed'}); toast(`${m.name||m.email} removed`); }}]}); return true;
    case 'tm-restore': await Team.set(uid,{status:'active'}); toast('Back on the team'); return true;
  }
  return false;
}
{ const base=visitsAction; visitsAction=function(act,a,e){ if(/^tm-/.test(act)){ teamAction(act,a); return true; } return base(act,a,e); }; }

  let h=base();

/* =========================================================
   Boot
   ========================================================= */
function boot(){
  // static icons
  $('#add-folder-btn').innerHTML=icon('plus');
  $('#menu-btn').innerHTML=icon('menu');
  $('#search-ico').innerHTML=icon('search');
  $('#search-clear').innerHTML=icon('close');
  $('#new-task-btn').insertAdjacentHTML('afterbegin',icon('plus'));
  $('#new-note-btn').insertAdjacentHTML('afterbegin',icon('note'));
  applyTheme(); renderSideTools();
  loadCache();
  initSmart();
  if(!VIEWS[UI.view]||UI.view==='search') UI.view='home';
  if(UI.view==='folder'&&!S.folders[UI.folderId]) UI.view='home';
  hubBoot();
  renderAll();
  setSync('connecting');
  let db=null;
  if(window.BSCloud){
    Store.cloud=true;
    window.BSCloud.start({
      connect:db=>connectDb(db),
      online:()=>{ if(Store.mode==='db'&&Store.ready){ Store.backoff=0; if(Store.pending.size){ setSync('saving'); Store.schedule(100); } else setSync('synced'); } },
      offline:()=>{ if(Store.mode==='db') setSync('offline'); },
      unsynced:()=>Store.pending.size+Store.inflight.size,
      clearLocal:()=>{ cacheOff=true; try{ localStorage.removeItem(CACHE_KEY); }catch(e){} },
      toast,openModal,closeModal,esc,
    });
    return;
  }
  const hasClaude=window.claude&&typeof window.claude.use==='function';
  if(!hasClaude){ goLocal(); return; }
  window.claude.use('db').then(x=>{ db=x; if(db) connectDb(db); else goLocal(); },()=>goLocal());
}
let lastDay=today();
setInterval(()=>{ const d=today(); if(d!==lastDay){ lastDay=d; scheduleRender(); } else updateCountdowns(); },30000);
addEventListener('pagehide',()=>{ saveRte.flush(); saveCache.flush(); Store.flush(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ saveRte.flush(); saveCache.flush(); Store.flush(); } });
window.__punch={S,UI,Store,parseQuick,sanitize,runSearch,parseSched,occurrences,conflictsIn,cfgFor,applyRules,hoursFor};
boot();
if('launchQueue' in window){ window.launchQueue.setConsumer(async p=>{ const h=p.files&&p.files[0]; if(!h) return; try{ const f=await h.getFile(); const text=await f.text(); Maps.withApi(api=>api.openText(text,{}),{show:'markup'}); }catch(e){ toast('Couldn’t open that file'); } }); }
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(e=>console.warn('offline support unavailable',e&&e.message));
window.__hub={S,UI,Store,Maps,HUB,go,openItem,createJob,seedJobs,jobByName,renderAll:()=>scheduleRender(),fmPdf:n=>buildQuotePdf([...Object.values(S.quotes),...Object.values(S.invoices)].find(x=>x.number===n)),quoteCalc};
})();
