/* =========================================================
   Item page (view an item; Edit opens the side panel)
   ========================================================= */
.ip{max-width:880px;padding-bottom:130px}
.ip-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:16px 0 12px;background:var(--surface)}
.ip-top .spacer{flex:1}
.ip-back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 9px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:13px;min-width:0;max-width:65%}
.ip-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ip-back:hover{color:var(--ink);border-color:var(--accent-line);background:var(--accent-soft)}
.ip-hero{--c:var(--accent);position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:18px;padding:22px 24px 20px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--surface-2)) 0%,var(--surface-2) 62%)}
.ip-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.ip-hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 14%,transparent),transparent);pointer-events:none}
.d-title:focus-visible{outline:none}
.d-val .view-sub{font-family:var(--f-body)}
.ip-kicker{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 11.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ip-kicker .dot{width:9px;height:9px}
.ip-title-row{position:relative;display:flex;align-items:flex-start;gap:14px;margin-top:12px}
.ip-title{flex:1;min-width:0;margin:0;font:700 clamp(24px,3.4vw,32px)/1.18 var(--f-display);letter-spacing:-.015em;overflow-wrap:anywhere;color:var(--ink)}
.ip-title.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.ip-title.untitled{color:var(--faint)}
.ip-sub{position:relative;margin-top:6px;color:var(--ink-2);font-size:15px}
.ip-hero .check{width:30px;height:30px;margin-top:4px}
.ip-hero .check svg{width:15px;height:15px}
.ip-hero .av.lg{width:58px;height:58px;font-size:20px}
.ip-hero .se-sw{width:6px;margin:4px 0;align-self:stretch;border-radius:4px}
.ip-badges{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ip-badges .chip{height:27px;padding:0 11px;font-size:12.5px}
.chip.st-todo{color:var(--ink-2)}
.chip.st-done{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.star-on{color:var(--signal)}
.chip.star-on svg{fill:var(--signal)}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:14px}
.ip-f{display:flex;align-items:flex-start;gap:12px;min-width:0;padding:13px 14px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface-2)}
.ip-f.wide{grid-column:1/-1}
.ip-f-ic{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.ip-f-ic svg.i{width:18px;height:18px}
.ip-f-txt{flex:1;min-width:0}
.ip-f-l{font:600 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ip-f-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-size:15px;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.ip-f-v .chip,.ip-f-v .tag{font-weight:500}
.ip-f-s{margin-top:3px;font-size:12.5px;color:var(--muted)}
.ip-link{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;text-align:left;border-radius:6px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.ip-link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.ip-a{color:var(--accent);font-weight:600;text-decoration:none}
.ip-a:hover{text-decoration:underline}
.ip-a+.ip-a{margin-left:12px}
.ip-sec{margin-top:24px}
.ip-sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ip-sec-h .count{font-family:var(--f-mono);letter-spacing:0}
.ip-sec-h .sub-progress{max-width:160px}
.ip-card{border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);padding:16px 18px}
.ip-card.flush{padding:4px 10px}
.ip-step{display:flex;align-items:center;gap:11px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;color:var(--ink)}
.ip-step:last-child{border-bottom:0}
.ip-step .check{width:20px;height:20px;margin:0}
.ip-step .check svg{width:11px;height:11px}
.ip-step.done span{color:var(--muted);text-decoration:line-through}
.ip-step:hover span{color:var(--accent)}
.ip-body{font-size:15px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere}
.ip-body.big{font-size:16px;line-height:1.7;min-height:120px}
.ip-body ul.checklist>li::before{cursor:pointer}
.ip-plain{white-space:pre-wrap;font-size:15px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.ip-empty{color:var(--faint);font-style:italic}
.ip-unset{margin:14px 2px 0;font-size:12.5px;color:var(--muted)}
.ip-unset b{color:var(--ink-2)}
.ip-foot{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font:12px var(--f-mono);color:var(--muted)}
.ip-people{display:flex;flex-wrap:wrap;gap:8px}
.ip-person{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink)}
.ip-person:hover{border-color:var(--accent);color:var(--accent)}
.ip-person .av{width:26px;height:26px;font-size:10px}
.ip .s-warns{margin:14px 0 0}
.ip .task-list .task{background:transparent}
.ip .pc-ent.wide{width:100%}
.ip-fab{position:fixed;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:9px;height:52px;padding:0 24px 0 19px;border-radius:99px;border:1px solid transparent;background:linear-gradient(180deg,#5C9BFF,#3B7BFF);color:#fff;font:700 15px/1 var(--f-body);letter-spacing:.01em;box-shadow:0 10px 28px rgba(30,80,200,.38),0 2px 6px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s,right .18s ease}
.ip-fab svg.i{width:19px;height:19px;stroke-width:2.2}
.ip-fab:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(30,80,200,.48),0 2px 6px rgba(0,0,0,.3)}
.ip-fab.on{background:var(--raised,var(--surface));color:var(--ink);border-color:var(--line-2);box-shadow:var(--shadow-2)}
@media (min-width:1181px){body.detail-open .ip-fab{right:calc(var(--detail-w) + 26px)}}
@media (max-width:600px){
  .ip-top{padding-top:10px}
  .ip-hero{padding:18px 16px 16px;border-radius:15px}
  .ip-grid{grid-template-columns:1fr;gap:0;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface-2)}
  .ip-f{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:11px 14px;background:transparent}
  .ip-f:last-child{border-bottom:0}
  .ip-f-ic{width:30px;height:30px;border-radius:8px}
  .ip-f-ic svg.i{width:16px;height:16px}
  .ip-f-v{font-size:14.5px;margin-top:3px}
  .ip-fab{height:50px;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  body.item-open .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ip-back{max-width:62%}
}


/* ===================== B&S Office Hub ===================== */
/* sidebar sections */
.side-sec{margin:6px 0 2px}
.side-sec-h{display:flex;align-items:center;gap:2px;padding:2px 4px 2px 0}
.side-sec-t{flex:1;display:flex;align-items:center;gap:4px;padding:6px 6px;border-radius:var(--r-sm);font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left}
.side-sec-t:hover{color:var(--ink);background:var(--hover)}
.side-sec-t .caret{width:16px;height:16px;display:grid;place-items:center}
.side-sec-t .caret svg{width:11px;height:11px;transition:transform .15s}
.side-sec-t[aria-expanded="true"] .caret svg{transform:rotate(90deg)}
.side-sec-b{display:flex;flex-direction:column;gap:1px;padding-left:4px}
.nav-item.job-item{padding:6px 10px 6px 12px}
.nav-item.job-item .dot{width:9px;height:9px}
.nav-item .jn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .jpin svg{width:12px;height:12px;color:var(--muted)}
.nav-item.sub{color:var(--muted);font-size:13px}
.nav-item.sub svg.i{width:14px;height:14px}

/* top tabs */
.hub-tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);flex:none}
.hub-tab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--ink-2)}
.hub-tab:hover{color:var(--ink);background:var(--hover)}
.hub-tab.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-1)}
.hub-tab svg.i{width:17px;height:17px}
.hub-bottom{display:none}

/* tool frame (Markup / Layout) */
.tool-wrap{flex:1;min-height:0;position:relative;background:var(--bg);display:flex}
.tool-wrap[hidden]{display:none!important}
.tool-wrap iframe{flex:1;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.tool-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-weight:600;z-index:2;background:var(--bg)}
.tool-loading[hidden]{display:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:hubspin .8s linear infinite;display:inline-block;flex:none}
@keyframes hubspin{to{transform:rotate(360deg)}}
body.tool-mode .app{display:none}
body.tool-mode .appbar .search,body.tool-mode .appbar .top-actions{visibility:hidden}

/* home */
.home .view-head{padding-bottom:6px}
.home-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.home-stats>div{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.home-stats b{display:block;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.home-stats span{font-size:12.5px;color:var(--muted)}
.home-stats .bad b{color:var(--danger)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;margin-top:14px;align-items:start}
.home-main,.home-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.hcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px 16px;box-shadow:var(--shadow-1);min-width:0}
.hc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hc-h h2{margin:0;flex:1;display:flex;align-items:center;gap:8px;font:700 17px/1.2 var(--f-display);min-width:150px}
.hc-h h2 svg.i{width:19px;height:19px;color:var(--accent)}
.hc-h .btn svg.i{width:14px;height:14px}
.hc-count{font:500 12px var(--f-mono);color:var(--muted)}
.hc-sub{margin:16px 0 8px;font:700 12px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hc-label{display:flex;align-items:center;gap:7px;margin:10px 0 2px;font-weight:700;font-size:12.5px}
.hc-label.bad{color:var(--danger)}
.hc-label .btn{margin-left:auto}
.seg .seg-b{padding:0 10px;height:28px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg .seg-b:last-child{border-right:0}
.seg .seg-b[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.hs-list{display:flex;flex-direction:column;gap:6px}
.hs-row{display:grid;grid-template-columns:64px 4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:11px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));cursor:pointer}
.hs-row:hover{background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.hs-time{display:flex;flex-direction:column;font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}
.hs-time b{font-size:14px;color:var(--ink);font-weight:600}
.hs-bar{width:4px;align-self:stretch;border-radius:3px;background:var(--c)}
.hs-title{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hs-type{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 7px;border-radius:99px}
.hs-sub{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.hs-sub span,.hs-job{display:inline-flex;align-items:center;gap:5px}
.hs-sub svg.i{width:13px;height:13px}
.hs-job{color:var(--accent);font-weight:600}
.hs-job:hover{text-decoration:underline}
.hs-ppl{display:flex;align-items:center;gap:0}
.hs-ppl .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.hs-ppl .av:first-child{margin-left:0}
.hs-more,.hs-none{font-size:12px;color:var(--muted);margin-left:6px}
.hs-empty{display:flex;align-items:center;gap:14px;padding:18px;border:1.5px dashed var(--line-2);border-radius:12px;color:var(--muted)}
.hs-empty svg.i{width:26px;height:26px;color:var(--faint)}
.hs-empty b{display:block;color:var(--ink)}
.hc-sched .quickadd{margin-top:12px}
.hw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hw-day{display:flex;flex-direction:column;gap:5px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:112px;min-width:0}
.hw-day:hover{border-color:var(--accent-line)}
.hw-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hw-h{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.hw-h b{font:700 16px var(--f-display);color:var(--ink);letter-spacing:0}
.hw-items{display:flex;flex-direction:column;gap:3px;min-width:0}
.hw-it{font-size:11.5px;line-height:1.25;padding:2px 5px;border-radius:4px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-more,.hw-free{font-size:11px;color:var(--faint)}
.hw-due{margin-top:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.hw-due svg.i{width:12px;height:12px}
.hc-tasks .task{padding-left:6px}
.hc-tasks .quickadd{margin-top:0}
.tool-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left}
.tool-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool-btn svg.i{width:26px;height:26px;color:var(--accent);margin-bottom:4px}
.tool-btn b{font:700 15px var(--f-display)}
.tool-btn span{font-size:12.5px;color:var(--muted)}

/* job cards */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.jgrid.compact{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0 0 10px}
.jcard{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;position:relative;transition:box-shadow .15s,transform .15s;min-width:0}
.jcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.jcard:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.jc-thumb{aspect-ratio:16/8;background:var(--sunken);display:grid;place-items:center;position:relative;overflow:hidden}
.jc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.jc-thumb>span svg.i{width:34px;height:34px;color:var(--faint)}
.jc-maps{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;font:600 11.5px var(--f-mono);color:#fff;background:rgba(5,10,20,.72);padding:3px 7px;border-radius:99px}
.jc-maps svg.i{width:12px;height:12px}
.jc-body{padding:11px 13px 12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.jcard.compact .jc-body{padding:10px 12px 10px 15px}
.jc-top{display:flex;align-items:center;gap:6px}
.jc-st{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.jc-kind{font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:0 6px}
.jc-pin svg{width:12px;height:12px;color:var(--muted)}
.jc-name{font:700 15.5px/1.25 var(--f-display);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jc-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-meta{display:flex;gap:12px;font-size:12px;color:var(--ink-2);margin-top:2px}
.jc-meta span{display:inline-flex;align-items:center;gap:4px}
.jc-meta svg.i{width:13px;height:13px;color:var(--muted)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fchip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.fchip span{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fchip.on span{color:inherit;opacity:.75}
.jobs-q{height:32px;max-width:260px;border-radius:var(--r-sm)}
.jobs-q input{border:0;background:transparent;outline:none;padding:0;flex:1;min-width:0;height:100%}
.view-tools .seg .count{font:500 11px var(--f-mono);opacity:.7}

/* job page */
.job-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.job-actions .btn svg.i{width:15px;height:15px}
.chip.jst{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);font-weight:700}
.chip .dot.round{background:var(--c)}
.ip-sec-h .spacer{flex:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{position:relative;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;min-width:0}
.mcard:hover{box-shadow:var(--shadow-2)}
.mc-open{display:flex;flex-direction:column;width:100%;text-align:left}
.mc-thumb{aspect-ratio:16/10;background:#e9eef5;display:grid;place-items:center;overflow:hidden}
.mc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mc-thumb span svg.i{width:38px;height:38px;color:#94a3b8}
.mc-body{padding:10px 12px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc-name{font:700 14.5px/1.3 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
.mc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.mc-kind{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-weight:600}
.mc-kind svg.i{width:13px;height:13px}
.mc-sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok)}
.mc-sync svg.i{width:14px;height:14px}
.mc-sync.uploading,.mc-sync.pending{color:var(--muted)}
.mc-sync.error{color:var(--signal-ink)}
.mc-sync .spin{width:12px;height:12px;border-width:2px}
.mc-more{position:absolute;right:8px;top:8px;background:var(--surface);box-shadow:var(--shadow-1)}
.madd{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:16px;border:1.5px dashed var(--line-2);border-radius:13px;text-align:left;min-height:120px;color:var(--ink-2)}
.madd:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.madd svg.i{width:24px;height:24px;color:var(--accent);margin-bottom:4px}
.madd b{font:700 14px var(--f-display)}
.madd span{font-size:12px;color:var(--muted)}
.job-tasks .quickadd{margin:8px}
.job-past{margin-top:8px}
.job-past summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:6px 4px}
.pick-maps{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;margin-top:8px}
.pm-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.pm-row:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pm-th{width:64px;height:42px;border-radius:6px;overflow:hidden;background:#e9eef5;display:grid;place-items:center;flex:none}
.pm-th img{width:100%;height:100%;object-fit:cover}
.pm-t{display:flex;flex-direction:column;min-width:0}
.pm-t small{color:var(--muted)}

/* sign in */
#auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 10%,#13254a,#070c17 60%)}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:12px;padding:28px 26px;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-2)}
.auth-logo .brand-mark{width:56px;height:56px;display:block}
.auth-card h1{margin:4px 0 0;font:700 24px/1.2 var(--f-display)}
.auth-sub{margin:0 0 6px;color:var(--muted)}
.auth-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.auth-card input{height:42px;font-size:16px}
.auth-err{min-height:18px;color:var(--danger);font-size:13px}
.auth-go{height:44px;justify-content:center;font-size:15px}
.auth-foot{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* tablets / phones */
@media (max-width:1180px){ .home-grid{grid-template-columns:minmax(0,1fr)} .home-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .hub-tabs{order:2}
  .hub-tab span{display:none}
  .hub-tab{padding:0 11px}
}
@media (max-width:700px){
  .hub-tabs{display:none}
  .hub-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:10px;font-size:10.5px;font-weight:650;color:var(--muted);min-width:0}
  .hb svg.i{width:22px;height:22px}
  .hb.on{color:var(--accent)}
  .content{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  body:not(.tool-mode) .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  body.tool-mode .appbar,body.tool-mode .hub-bottom{display:none}
  .hw{grid-template-columns:repeat(7,minmax(74px,1fr));overflow-x:auto;padding-bottom:4px}
  .hs-row{grid-template-columns:52px 4px minmax(0,1fr);gap:10px}
  .hs-ppl{grid-column:3;margin-top:-2px}
  .hc-h h2{font-size:16px}
  .tool-btns{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .madd{min-height:96px;padding:12px}
  .jgrid{grid-template-columns:1fr}
  .job-actions .btn{flex:1 1 44%}
  .home-stats b{font-size:20px}
}
/* sign-in: tabs, waiting screen */
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.auth-tabs button{padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.auth-tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.auth-card.gate{text-align:left}
.gate-acts{display:flex;gap:8px;margin-top:6px}
.auth-paste{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}

/* ===================== Field management ===================== */
:root{--c-rev:#2a78d6;--c-exp:#eb6834;--c-prof:#1baf7a;--ok-ink:#157347}
:root:not([data-bs-theme="light"]){--c-rev:#3987e5;--c-exp:#d95926;--c-prof:#199e70;--ok-ink:#4ED69A}
.fm-hide{display:none!important}
.spacer{flex:1}
.neg{color:var(--danger)!important}
.hint,.sf small,.field small{font-size:12px;color:var(--muted);font-weight:400}

/* ---------- sidebar ---------- */
.nav{gap:1px}
.nav-top{display:flex;align-items:center;gap:2px;border-radius:var(--r-sm)}
.nav-item.nav-main{flex:1;min-width:0;padding:8px 10px;font-weight:550;color:var(--ink-2)}
.nav-top.here>.nav-item.nav-main{color:var(--ink)}
.nav-top.here>.nav-item.nav-main svg.i{color:var(--accent)}
.nav-caret{width:26px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--faint);flex:none}
.nav-caret:hover{background:var(--hover);color:var(--ink)}
.nav-caret svg{width:11px;height:11px;transition:transform .15s}
.nav-caret[aria-expanded="true"] svg{transform:rotate(90deg)}
.nav-kids{display:flex;flex-direction:column;gap:1px;margin:1px 0 6px 17px;padding-left:9px;border-left:1px solid var(--line)}
.nav-kids .nav-item.sub{padding:6px 9px;font-size:13px;color:var(--ink-2)}
.nav-kids .nav-item.sub.active{color:var(--ink)}
.nav-kids .nav-item.add{color:var(--muted)}
.nav-kids .nav-item.add:hover{color:var(--accent)}
.nav-label{margin:14px 10px 4px;font:700 10.5px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.nav-sep{height:1px;background:var(--line);margin:12px 6px 8px}
.side-lists{margin:2px 0 4px}
.side-lists[hidden]{display:none}
.nav-kids .side-lists .side-head{padding-left:9px;margin-top:6px}
.nav-kids .side-lists .tree-row{--indent:8px}
.nav-kids .tree-add{padding-left:9px}

/* ---------- dashboard ---------- */
.dash .view-head{padding-bottom:4px}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start;margin-top:10px}
.dw{grid-column:span var(--span,12);border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1);min-width:0;display:flex;flex-direction:column;position:relative;container-type:inline-size}
.dw.fixed{height:var(--h)}
.dw.fixed .dw-b{flex:1;overflow:auto;min-height:0}
.dw-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 16px 4px}
.dw-h h2{margin:0;flex:1;display:flex;align-items:center;gap:8px;font:700 16px/1.2 var(--f-display);min-width:120px}
.dw-h h2 svg.i{width:18px;height:18px;color:var(--accent)}
.dw-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dw-act .btn svg.i{width:14px;height:14px}
.dw-b{padding:8px 16px 16px;min-width:0}
.dw.flash{animation:dwflash 1.4s ease}
@keyframes dwflash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow-1)}}
.dash.editing .dw{outline:1.5px dashed var(--accent-line);outline-offset:3px}
.dash.editing .dw-b{pointer-events:none;user-select:none}
.dash.editing .dw-b>*{opacity:.85}
.dw-grip{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--muted);cursor:grab;touch-action:none;background:var(--surface-2);border:1px solid var(--line)}
.dw-grip:active{cursor:grabbing}
.dw-ed{display:flex;align-items:center;gap:4px}
.dw-sizes .seg-b{min-width:34px}
.dw-x:hover{color:var(--danger)}
.dw-up,.dw-down{display:none}
.dw-rs{position:absolute;right:2px;bottom:2px;width:26px;height:26px;display:grid;place-items:center;color:var(--accent);cursor:nwse-resize;touch-action:none;border-radius:6px;background:var(--surface)}
.dw-rs svg.i{width:15px;height:15px}
.dw.dragging{box-shadow:var(--shadow-2);opacity:.93;cursor:grabbing}
.dw.sizing{outline-style:solid!important}
.dw-ph{grid-column:span var(--span,12);border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);opacity:.6}
.dash-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin:6px 0 4px;border:1px solid var(--accent-line);background:color-mix(in srgb,var(--accent-soft) 85%,var(--surface));border-radius:12px;box-shadow:var(--shadow-1)}
.dash-bar b{display:block;font-size:14px}
.dash-bar span{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.dash-bar span svg.i{width:14px;height:14px}
.dash-foot{display:flex;justify-content:flex-end;padding:22px 0 40px}
.dash-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:50px 20px;border:1.5px dashed var(--line-2);border-radius:14px;color:var(--muted);text-align:center}
.dash-empty svg.i{width:30px;height:30px;color:var(--faint)}
.dash-empty b{color:var(--ink);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@container (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (max-width:460px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);min-width:0}
.kpi:hover{border-color:var(--accent-line)}
.kpi b{font:700 23px/1.1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi small{font-size:11.5px;color:var(--muted)}
.kpi.bad b,.kpi.bad small{color:var(--danger)}
.dw[data-w="tasks"] .task{padding-left:6px}
@container (max-width:520px){.hw{grid-template-columns:repeat(4,minmax(0,1fr))}.hs-row{grid-template-columns:52px 4px minmax(0,1fr)}.hs-ppl{display:none}}
.qmini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.qmini button{display:flex;flex-direction:column;align-items:flex-start;padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:left;min-width:0}
.qmini button:hover{border-color:var(--accent-line)}
.qmini span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qmini b{font:700 18px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.qmini small{font-size:11px;color:var(--faint)}
.qrows,.xrows{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.xw-tot{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.xw-tot b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.xw-tot span{font-size:12.5px;color:var(--muted)}
.xw-cats{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.xw-cat{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.xw-cat>span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xw-cat .dot{width:8px;height:8px}
.xw-bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.xw-bar i{display:block;height:100%;background:var(--c-exp);border-radius:0 4px 4px 0}
.xw-cat b{font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.nw{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.nw-it{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-top:3px solid var(--c);background:var(--surface-2);position:relative;min-width:0}
.nw-it:hover{border-color:var(--accent-line)}
.nw-it b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:14px}
.nw-it span{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nw-pin{position:absolute;right:8px;top:8px}.nw-pin svg{width:12px;height:12px;color:var(--muted)}
.cw{display:flex;flex-direction:column;gap:2px}
.cw-row{display:grid;grid-template-columns:auto minmax(80px,auto) 1fr;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;text-align:left}
.cw-row:hover{background:var(--hover)}
.cw-n{font-weight:600;font-size:13.5px;white-space:nowrap}
.cw-w{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-w small{color:var(--muted)}
.cw-w.free{color:var(--faint)}
.cw-w.off{color:var(--signal-ink)}
.wpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.wpick-it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wpick-it:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.wpick-it:disabled{opacity:.55;cursor:default}
.wpick-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.wpick-t b{display:block;font-size:14px}
.wpick-t small{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.wpick-s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.wpick-s svg.i{color:var(--accent)}

/* ---------- profit & expenses chart ---------- */
.fin{position:relative}
.fin-sum{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;margin-bottom:8px}
.fin-sum>div{display:flex;flex-direction:column}
.fin-sum span{font-size:12px;color:var(--muted)}
.fin-sum b{font:700 21px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.fin-sum small{font-size:11.5px;color:var(--muted)}
.fin-when{margin-left:auto;font-size:12px;color:var(--faint)}
.fin-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.fin-legend span,.fin-tip span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.rev{background:var(--c-rev)}.sw.exp{background:var(--c-exp)}
.ln{width:14px;height:2px;border-radius:1px;background:var(--c-prof);display:inline-block;position:relative}
.ln::after{content:"";position:absolute;left:4px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c-prof)}
.fin-plot{position:relative;height:210px;margin-top:4px}
.dw.fixed .fin-plot{height:max(160px,calc(var(--h) - 190px))}
.fin-area{position:absolute;left:48px;right:4px;top:8px;bottom:24px}
.fin-gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.fin-gl.zero{border-top-color:var(--line-2)}
.fin-gl span{position:absolute;right:calc(100% + 8px);top:-8px;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.fin-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.fin-m{position:relative;height:100%;cursor:default}
.fin-m::before{content:"";position:absolute;inset:0 2px;border-radius:6px;background:transparent}
.fin-m.hot::before{background:var(--hover)}
.fin-bars{position:absolute;inset:0;display:block}
.fin-bars .b{position:absolute;width:min(22px,28%);border-radius:4px 4px 0 0}
.fin-bars .b.rev{left:calc(50% - min(22px,28%) - 1px);background:var(--c-rev)}
.fin-bars .b.exp{left:calc(50% + 1px);background:var(--c-exp)}
.fin-x{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font:500 11px var(--f-mono);color:var(--muted)}
.fin-line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fin-line polyline{fill:none;stroke:var(--c-prof);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fin-dot{position:absolute;width:9px;height:9px;margin:0 0 -4.5px -4.5px;border-radius:50%;background:var(--c-prof);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.fin-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);z-index:3;display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-2);font-size:12px;white-space:nowrap;pointer-events:none;color:var(--ink-2)}
.fin-tip>b{color:var(--ink);font-size:12.5px}
.fin-tip span b{margin-left:auto;padding-left:12px;color:var(--ink);font-family:var(--f-mono);font-weight:600}
.fin-empty{position:absolute;inset:0 0 24px 48px;display:grid;place-items:center;font-size:13px;color:var(--muted);text-align:center;padding:10px}

/* ---------- quotes list ---------- */
.qtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 6px}
.qtiles>div{padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.qtiles span{display:block;font-size:12px;color:var(--muted)}
.qtiles b{display:block;font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.qtiles small{font-size:11.5px;color:var(--muted)}
.qlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.qrow{display:grid;grid-template-columns:92px minmax(0,1fr) 90px 92px 110px;gap:12px;align-items:center;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow:not(.head):hover{background:var(--hover)}
.qrow.head{font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 14px}
.qr-num{font:600 12.5px var(--f-mono);color:var(--ink-2)}
.qr-main{min-width:0;display:flex;flex-direction:column}
.qr-main b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr-main small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr-date{font-size:12.5px;color:var(--muted)}
.qr-amt{text-align:right;font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.qst{justify-self:start;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--c) 80%,var(--ink));background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.qst::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.qrow.compact{grid-template-columns:auto minmax(0,1fr) auto auto;padding:8px 6px;border:0;border-radius:9px}
.qrow.compact .qr-num{font-size:11.5px}
.qrows .qrow.compact,.qlist .qrow.compact{border-bottom:0}
.dw .qrow.compact .qr-amt{font-size:13px}

/* ---------- full-screen work areas ---------- */
.fm-screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:translateY(8px);transition:opacity .16s ease,transform .16s ease;padding-top:env(safe-area-inset-top,0px)}
.fm-screen.in{opacity:1;transform:none}
.fm-screen:focus{outline:none}
body.screen-open .hub-bottom{display:none!important}
.qb-top,.qv-top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;min-height:60px}
.qb-back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 6px;border-radius:9px;color:var(--ink-2);font-weight:600;max-width:220px}
.qb-back:hover{background:var(--hover);color:var(--ink)}
.qb-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb-id{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.qb-num{font:600 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.qb-title{flex:1;min-width:80px;font:700 19px/1.2 var(--f-display);border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:8px}
.qb-title:hover{border-color:var(--line)}
.qb-title:focus{background:var(--surface);border-color:var(--accent)}
.qb-saved{font-size:12px;color:var(--muted);white-space:nowrap}
.qb-saved.busy{color:var(--signal-ink)}
.qb-acts,.qv-acts{display:flex;align-items:center;gap:8px}
.qb-banner{flex:none}
.qb-banner[hidden]{display:none}
.qbn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 18px;font-size:13.5px;border-bottom:1px solid var(--line)}
.qbn>svg.i{width:18px;height:18px;flex:none}
.qbn>span{flex:1;min-width:200px}
.qbn.ok{background:var(--ok-soft);color:var(--ok-ink)}.qbn.ok b{color:inherit}
.qbn.bad{background:var(--danger-soft);color:var(--danger)}
.qbn.warn{background:var(--signal-soft);color:var(--signal-ink)}
.qbn.info{background:var(--accent-soft);color:var(--ink)}
.qb-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.qb-body{max-width:1320px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.qb-side{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px}
.qb-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.qb-main>.qb-fs{display:flex;flex-direction:column;gap:16px}
.qb-fs{border:0;margin:0;padding:0;min-width:0}
.qb-side>.qb-fs{display:flex;flex-direction:column;gap:14px}
.qb-bottom{display:none}
.qcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px 16px;box-shadow:var(--shadow-1);min-width:0}
.qcard>h2{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:700 15.5px/1.2 var(--f-display)}
.qcard>h2 svg.i{width:17px;height:17px;color:var(--accent)}
.qcard>h2 small{font:400 12px var(--f-body);color:var(--muted);margin-left:4px}
.qcard-sub{font:500 12px var(--f-body);color:var(--muted)}
.qfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.qf{display:flex;flex-direction:column;gap:4px;min-width:0}
.qf.wide{grid-column:1/-1}
.qf label{font-size:12px;font-weight:600;color:var(--ink-2)}
.qf label small{font-weight:400;color:var(--muted)}
.qf input,.qf select,.qf textarea{width:100%;height:36px}
.qf textarea,.qnotes{height:auto;resize:vertical;min-height:62px;line-height:1.45;width:100%}
.qf-chips{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.qf-chips button{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.qf-chips button:hover,.qf-chips button.on{border-color:var(--accent);color:var(--accent)}
/* sections and lines */
.qsec{border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;margin-bottom:12px;background:var(--surface-2)}
.qsec.sorting{box-shadow:var(--shadow-2);opacity:.95}
.qsec-h{display:flex;align-items:center;gap:6px}
.qsec-name{flex:1;min-width:0;font:700 15px var(--f-display);color:var(--accent);background:transparent;border:1px solid transparent;padding:6px 8px;border-radius:8px}
.qsec-name::placeholder{color:var(--faint);font-weight:500}
.qsec-name:hover{border-color:var(--line)}
.qsec-name:focus{background:var(--surface)}
.qsec-tot{font:700 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);padding:0 6px;white-space:nowrap}
.qsec-grip,.ql-grip{width:24px;height:30px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;border-radius:6px;flex:none}
.qsec-grip:hover,.ql-grip:hover{color:var(--ink);background:var(--hover)}
.qsec-desc{display:block;width:calc(100% - 8px);margin:2px 4px 6px;font-size:13px;font-style:italic;min-height:34px;resize:vertical;background:var(--surface)}
.ql-head{display:grid;grid-template-columns:24px minmax(0,1fr) 72px 64px 112px 104px 28px;gap:8px;padding:8px 4px 4px;font:700 10.5px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ql-head span:nth-child(n+3){text-align:right}
.ql-head span:nth-child(4){text-align:left}
.ql-head[hidden]{display:none}
.qlines{display:flex;flex-direction:column;gap:6px;min-height:4px}
.ql{display:grid;grid-template-columns:24px minmax(0,1fr) 72px 64px 112px 104px 28px;gap:8px;align-items:start;padding:8px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.ql.flash{animation:qlflash 1.4s ease}
@keyframes qlflash{0%,30%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}100%{}}
.ql.sorting{box-shadow:var(--shadow-2);opacity:.96}
.ql.opt{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,var(--surface-2) 8px,var(--surface-2) 16px)}
.ql.text{grid-template-columns:24px minmax(0,1fr) 28px}
.ql-item{display:flex;flex-direction:column;gap:3px;min-width:0}
.ql-name{font-weight:600;border:1px solid transparent;background:transparent;padding:5px 7px;height:32px;border-radius:7px}
.ql-name:hover,.ql-desc:hover{border-color:var(--line)}
.ql-name:focus,.ql-desc:focus{border-color:var(--accent);background:var(--surface)}
.ql-desc{font-size:12.5px;color:var(--ink-2);border:1px solid transparent;background:transparent;padding:3px 7px;border-radius:7px;resize:none;min-height:24px;line-height:1.4;overflow:hidden}
.ql-desc.note{font-style:italic;font-size:13px;min-height:32px}
.ql-meta{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 7px;font-size:11.5px;color:var(--muted)}
.ql-meta:empty{display:none}
.ql-meta span{display:inline-flex;align-items:center;gap:4px}
.ql-meta svg.i{width:12px;height:12px}
.ql-tag{color:var(--accent);font-weight:600}
.ql-tag.opt{color:var(--signal-ink)}
.ql-c{display:flex;flex-direction:column;gap:2px;min-width:0}
.ql-c>span:first-child{display:none;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ql-c input{height:32px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.ql-unit input{text-align:left}
.ql-tot{align-items:flex-end;padding-top:6px}
.ql-tot b{font:600 13.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ql-tot small{font-size:11px;color:var(--muted)}
.ql.opt .ql-tot b{color:var(--muted);text-decoration:line-through}
.ql-more{margin-top:3px}
.money-in{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);min-width:0}
.money-in:focus-within{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.money-in>span{padding:0 0 0 9px;color:var(--muted);font-size:13px}
.money-in.r>span{padding:0 9px 0 0}
.money-in input{border:0!important;outline:none!important;background:transparent;flex:1;min-width:0;width:100%}
.money-in.sm input{height:30px;padding:4px 7px 4px 3px}
.qadd{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qsearch{position:relative;flex:1;min-width:220px;display:flex;align-items:center}
.qsearch>svg.i{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.qs-in{width:100%;height:36px;padding-left:34px!important;border-style:dashed!important;background:var(--surface)}
.qs-in:focus{border-style:solid!important}
.qs-drop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow-2);padding:5px}
.qs-drop[hidden]{display:none}
.qs-head{padding:6px 9px 4px;font:700 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qs-o{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:7px;text-align:left}
.qs-o.on,.qs-o:hover{background:var(--accent-soft)}
.qs-n{flex:1;min-width:0;display:flex;flex-direction:column}
.qs-n b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.qs-n>svg.i{display:none}
.qs-n small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-o[data-k="custom"] .qs-n,.qs-o[data-k="save"] .qs-n{display:grid;grid-template-columns:auto 1fr;column-gap:8px}
.qs-o[data-k="custom"] .qs-n>svg.i,.qs-o[data-k="save"] .qs-n>svg.i{display:block;grid-row:span 2;color:var(--accent)}
.qs-p{font:600 13px var(--f-mono);white-space:nowrap}
.qs-p small{color:var(--muted);font-weight:400}
.qsec-add{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qsec-sug{display:flex;gap:6px;flex-wrap:wrap}
.qsec-sug button{font-size:12px;padding:4px 10px;border-radius:99px;border:1px dashed var(--line-2);color:var(--ink-2)}
.qsec-sug button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.sort-ph{border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);opacity:.7}
/* files */
.qdrop{border:1.5px dashed var(--line-2);border-radius:12px;padding:10px;transition:background .12s,border-color .12s}
.qdrop.over{border-color:var(--accent);background:var(--accent-soft)}
.qdrop-hint{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 4px;font-size:13px;color:var(--muted)}
.qdrop-hint small{flex-basis:100%;padding-left:24px;font-size:12px;color:var(--faint)}
.qfiles{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.qfile{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.qfile img,.qfile-ic{width:44px;height:44px;border-radius:7px;object-fit:cover;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.qfile-t{min-width:0;display:flex;flex-direction:column}
.qfile-t b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qfile-t small{font-size:11.5px;color:var(--muted)}
.qfile-int{font-size:11.5px;color:var(--faint);white-space:nowrap}
.qup-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 4px}
/* toggle switch */
.tgl{position:relative;display:inline-flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;user-select:none;color:var(--ink-2)}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl>span{width:32px;height:19px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.tgl>span::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tgl input:checked+span{background:var(--accent-strong)}
.tgl input:checked+span::after{transform:translateX(13px)}
.tgl input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tgl.sm{font-size:12px;gap:6px}
.tgl.sm>span{width:28px;height:17px}.tgl.sm>span::after{width:13px;height:13px}.tgl.sm input:checked+span::after{transform:translateX(11px)}
fieldset:disabled .tgl{opacity:.6;cursor:default}
.qb-fs:disabled .qadd,.qb-fs:disabled .qsec-add,.qb-fs:disabled .rte-bar,.qb-fs:disabled .ql-grip,.qb-fs:disabled .qsec-grip,.qb-fs:disabled .ql-more,.qb-fs:disabled [data-qa=sec-menu],.qb-fs:disabled [data-qa=add-files],.qb-fs:disabled [data-qa=add-ct],.qb-fs:disabled [data-qa=ct-save],.qb-fs:disabled [data-qa=ct-del],.qb-fs:disabled [data-qa=file-del],.qb-fs:disabled .qdrop-hint,.qb-fs:disabled .qf-chips{display:none!important}
.qb-fs:disabled input,.qb-fs:disabled textarea,.qb-fs:disabled select{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
/* contracts */
.qct{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;background:var(--surface-2)}
.qct-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.qct-title{flex:1;min-width:0;font-weight:700;font-size:14.5px;height:34px;background:var(--surface)}
.qct .rte-bar{position:static;background:var(--surface)}
.qct-body{background:var(--surface);min-height:110px;font-size:13.5px}
.qct-empty{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:13px}
.qct-empty svg.i{width:22px;height:22px;flex:none}
/* totals side */
.qt-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.qt-row>span:first-child{color:var(--ink-2);min-width:62px}
.qt-row b{margin-left:auto;font:600 13.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.qt-in{display:flex;align-items:center;gap:4px}
.qt-in input{width:64px;height:30px;text-align:right;padding:4px 7px}
.qt-in i{font-style:normal;color:var(--muted);font-size:12.5px}
.seg.xs button{height:26px;padding:0 8px;font-size:12px}

/* dialogs */
.modal.wide{width:min(860px,100%)}

.modal .field label small{font-weight:400}

.iform,.xform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px}
.iform .field,.xform .field{margin:6px 0}
.if-wide,.xf-wide{grid-column:1/-1}
.modal .iform textarea{min-height:0;font:inherit;line-height:1.45}
.iform .money-in input,.xform .money-in input{height:34px}
.if-margin{color:var(--ok-ink)!important;font-weight:600!important}
.modal .field .seg{align-self:flex-start}
.xf-amt .money-in{height:46px}

.xcats{display:flex;flex-wrap:wrap;gap:6px}
.xcat{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.xcat .dot{width:8px;height:8px;background:var(--c)}
.xcat[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);font-weight:600}
.rc-add{display:flex;gap:8px;flex-wrap:wrap}
.rc-file{display:grid;grid-template-columns:52px 1fr auto auto;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px}
.rc-file img,.rc-ic{width:52px;height:52px;border-radius:8px;object-fit:cover;display:grid;place-items:center;background:var(--sunken)}
.rc-t{min-width:0;display:flex;flex-direction:column}.rc-t b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc-t small{font-size:11.5px;color:var(--muted)}
.rc-busy{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:10px 0}
.nq-tpls{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.nq-tpl{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer}

.bl-tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}

.bl-cats{display:flex;gap:6px;flex-wrap:wrap}

.bl-list{display:flex;flex-direction:column;gap:4px;max-height:min(52vh,460px);overflow:auto;padding:2px}
.bl-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.bl-row:hover{border-color:var(--accent-line)}
.bl-row.on{border-color:var(--accent);background:var(--accent-soft)}
.bl-n{min-width:0;display:flex;flex-direction:column}.bl-n b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bl-n small{font-size:11.5px;color:var(--muted)}
.bl-p{font:600 13px var(--f-mono);white-space:nowrap}.bl-p small{color:var(--muted);font-weight:400}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:30px;height:30px;font-size:16px;color:var(--ink-2)}
.stepper button:hover{background:var(--hover)}
.stepper input{width:46px;height:30px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;padding:0}
.imp-prev{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12.5px}
.imp-prev>div{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:5px 8px;border-radius:6px;background:var(--surface-2)}

/* send dialog */
.send-sum{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:4px}

.send-sum span{font-size:12.5px;color:var(--muted)}
.send-warn{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--signal-soft);color:var(--signal-ink)!important;font-size:13px}
.modal #sd-msg{min-height:160px;font:13.5px/1.5 var(--f-body)}
.chips-in{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:4px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}

.cc-list{display:contents}
.cc-chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 9px;border-radius:99px;background:var(--accent-soft);font-size:12.5px}
.cc-chip button{width:20px;height:20px;display:grid;place-items:center;border-radius:50%}
.cc-chip button:hover{background:var(--hover)}
.cc-chip svg.i{width:11px;height:11px}
.chips-in input{flex:1;min-width:180px;border:0!important;outline:none!important;height:28px;background:transparent}
.send-how{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.send-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;border:1px solid var(--line-2);text-align:left;background:var(--surface)}

.send-opt b{font-size:13.5px}
.send-opt span{font-size:12px;color:var(--muted)}
.send-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.send-opt.primary{border-color:var(--accent);background:var(--accent-soft)}
.send-opt:disabled{opacity:.5}
.send-busy{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.send-busy[hidden]{display:none}
/* item library */
.itable{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.irow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 84px 100px 66px;gap:12px;align-items:center;width:100%;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow:not(.head):hover{background:var(--hover)}
.irow.head{font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.ir-name{min-width:0;display:flex;flex-direction:column}
.ir-name b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir-name small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir-sku{font:12.5px var(--f-mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir-mfr{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir-cat{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.ir-num{text-align:right;font:13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ir-num small{color:var(--muted)}
.ir-m{color:var(--ok-ink)}
.ctlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.ctcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column}
.ct-main{text-align:left;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px}
.ct-main b{font:700 15px var(--f-display)}
.ct-main span{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ct-foot{display:flex;align-items:center;gap:6px;padding:8px 10px 10px 14px;border-top:1px solid var(--line)}
.ct-rte{min-height:220px;max-height:46vh;overflow:auto}
/* expenses */
.xview .xsum{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:12px 0 16px}
.xsum-tot span{display:block;font-size:12px;color:var(--muted)}
.xsum-tot b{display:block;font:700 26px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.xsum-tot small{font-size:12px;color:var(--muted)}
.xview .xsum .xw-cats{margin:0}
.xgroup{margin-bottom:18px}
.xgroup h3{display:flex;justify-content:space-between;margin:0 0 6px;padding:0 6px;font:700 13px var(--f-body);color:var(--muted)}
.xgroup h3 b{font-family:var(--f-mono);color:var(--ink)}
.xgroup .xrows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);gap:0}
.xrow{display:grid;grid-template-columns:62px minmax(0,1fr) 150px 26px 104px;gap:12px;align-items:center;width:100%;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.xgroup .xrow:last-child{border-bottom:0}
.xrow:hover{background:var(--hover)}
.xr-date{font:12.5px var(--f-mono);color:var(--muted)}
.xr-main{min-width:0;display:flex;flex-direction:column}
.xr-main b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr-main small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr-cat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.xr-cat .dot{width:8px;height:8px;background:var(--c)}
.xr-rc{color:var(--muted)}.xr-rc svg.i{width:15px;height:15px}
.xr-amt{text-align:right;font:600 13.5px var(--f-mono);font-variant-numeric:tabular-nums}
.xrow.compact{grid-template-columns:52px minmax(0,1fr) 20px auto;padding:7px 6px;border:0;border-radius:9px}
.xview select,.lib select{height:30px;padding:0 8px;font-size:13px}
/* job page */
.jtabs{display:flex;gap:2px;margin:14px 0 2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--surface)}
.jtabs::-webkit-scrollbar{display:none}
.jtab{display:inline-flex;align-items:center;gap:7px;padding:10px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.jtab svg.i{width:15px;height:15px}
.jtab:hover{color:var(--ink)}
.jtab.on{color:var(--ink);border-bottom-color:var(--accent)}
.jtab.on svg.i{color:var(--accent)}
.jtab .count{font:500 11.5px var(--f-mono);color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 6px}
.jtab-body{padding-top:8px}
.jsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.jsum-c{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;min-width:0}
.jsum-c:hover{border-color:var(--accent-line)}
.jsum-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.jsum-l svg.i{width:14px;height:14px}
.jsum-c b{font:700 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jsum-c small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.jq-acc{font-size:12.5px;color:var(--ok-ink);font-weight:600;margin-right:6px}
.jmoney{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.jmoney>div{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.jmoney span{display:block;font-size:12px;color:var(--muted)}
.jmoney b{display:block;font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.jmoney small{font-size:11.5px;color:var(--muted)}
.jx-cats{max-width:560px}
.ip .qlist{margin-top:4px}
/* settings */
.settings{max-width:860px}
.scard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px 18px;margin:14px 0;box-shadow:var(--shadow-1)}
.scard>h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:700 16px var(--f-display)}
.scard>h2 svg.i{width:18px;height:18px;color:var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.sf{display:flex;flex-direction:column;gap:5px;min-width:0}
.sf.wide{grid-column:1/-1}
.sf label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sf>input,.sf textarea{width:100%;height:36px}
.sf textarea{height:auto;line-height:1.45;resize:vertical}
.sf .money-in input{height:34px}
.s-logo{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;margin-bottom:16px}
.s-logo-prev{height:90px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:#fff;overflow:hidden;padding:8px}
.s-logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.s-logo-prev span{display:flex;flex-direction:column;align-items:center;color:#8a8f98;font-size:12px}
.s-logo p{margin:4px 0 8px;font-size:12.5px;color:var(--muted)}
.s-colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.s-sw{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line-2) inset;position:relative}
.s-sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.s-sw.custom{display:grid;place-items:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);color:#fff;cursor:pointer;overflow:hidden}
.s-sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.s-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.s-p{margin:0 0 10px;color:var(--ink-2)}

/* ---------- smaller screens ---------- */
@media (max-width:1100px){
  .qb-body{grid-template-columns:minmax(0,1fr)}
  .qb-side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .qb-side>.qb-fs{display:contents}
  .qtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .jsum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .irow{grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) 84px 100px}
  .irow>.ir-mfr,.irow>.ir-m,.irow.head>span:nth-child(3),.irow.head>span:nth-child(7){display:none}
}
@media (max-width:900px){
  .dgrid{grid-template-columns:repeat(6,minmax(0,1fr))}

  .dgrid{grid-template-columns:minmax(0,1fr);gap:12px}

  .fin-area{left:40px}
  .qb-top{padding:8px 10px;gap:6px;min-height:54px}

  .qb-back{padding:0 4px}
  .qb-acts .btn{padding:0 10px}
  .qb-acts [data-qa="preview"],.qb-acts [data-qa="send"]{display:none}
  .qb-title{font-size:16px;padding:4px 6px}
  .qb-id .qst{display:none}
  .qb-body{padding:12px 10px 110px;gap:12px}
  .qb-side{display:flex}
  .qcard{padding:12px 12px 14px;border-radius:12px}
  .qfields{grid-template-columns:minmax(0,1fr)}
  .qsec{padding:8px 6px 10px}
  .ql-head{display:none!important}
  .ql{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 28px;grid-template-areas:"g i i m" "g q u m" "g p t m";row-gap:6px;padding:8px 4px 10px}
  .ql.text{grid-template-areas:"g i m";grid-template-columns:24px minmax(0,1fr) 28px}
  .ql>.ql-grip{grid-area:g}.ql>.ql-item{grid-area:i}.ql>.ql-qty{grid-area:q}.ql>.ql-unit{grid-area:u}.ql>.ql-price{grid-area:p}.ql>.ql-tot{grid-area:t}.ql>.ql-more{grid-area:m}
  .ql-c>span:first-child{display:block}
  .ql-tot{justify-content:flex-end;padding-top:0}
  .ql-tot b{font-size:14.5px;padding-top:15px}
  .qadd .btn span{display:none}
  .qsearch{min-width:100%;order:-1}
  .qfile{grid-template-columns:40px minmax(0,1fr) auto auto;}
  .qfile .tgl{grid-column:2/-1;justify-self:start}
  .qb-bottom{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);flex:none}
  .qbb-tot{flex:1;display:flex;flex-direction:column;line-height:1.15}
  .qbb-tot span{font-size:11.5px;color:var(--muted)}
  .qbb-tot b{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
  .qv-top{padding:8px 10px;gap:6px}
  .qv-acts .btn span,.qv-top .qb-back span{display:none}
  .qv-title span{display:none}
  .qv-pages{padding:12px 6px 40px;gap:10px}
  .qtiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .qtiles b{font-size:18px}
  .qrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m a" "m s";row-gap:4px;padding:10px 12px}
  .qrow.head{display:none}
  .qrow .qr-num,.qrow .qr-date{display:none}
  .qrow .qr-main{grid-area:m}.qrow .qr-amt{grid-area:a}.qrow .qst{grid-area:s;justify-self:end}
  .qrow.compact{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m a" "m s"}
  .modal.wide,.modal.mid{width:100%}
  .iform,.xform{grid-template-columns:minmax(0,1fr)}
  .irow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .irow.head{display:none}
  .irow>.ir-sku,.irow>.ir-mfr,.irow>.ir-m,.irow>.ir-cat{display:none}
  .irow>.ir-num:not(.ir-m):nth-child(5){display:none}
  .xview .xsum{grid-template-columns:minmax(0,1fr)}

}
/* inline-edit fields read as text until you hover or type in them (both themes) */
.fm-screen.qb .ql-name,.fm-screen.qb .ql-desc,.fm-screen.qb .qsec-name,.fm-screen.qb .qb-title,:root .money-in input,:root .chips-in input{background-color:transparent}
