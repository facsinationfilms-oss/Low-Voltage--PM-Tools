<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your quote</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F5F7">
<link rel="icon" href="favicon-64.png">
<style>
:root{--accent:#0B2A55;--bg:#F1F2F4;--surface:#fff;--ink:#14171c;--ink2:#3d434c;--muted:#6b7280;--line:#e2e4e8;--ok:#13794a;--okbg:#e3f4ea;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;--r:14px;--f:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 120px}
.head{display:flex;align-items:center;gap:14px;padding:6px 0 18px}
.logo{max-height:52px;max-width:220px;object-fit:contain}
.coname{font-weight:800;font-size:20px;color:var(--accent);letter-spacing:-.01em}
.head .spacer{flex:1}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.contact a{font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:99px}
.contact a:hover{border-color:var(--accent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,40,.05);padding:20px 22px}
.sum{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:end}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 2px;font-size:26px;line-height:1.2;letter-spacing:-.015em}
.for{color:var(--ink2);font-size:14.5px}
.tot{text-align:right}
.tot span{display:block;font-size:12.5px;color:var(--muted)}
.tot b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.tot small{font-size:12.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.meta b{color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;white-space:nowrap;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:15px}
.btn:hover{border-color:#b9bec7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:#eceef1}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:13px 15px;border-radius:12px;font-size:14px}
.note b{display:block}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note:not(.ok):not(.bad):not(.warn){background:#f1f2f4;color:var(--ink2)}
.tot.paid b{color:var(--ok)}
.pay{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fafbfc}
.pay h2{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pay-t{white-space:pre-wrap;font-size:15px;line-height:1.5}
.pay p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.note svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.pages{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:22px}
.pages canvas{background:#fff;max-width:100%;height:auto!important;box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 30px rgba(0,0,0,.12);border-radius:3px}
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:60px 20px;color:var(--muted);font-weight:600}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.bar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;display:flex;flex-direction:column;line-height:1.2}
.bar .t span{font-size:12px;color:var(--muted)}
.bar .t b{font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}
.bar.show{display:block}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:20;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet p{margin:0 0 14px;color:var(--ink2);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-weight:650;font-size:13.5px}
.field input,.field textarea{border:1px solid #cfd3d9;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;width:100%}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.sigbox{position:relative;border:1.5px dashed #b8bec8;border-radius:12px;background:#fbfbfc;height:170px;touch-action:none}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;cursor:crosshair}
.sigbox .ph{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:#a2a8b2;font-size:14px;pointer-events:none}
.sigbox .line{position:absolute;left:24px;right:24px;bottom:30px;border-top:1px solid #c9ced6;pointer-events:none}
.sigtools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.typed{font:italic 38px/1 "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive;text-align:center;padding:30px 10px;color:#1b2a4a;min-height:110px;border:1.5px dashed #b8bec8;border-radius:12px;background:#fbfbfc;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);margin:14px 0 4px}
.chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
.sheet .acts{justify-content:flex-end}
.err{color:var(--bad);font-size:13.5px;min-height:1em;margin-top:6px}
.done{text-align:center;padding:50px 20px}
.done svg{width:56px;height:56px;color:var(--ok);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done h2{margin:10px 0 6px;font-size:24px}
.foot{margin-top:28px;text-align:center;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){
  .wrap{padding:14px 12px 120px}
  .sum{grid-template-columns:1fr}
  .tot{text-align:left}
  h1{font-size:22px}
  .card{padding:16px}
  .acts .btn{flex:1}
  .card .acts .btn.primary{flex-basis:100%}
  .sheet .acts .btn{flex:0 1 auto}
  .sheet .acts .btn.primary{flex:1}
  .head{padding-bottom:12px}
  .contact a{padding:5px 9px;font-size:12.5px}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><span class="spin"></span>Loading…</div></div>
<div class="bar" id="bar"></div>
<script src="supabase.js"></script>
<script>
(function(){
  'use strict';
  const URL_='https://supnxniswyhhewybtxlh.supabase.co', KEY='sb_publishable_X4WEE552X0yXK3kzG32Ytg_wtCWSt_h';
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const day=s=>{ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); };
  const stamp=s=>s?new Date(s).toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'';
  const I={check:'<path d="M20 6L9 17l-5-5"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',pen:'<path d="M3 21l3.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11z"/>',warn:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ok:'<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6"/>'};
  const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
  const token=new URLSearchParams(location.search).get('t')||'';
  let sb=null, Q=null, pdfBytes=null;
  try{ sb=window.supabase.createClient(URL_,KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'bs-quote-view'}}); }catch(e){}
  const fail=(title,msg)=>{ $('#app').innerHTML=`<div class="card" style="margin-top:40px;text-align:center;padding:40px 22px"><h1 style="font-size:22px">${esc(title)}</h1><p style="color:var(--ink2)">${msg}</p></div>`; };
  const pdfUrl=()=>URL_+'/storage/v1/object/public/quote-pdfs/'+Q.pdf_path.split('/').map(encodeURIComponent).join('/')+'?v='+encodeURIComponent(Q.updated_at||'');
  async function load(){
    if(!token) return fail('This link isn’t complete','Open the link from your email again, or ask for a new one.');
    if(!sb) return fail('Couldn’t load','Check your connection and reload the page.');
    let r; try{ r=await sb.rpc('get_quote_share',{p_token:token}); }catch(e){ return fail('Couldn’t load','Check your connection and reload the page.'); }
    if(r.error) return fail('Couldn’t load','Check your connection and reload the page.');
    if(!r.data) return fail('This link is no longer active','It may have been replaced by an updated version. Ask the sender for the latest link.');
    Q=r.data; render(); loadPdf();
  }
  function render(){
    const i=Q.info||{}, co=i.company||{};
    if(i.kind==='invoice') return renderInvoice(i,co);
    if(/^#[0-9a-f]{6}$/i.test(co.accent||'')) document.documentElement.style.setProperty('--accent',co.accent);
    document.title=`${i.number||'Quote'} – ${co.name||'Quote'}`;
    const expired=i.validUntil&&i.validUntil<new Date().toISOString().slice(0,10)&&(Q.status==='sent'||Q.status==='viewed');
    const open=(Q.status==='sent'||Q.status==='viewed')&&!expired;
    let state='';
    if(Q.status==='accepted') state=`<div class="note ok">${ic('ok')}<div><b>You accepted this quote${Q.signer_name?' — signed by '+esc(Q.signer_name):''}</b>${Q.responded_at?esc(stamp(Q.responded_at))+'. ':''}Thank you! ${esc(co.name||'We')} will be in touch about next steps.</div></div>`;
    else if(Q.status==='declined') state=`<div class="note bad">${ic('x')}<div><b>You declined this quote</b>${Q.responded_at?esc(stamp(Q.responded_at))+'. ':''}If that was a mistake or you’d like changes, contact ${esc(co.name||'us')}.</div></div>`;
    else if(expired) state=`<div class="note warn">${ic('clock')}<div><b>This quote expired on ${esc(day(i.validUntil))}</b>Contact ${esc(co.name||'us')} for an updated quote.</div></div>`;
    const contact=[co.phone?`<a href="tel:${esc(co.phone.replace(/[^\d+]/g,''))}">Call ${esc(co.phone)}</a>`:'',co.email?`<a href="mailto:${esc(co.email)}?subject=${encodeURIComponent('Question about quote '+(i.number||''))}">Email</a>`:''].join('');
    $('#app').innerHTML=`<header class="head">${co.logo?`<img class="logo" src="${co.logo}" alt="${esc(co.name)}">`:`<span class="coname">${esc(co.name||'')}</span>`}<span class="spacer"></span><div class="contact">${contact}</div></header>
      <section class="card"><div class="sum"><div><div class="kicker">Quote ${esc(i.number||'')}</div><h1>${esc(i.title||'Quote')}</h1><div class="for">Prepared for ${esc([i.customer,i.customerCompany].filter(Boolean).join(', ')||'you')}${i.from?' by '+esc(i.from):''}${co.name?' · '+esc(co.name):''}</div></div>
        <div class="tot"><span>Total</span><b>${money(i.total)}</b>${i.deposit?`<small>${money(i.deposit)} deposit due on acceptance</small>`:''}</div></div>
        <div class="meta"><span>Date <b>${esc(day(i.date))}</b></span>${i.validUntil?`<span>Valid until <b>${esc(day(i.validUntil))}</b></span>`:''}</div>
        ${state}
        <div class="acts">${open?`<button class="btn primary" id="accept">${ic('pen')}Accept & sign</button>`:''}<button class="btn" id="dl">${ic('dl')}Download PDF</button>${open?`<button class="btn ghost" id="decline">Decline</button>`:''}</div></section>
      <div class="pages" id="pages"><div class="loading"><span class="spin"></span>Loading the quote…</div></div>
      <div class="foot">${esc(co.name||'')}${co.website?' · '+esc(co.website):''}</div>`;
    const bar=$('#bar');
    if(open){ bar.innerHTML=`<div class="in"><div class="t"><span>${esc(i.number||'Quote')} total</span><b>${money(i.total)}</b></div><button class="btn primary" id="accept2">${ic('pen')}Accept & sign</button></div>`; bar.classList.add('show'); $('#accept2').onclick=acceptSheet; }
    else bar.classList.remove('show');
    if($('#accept')) $('#accept').onclick=acceptSheet;
    if($('#decline')) $('#decline').onclick=declineSheet;
    $('#dl').onclick=download;
  }
  function renderInvoice(i,co){
    if(/^#[0-9a-f]{6}$/i.test(co.accent||'')) document.documentElement.style.setProperty('--accent',co.accent);
    document.title=`Invoice ${i.number||''} – ${co.name||''}`;
    const t0=new Date(); const td=`${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')}`;
    const bal=Number(i.balance!=null?i.balance:i.total)||0, paid=Number(i.paid)||0;
    const st=i.state==='void'?'void':bal<=0.004&&(i.total>0||paid>0)?'paid':i.dueDate&&i.dueDate<td?'overdue':paid>0?'partial':'open';
    let state='';
    if(st==='paid') state=`<div class="note ok">${ic('ok')}<div><b>Paid in full — thank you!</b>${money(paid)} received.</div></div>`;
    else if(st==='overdue') state=`<div class="note bad">${ic('clock')}<div><b>Past due</b>This invoice was due ${esc(day(i.dueDate))}. ${money(bal)} is still owed.</div></div>`;
    else if(st==='partial') state=`<div class="note warn">${ic('clock')}<div><b>Partly paid</b>${money(paid)} received so far — thank you. ${money(bal)} left to pay.</div></div>`;
    else if(st==='void') state=`<div class="note">${ic('x')}<div><b>This invoice was cancelled</b>Nothing is owed on it.</div></div>`;
    const contact=[co.phone?`<a href="tel:${esc(co.phone.replace(/[^\d+]/g,''))}">Call ${esc(co.phone)}</a>`:'',co.email?`<a href="mailto:${esc(co.email)}?subject=${encodeURIComponent('Invoice '+(i.number||''))}">Email</a>`:''].join('');
    const dueTxt=!i.dueDate||i.dueDate<=i.date?'Due on receipt':'Due '+day(i.dueDate);
    const howPay=i.payInstr&&st!=='paid'&&st!=='void'?`<div class="pay"><h2>How to pay</h2><div class="pay-t">${esc(i.payInstr)}</div><p>Please include invoice <b>${esc(i.number||'')}</b> with your payment.</p></div>`:'';
    $('#app').innerHTML=`<header class="head">${co.logo?`<img class="logo" src="${co.logo}" alt="${esc(co.name)}">`:`<span class="coname">${esc(co.name||'')}</span>`}<span class="spacer"></span><div class="contact">${contact}</div></header>
      <section class="card"><div class="sum"><div><div class="kicker">Invoice ${esc(i.number||'')}</div><h1>${esc(i.title||'Invoice')}</h1><div class="for">Billed to ${esc([i.customer,i.customerCompany].filter(Boolean).join(', ')||'you')}${co.name?' · from '+esc(co.name):''}</div></div>
        <div class="tot ${st==='paid'?'paid':''}"><span>${st==='paid'?'Paid':'Amount due'}</span><b>${money(st==='paid'?paid:st==='void'?0:bal)}</b><small>${st==='paid'||st==='void'?'Invoice total '+money(i.total):paid>0?`of ${money(i.total)} · ${money(paid)} paid`:esc(dueTxt)}</small></div></div>
        <div class="meta"><span>Date <b>${esc(day(i.date))}</b></span>${st!=='paid'&&st!=='void'?`<span>Due <b>${i.dueDate&&i.dueDate>i.date?esc(day(i.dueDate)):'On receipt'}</b></span>`:''}</div>
        ${state}${howPay}
        <div class="acts"><button class="btn primary" id="dl">${ic('dl')}Download PDF</button></div></section>
      <div class="pages" id="pages"><div class="loading"><span class="spin"></span>Loading the invoice…</div></div>
      <div class="foot">${esc(co.name||'')}${co.website?' · '+esc(co.website):''}</div>`;
    $('#bar').classList.remove('show');
    $('#dl').onclick=download;
  }
  async function loadPdf(){
    const box=$('#pages');
    try{
      const res=await fetch(pdfUrl(),{cache:'no-store'}); if(!res.ok) throw new Error('missing');
      pdfBytes=new Uint8Array(await res.arrayBuffer());
      const pdfjs=await import(new URL('pdf.min.mjs',location.href).href);
      pdfjs.GlobalWorkerOptions.workerSrc=new URL('pdf.worker.min.mjs',location.href).href;
      const pdf=await pdfjs.getDocument({data:pdfBytes.slice(0)}).promise;
      box.innerHTML='';
      const w=Math.min(900,box.clientWidth||900), dpr=Math.min(2.5,window.devicePixelRatio||1);
      for(let p=1;p<=pdf.numPages;p++){ const pg=await pdf.getPage(p); const v0=pg.getViewport({scale:1}); const sc=w/v0.width; const vp=pg.getViewport({scale:sc*dpr}); const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height); c.style.width=Math.round(v0.width*sc)+'px'; c.setAttribute('aria-label','Page '+p+' of '+pdf.numPages); box.appendChild(c); await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; }
    }catch(e){ box.innerHTML=`<div class="loading">The document couldn’t be shown here. Use <b>&nbsp;Download PDF&nbsp;</b> to open it.</div>`; }
  }
  async function download(){
    const name=(Q.info&&Q.info.fileName)||((Q.info&&Q.info.kind==='invoice')?'invoice.pdf':'quote.pdf');
    try{ const b=pdfBytes?new Blob([pdfBytes],{type:'application/pdf'}):await (await fetch(pdfUrl())).blob(); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),8000); }
    catch(e){ location.href=pdfUrl(); }
  }
  function sheet(html){ const s=document.createElement('div'); s.className='scrim'; s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; s.addEventListener('mousedown',e=>{ if(e.target===s) s.remove(); }); document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ s.remove(); document.removeEventListener('keydown',k); } }); document.body.appendChild(s); return s; }
  function acceptSheet(){
    const i=Q.info||{};
    const s=sheet(`<h2>Accept quote ${esc(i.number||'')}</h2><p>${esc(i.title||'')} · <b>${money(i.total)}</b>${i.deposit?` · ${money(i.deposit)} deposit due`:''}</p>
      <div class="field"><label for="nm">Your full name</label><input id="nm" autocomplete="name" value="${esc(i.customer||'')}"></div>
      <div class="field"><label>Signature</label><div id="sigwrap"><div class="sigbox" id="sigbox"><canvas id="sig" aria-label="Sign here with your finger or mouse"></canvas><div class="line"></div><div class="ph" id="sigph">Sign here</div></div></div>
        <div class="sigtools"><button type="button" class="link" id="sigmode">Type my name instead</button><button type="button" class="link" id="sigclear">Clear</button></div></div>
      <label class="chk"><input type="checkbox" id="agree"><span>I’ve read the quote and its terms, and I accept them.</span></label>
      <div class="err" id="err"></div>
      <div class="acts"><button class="btn ghost" id="cancel">Cancel</button><button class="btn primary" id="go">${ic('check')}Accept & sign</button></div>`);
    let typed=false, drawn=false;
    const setupPad=()=>{ const cv=s.querySelector('#sig'), box=s.querySelector('#sigbox'); const r=box.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1); cv.width=r.width*dpr; cv.height=r.height*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=2.4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#14213d'; let last=null;
      const pt=e=>{ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
      cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); last=pt(e); g.beginPath(); g.arc(last.x,last.y,1.1,0,7); g.fillStyle='#14213d'; g.fill(); drawn=true; s.querySelector('#sigph').hidden=true; });
      cv.addEventListener('pointermove',e=>{ if(!last) return; const p=pt(e); g.beginPath(); g.moveTo(last.x,last.y); const mx=(last.x+p.x)/2, my=(last.y+p.y)/2; g.quadraticCurveTo(last.x,last.y,mx,my); g.lineTo(p.x,p.y); g.stroke(); last=p; });
      const end=()=>{ last=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
      s.querySelector('#sigclear').onclick=()=>{ g.clearRect(0,0,cv.width,cv.height); drawn=false; s.querySelector('#sigph').hidden=false; }; };
    setupPad();
    const nm=s.querySelector('#nm');
    s.querySelector('#sigmode').onclick=()=>{ typed=!typed; const w=s.querySelector('#sigwrap'); if(typed){ w.innerHTML=`<div class="typed" id="typed">${esc(nm.value||'Your name')}</div>`; s.querySelector('#sigmode').textContent='Draw my signature instead'; s.querySelector('#sigclear').hidden=true; } else { w.innerHTML='<div class="sigbox" id="sigbox"><canvas id="sig" aria-label="Sign here"></canvas><div class="line"></div><div class="ph" id="sigph">Sign here</div></div>'; s.querySelector('#sigmode').textContent='Type my name instead'; s.querySelector('#sigclear').hidden=false; drawn=false; setupPad(); } };
    nm.addEventListener('input',()=>{ const t=s.querySelector('#typed'); if(t) t.textContent=nm.value||'Your name'; });
    s.querySelector('#cancel').onclick=()=>s.remove();
    s.querySelector('#go').onclick=async()=>{
      const err=s.querySelector('#err'); err.textContent='';
      const name=nm.value.trim();
      if(!name){ err.textContent='Type your full name.'; nm.focus(); return; }
      if(!typed&&!drawn){ err.textContent='Sign in the box, or choose “Type my name instead”.'; return; }
      if(!s.querySelector('#agree').checked){ err.textContent='Tick the box to confirm you accept the quote and terms.'; return; }
      let sig;
      if(typed){ const c=document.createElement('canvas'); c.width=900; c.height=200; const g=c.getContext('2d'); g.fillStyle='#14213d'; g.textBaseline='middle'; let size=96; const fam='italic SIZEpx "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive'; g.font=fam.replace('SIZE',size); while(g.measureText(name).width>860&&size>30){ size-=6; g.font=fam.replace('SIZE',size); } g.fillText(name,20,100); sig=c.toDataURL('image/png'); }
      else { const cv=s.querySelector('#sig'); sig=trimCanvas(cv); }
      const b=s.querySelector('#go'); b.disabled=true; b.textContent='Sending…';
      try{ const r=await sb.rpc('respond_quote_share',{p_token:token,p_accept:true,p_name:name,p_signature:sig,p_note:''}); if(r.error) throw r.error; if(!r.data||!r.data.ok) throw new Error(r.data&&r.data.status==='accepted'?'already':'closed');
        s.remove(); Q.status='accepted'; Q.signer_name=name; Q.responded_at=new Date().toISOString(); render(); loadPdf(); thanks(true);
      }catch(e){ b.disabled=false; b.innerHTML=ic('check')+'Accept & sign'; err.textContent=e.message==='already'?'This quote was already accepted.':e.message==='closed'?'This quote can’t be accepted any more. Reload the page.':'Couldn’t send — check your connection and try again.'; }
    };
    setTimeout(()=>nm.focus(),50);
  }
  function trimCanvas(cv){ const g=cv.getContext('2d'); const {width:w,height:h}=cv; const d=g.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=0,y1=0; for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){ if(d[(y*w+x)*4+3]>20){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } if(x1<=x0||y1<=y0) return cv.toDataURL('image/png'); const pad=12; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w,x1+pad); y1=Math.min(h,y1+pad); const c=document.createElement('canvas'); const s=Math.min(1,700/(x1-x0)); c.width=Math.round((x1-x0)*s); c.height=Math.round((y1-y0)*s); c.getContext('2d').drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,c.width,c.height); return c.toDataURL('image/png'); }
  function declineSheet(){
    const s=sheet(`<h2>Decline this quote?</h2><p>Let ${esc((Q.info.company||{}).name||'us')} know why — it helps them send a better one. (Optional)</p><div class="field"><label for="why">Reason</label><textarea id="why" rows="4" maxlength="2000" placeholder="e.g. Over budget, went another way, need changes…"></textarea></div><div class="err" id="err"></div><div class="acts"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="go" style="border-color:var(--bad);color:var(--bad)">Decline quote</button></div>`);
    s.querySelector('#cancel').onclick=()=>s.remove();
    s.querySelector('#go').onclick=async()=>{ const b=s.querySelector('#go'); b.disabled=true; try{ const note=s.querySelector('#why').value.trim(); const r=await sb.rpc('respond_quote_share',{p_token:token,p_accept:false,p_name:'',p_signature:null,p_note:note}); if(r.error||!r.data||!r.data.ok) throw new Error('x'); s.remove(); Q.status='declined'; Q.responded_at=new Date().toISOString(); render(); loadPdf(); }catch(e){ b.disabled=false; s.querySelector('#err').textContent='Couldn’t send — check your connection and try again.'; } };
  }
  function thanks(){ const co=(Q.info&&Q.info.company)||{}; const s=sheet(`<div class="done">${ic('ok')}<h2>Thank you!</h2><p>Your acceptance has been sent to ${esc(co.name||'us')}. A signed copy of the quote will be available to download from this page shortly.</p><div class="acts" style="justify-content:center"><button class="btn primary" id="ok">Done</button></div></div>`); s.querySelector('#ok').onclick=()=>s.remove(); }
  load();
})();
</script>
